ite d’information et de prévention avec un professionnel de santé est obligatoire dans les 3 mois suivant la prise de poste (L4624-1)."],["Elle est facultative en dehors des métiers à risque, pour lesquels seule une surveillance médicale renforcée est exigée",0,"Faux : elle concerne tous les salariés, des suivis renforcés existent pour les postes à risque."],["Elle doit avoir lieu avant la première heure de travail",1,"Cette exigence ne s’applique qu’à certains postes à risque (suivi individuel renforcé)."]],"w":"Visite d’information et de prévention : dans les 3 mois de la prise de poste pour tous les salariés ; avant l’affectation pour les postes à risque particulier."},{"t":"SANTÉ ET SÉCURITÉ","who":"NovaSoft · direction","x":"Une entreprise de 85 salariés n’a pas de Document unique d’évaluation des risques professionnels. Le DRH dit : « Ce document n’est obligatoire que pour les entreprises industrielles. »","o":[["Vrai : seules les entreprises industrielles doivent l’établir, les activités de bureau et de services étant jugées peu exposées",0,"Faux : toutes les entreprises ayant au moins un salarié."],["Il n’est obligatoire qu’à partir de 250 salariés",0,"Faux : l’obligation est universelle."],["Faux : le DUERP est obligatoire dès le premier salarié, toutes entreprises, mis à jour chaque année dès 11 salariés",2,"Le document unique recense les risques, y compris psychosociaux. Son absence est sanctionnée et fragilise l’entreprise en cas d’accident."]],"w":"DUERP : obligatoire dès 1 salarié, mis à jour au moins annuellement à partir de 11 salariés et lors de tout changement important. Il inclut les risques psychosociaux."}]},"cse":{"cards":[{"t":"MISE EN PLACE","who":"NovaSoft · direction","x":"NovaSoft a dépassé 11 salariés depuis plusieurs années et n’a jamais organisé d’élections. Un manager dit : « On est une PME, on n’en a pas besoin. »","o":[["Attendre qu’un salarié ou un syndicat en fasse la demande, puis organiser les élections dans le mois",1,"L’employeur doit agir de sa propre initiative. En cas de demande d’un salarié ou d’un syndicat, il doit organiser les élections dans le mois."],["Attendre d’atteindre 50 salariés, seuil à partir duquel le CSE deviendra obligatoire, puis organiser les élections",0,"Faux : le CSE s’impose dès 11 salariés ; à 50, ses attributions s’élargissent."],["Rappeler que le CSE est obligatoire dès 11 salariés sur 12 mois consécutifs et lancer les élections",2,"L’employeur doit organiser les élections. Son inaction peut constituer un délit d’entrave."]],"w":"CSE obligatoire dès 11 salariés (effectif atteint 12 mois consécutifs). Avant 50 salariés : réclamations individuelles et collectives, santé et sécurité. À partir de 50 : attributions générales de consultation."},{"t":"MISE EN PLACE","who":"NovaSoft · RH","x":"Au premier tour des élections du CSE, seules des listes présentées par des syndicats étaient en lice. Seuls 40 % des inscrits ont voté. Un manager dit que l’élection est ratée et qu’il faut tout recommencer plus tard.","o":[["Faute de quorum (50 % des inscrits), un second tour a lieu avec des candidatures libres",2,"Le premier tour est réservé aux listes syndicales. Si le quorum n’est pas atteint, un second tour permet des candidatures libres."],["L’employeur désigne lui-même les membres parmi les salariés volontaires, faute de participation suffisante",0,"Les membres sont toujours élus, jamais désignés par l’employeur."],["Les élections sont annulées et reportées à l’an prochain, le temps de mieux informer et mobiliser les salariés",0,"Non : l’employeur doit organiser un second tour avec candidatures libres."]],"w":"Élections du CSE : 1er tour avec listes présentées par des syndicats ; si le quorum de 50 % n’est pas atteint, 2e tour avec candidatures libres. Le mandat dure 4 ans (de 2 à 4 par accord)."},{"t":"MISE EN PLACE","who":"NovaSoft · direction","x":"NovaSoft compte 85 salariés. Quelle est la composition de la délégation du personnel du CSE et combien d’heures de délégation chaque titulaire a-t-il par mois ?","o":[["6 titulaires et 6 suppléants ; 21 heures par mois pour chaque titulaire",0,"C’est le barème de 100 à 124 salariés."],["5 titulaires et 5 suppléants ; 19 h par mois par titulaire",2,"De 75 à 99 salariés : 5 titulaires, autant de suppléants, 19 heures de délégation par mois et par titulaire (total de 95 heures pour les titulaires)."],["4 titulaires et 4 suppléants ; 18 heures par mois pour chaque titulaire",0,"C’est le barème de 50 à 74 salariés."]],"w":"50-74 : 4 titulaires, 18 h. 75-99 : 5 titulaires, 19 h. 100-124 : 6 titulaires, 21 h. 200-249 : 10 titulaires, 22 h. 500-599 : 13 titulaires, 24 h."},{"t":"MISE EN PLACE","who":"NovaSoft · direction","x":"Un manager veut limiter le nombre de mandats successifs d’une élue qu’il juge « trop active ». Il dit qu’on ne peut pas faire plus de trois mandats.","o":[["Il n’existe aucune limite de mandats",1,"Dans les entreprises d’au moins 50 salariés, il existe une limite de trois mandats successifs. À vérifier selon le protocole préélectoral."],["La limite à 3 mandats successifs existe, mais elle ne s’applique qu’à certaines entreprises (50 salariés et plus) et peut être aménagée ; elle ne sert pas à écarter un élu actif",2,"Dans les entreprises d’au moins 50 salariés, le nombre de mandats successifs est limité à trois, avec des exceptions possibles par protocole. Utiliser cette règle pour écarter une élue est détourné de son objet."],["L’employeur peut décider seul de qui se représente",0,"Les candidatures sont libres ; l’employeur n’a aucun pouvoir sur les candidatures."]],"w":"Limite de trois mandats successifs à partir de 50 salariés (hors protocole contraire). L’employeur ne choisit jamais les candidats."},{"t":"INFORMER OU CONSULTER","who":"NovaSoft · direction","x":"La direction décide de fusionner deux squads et de modifier l’organisation du travail. Elle informe le CSE le jour de la mise en œuvre « pour qu’il soit au courant ».","o":[["Informer le CSE le jour de la mise en œuvre suffit : il n’a pas de pouvoir de décision, donc pas de consultation préalable",0,"Le CSE n’a pas de pouvoir de veto, mais l’employeur doit le consulter avant de décider. L’avis ne lie pas la direction, la consultation, elle, est obligatoire."],["Demander l’accord du CSE pour décider",1,"L’accord n’est pas requis : le CSE rend un avis. La direction reste libre de décider après consultation."],["Consulter le CSE avant la décision, avec informations suffisantes et délai raisonnable",2,"Une réorganisation importante exige une consultation préalable du CSE (L2312-8). Informer après coup constitue un manquement, voire un délit d’entrave."]],"w":"Information : on communique. Consultation : on recueille un avis avant de décider. Négociation : on conclut un accord. Le CSE donne un avis, il ne décide pas à la place de l’employeur."},{"t":"INFORMER OU CONSULTER","who":"NovaSoft · direction","x":"Le CSE doit rendre un avis sur un projet de réorganisation. La direction a transmis les documents le 1er septembre. Le CSE n’a rien répondu au 15 octobre et l’employeur veut passer à l’action.","o":[["Le délai légal de consultation est écoulé : avis réputé négatif, la direction peut décider",2,"Faute d’avis dans le délai, le CSE est réputé avoir été consulté et avoir rendu un avis négatif. Le délai est d’un mois, de deux avec expert, de trois en cas d’intervention de plusieurs instances."],["Le silence vaut avis favorable : la direction peut décider sans attendre davantage de réponse",0,"Faux : sans réponse, l’avis est réputé négatif."],["Il faut attendre indéfiniment la réponse du CSE, la direction ne pouvant décider sans son avis",0,"Faux : le délai est encadré, sinon le CSE pourrait bloquer."]],"w":"Délais de consultation : 1 mois, 2 mois si expert, 3 mois si plusieurs instances. Sans avis dans le délai : avis réputé négatif et décision possible."},{"t":"INFORMER OU CONSULTER","who":"NovaSoft · direction","x":"La direction veut installer un logiciel de suivi de l’activité des salariés. Le manager estime qu’il suffit de prévenir les équipes par courriel.","o":[["Installer le logiciel sans rien dire, pour mieux détecter les abus avant d’en parler aux équipes",0,"Un dispositif de contrôle secret est illicite : les preuves seraient écartées et l’entreprise sanctionnée."],["Informer et consulter le CSE avant la mise en place, informer les salariés, respecter le RGPD",2,"Tout moyen ou technique permettant un contrôle de l’activité des salariés exige l’information-consultation préalable du CSE (L2312-38) et l’information des salariés. Sans cela, les preuves recueillies peuvent être inopposables."],["Prévenir uniquement les salariés par courriel, avec la finalité du logiciel et la durée de conservation des données",0,"L’information des salariés est nécessaire mais ne remplace pas la consultation du CSE."]],"w":"Un outil de contrôle de l’activité exige consultation du CSE, information des salariés et conformité RGPD. Le contrôle caché est interdit."},{"t":"INFORMER OU CONSULTER","who":"NovaSoft · direction","x":"Un manager demande quels sujets doivent obligatoirement faire l’objet d’une consultation récurrente du CSE (entreprise de 50 salariés ou plus).","o":[["Seulement le budget de l’entreprise et les comptes annuels, présentés une fois par an",0,"C’est un seul sujet ; la situation économique et financière en est une partie, mais il y a trois consultations."],["Uniquement les sujets proposés par le CSE lui-même lors de ses réunions ordinaires, à son initiative",0,"Ces consultations sont obligatoires, à l’initiative de l’employeur."],["Orientations stratégiques, situation économique et financière, politique sociale",2,"Ce sont les trois consultations récurrentes du CSE. Leur périodicité est fixée par accord ; à défaut, elles sont annuelles."]],"w":"Trois consultations récurrentes : orientations stratégiques, situation économique et financière, politique sociale (conditions de travail, emploi). S’y ajoutent des consultations ponctuelles (réorganisation, licenciements, nouvelles technologies, règlement intérieur)."},{"t":"RÉUNIONS ET BUDGET","who":"NovaSoft · direction","x":"Quel est le budget de fonctionnement minimum que NovaSoft doit verser au CSE ? Hypothèse : 85 salariés avec un salaire brut annuel moyen de 42 000 € (masse salariale brute 3 570 000 €).","o":[["0,20 % de la masse salariale brute : 3 570 000 € × 0,20 % = 7 140 € par an",2,"Entre 50 et 2 000 salariés, la subvention de fonctionnement est d’au moins 0,20 % de la masse salariale brute. (0,22 % au-delà de 2 000 salariés.)"],["2 % de la masse salariale brute, soit 71 400 € par an, pour garantir des moyens suffisants au CSE",0,"Confusion avec un autre ordre de grandeur : 2 % est dix fois trop élevé."],["0,22 % de la masse salariale : 7 854 €",1,"Ce taux est celui des entreprises de plus de 2 000 salariés. Pour 85 salariés, le minimum est 0,20 %."]],"w":"Budget de fonctionnement : 0,20 % de la masse salariale brute (50 à 2 000 salariés), 0,22 % au-delà. Les activités sociales et culturelles n’ont pas de minimum légal et dépendent de ce qui existait avant."},{"t":"RÉUNIONS ET BUDGET","who":"NovaSoft · CSE","x":"Le CSE a un excédent de 4 000 € sur son budget de fonctionnement à la fin de l’année. Il voudrait le transférer vers les activités sociales (chèques-vacances, sorties).","o":[["Impossible : les deux budgets sont strictement séparés, aucun transfert n’est autorisé",1,"Les deux budgets sont distincts mais des transferts limités sont autorisés."],["Possible en totalité : 4 000 € transférés vers les activités sociales et culturelles, après vote du CSE",0,"Faux : le transfert est plafonné à 10 % de l’excédent."],["Possible dans la limite de 10 % de l’excédent, soit 400 €",2,"L’excédent du budget de fonctionnement peut être transféré vers les activités sociales et culturelles, jusqu’à 10 % de cet excédent."]],"w":"Transferts entre budgets : jusqu’à 10 % de l’excédent annuel du budget de fonctionnement vers les ASC, ou inversement."},{"t":"RÉUNIONS ET BUDGET","who":"NovaSoft · CSE","x":"À NovaSoft (85 salariés), la direction propose de réunir le CSE une fois par an pour « gagner du temps ». Les élus protestent.","o":[["Suffisant : une réunion annuelle suffit",0,"Non : une réunion par an ne respecte pas la périodicité minimale."],["Insuffisant : en l’absence d’accord, un CSE de moins de 300 salariés doit se réunir au moins tous les deux mois, et au moins quatre réunions par an doivent porter sur la santé, la sécurité et les conditions de travail",2,"La périodicité minimale est fixée par accord ; à défaut, tous les deux mois pour les entreprises de moins de 300 salariés, chaque mois au-delà. Quatre réunions par an traitent de santé, sécurité et conditions de travail."],["Une réunion par trimestre suffit toujours",1,"À défaut d’accord, le minimum est tous les deux mois, soit 6 par an. Un accord peut aménager ce rythme."]],"w":"Réunions du CSE : tous les deux mois en principe (moins de 300 salariés), chaque mois à partir de 300. Au moins 4 réunions par an consacrées à la santé, à la sécurité et aux conditions de travail."},{"t":"RÉUNIONS ET BUDGET","who":"NovaSoft · direction","x":"Le secrétaire du CSE demande que l’ordre du jour de la réunion de jeudi soit communiqué lundi. L’employeur dit : « Je vous le donne jeudi matin. »","o":[["Il est établi avec le secrétaire et communiqué au moins trois jours avant la réunion",2,"L’ordre du jour est établi par le président (employeur) et le secrétaire, et communiqué aux membres trois jours au moins avant la séance (L2315-29)."],["Il n’y a pas de délai : l’ordre du jour peut être donné en début de séance, le jour de la réunion",0,"Faux : un délai minimal de trois jours est requis."],["L’employeur décide seul de l’ordre du jour et le communique à la date qui lui convient",0,"Faux : il est établi conjointement avec le secrétaire."]],"w":"Ordre du jour du CSE : établi par l’employeur et le secrétaire, transmis au moins trois jours avant la réunion. Les consultations obligatoires doivent y figurer."},{"t":"ENTRAVE ET PROTECTION","who":"NovaSoft · direction","x":"Un manager refuse qu’un élu quitte son poste pour une réunion du CSE, parce que « l’équipe est en retard sur un projet ». Il lui retire des heures de délégation à la fin du mois.","o":[["Refuser si la charge de travail est trop élevée : l’équipe est en retard sur une livraison importante",0,"La charge de travail n’autorise pas à restreindre l’exercice du mandat."],["Respecter les heures de délégation : temps de travail payé, que l’employeur ne peut ni refuser ni retirer",2,"Les heures de délégation sont payées à l’échéance normale. L’employeur ne peut pas les contester lui-même : il doit saisir le conseil de prud’hommes. Les entraver est un délit d’entrave."],["Ne rien payer pour les heures passées hors réunion, puisqu’elles ne correspondent pas à du travail effectif",0,"Les heures de délégation sont payées comme du temps de travail effectif."]],"w":"Heures de délégation : temps de travail payé, usage libre dans le cadre du mandat. Toute entrave expose à des sanctions pénales ; en cas de doute, c’est au juge, pas au manager, de trancher."},{"t":"ENTRAVE ET PROTECTION","who":"NovaSoft · direction","x":"Un élu du CSE est depuis un an très critique envers la direction. Un manager propose de ne pas le promouvoir « pour calmer le jeu ».","o":[["Proposer la promotion à condition qu’il quitte le CSE",0,"Pression illégale : c’est une entrave au mandat."],["Accepter : la promotion est un choix de gestion libre et l’attitude critique peut nuire au climat de l’équipe",0,"Elle est libre, mais ne peut se fonder sur l’exercice du mandat."],["Refuser : aucune discrimination liée au mandat ; la promotion se décide sur des critères professionnels",2,"La discrimination syndicale ou liée à un mandat est interdite (L1132-1). Évincer un élu d’une promotion pour son activité expose à de lourdes sanctions."]],"w":"Aucune différence de traitement fondée sur le mandat. Promotion, rémunération et évaluation se décident sur des critères professionnels."},{"t":"ENTRAVE ET PROTECTION","who":"NovaSoft · direction","x":"Le CSE vote le recours à un expert-comptable pour analyser la situation de l’entreprise avant une consultation sur les orientations stratégiques. La direction refuse de payer.","o":[["Le coût est en général partagé : 80 % pour l’employeur, 20 % sur le budget de fonctionnement du CSE",2,"Pour la consultation sur les orientations stratégiques, l’expert est financé à 80 % par l’employeur et 20 % par le CSE. L’employeur peut contester la nécessité ou le coût devant le juge, mais pas refuser de payer unilatéralement."],["Le CSE n’a pas le droit de recourir à un expert-comptable sans l’accord préalable de l’employeur",0,"Faux : le CSE peut se faire assister d’un expert-comptable pour certaines consultations."],["L’employeur doit payer 100 % dans tous les cas, quelle que soit la consultation concernée ou la taille du CSE",1,"Le financement intégral concerne certaines expertises (situation économique et financière, licenciement collectif). Ici c’est 80/20."]],"w":"Expert-comptable : consultation sur les orientations stratégiques, financement 80 % employeur et 20 % CSE ; situation économique et financière, licenciement collectif : financement à 100 % par l’employeur. À vérifier selon le cas."},{"t":"ENTRAVE ET PROTECTION","who":"NovaSoft · direction","x":"Un manager a pris l’habitude de dire à ses équipes de ne pas parler aux élus du CSE pendant les heures de travail. Les élus se plaignent d’entrave.","o":[["Cesser : les élus peuvent circuler et prendre contact avec les salariés dans le cadre de leur mandat",2,"Les élus disposent d’une liberté de déplacement et de contact avec les salariés pendant leurs heures de délégation. Interdire ces contacts constitue une entrave."],["Autoriser seulement pendant les pauses",1,"Les élus peuvent circuler pendant leurs heures de délégation, y compris sur le temps de travail des salariés, de façon raisonnable."],["Maintenir l’interdiction : la production prime, surtout en période de livraison, et les échanges avec les élus peuvent attendre les réunions",0,"Aucune exigence de production ne justifie d’entraver le mandat."]],"w":"Liberté de circulation et de contact : l’élu peut aller à la rencontre des salariés pendant ses heures de délégation, sans gêner la bonne marche de l’entreprise."},{"t":"DIALOGUE UTILE","who":"NovaSoft · direction","x":"Avant une réorganisation, un manager propose de rencontrer informellement les élus pour les convaincre avant la consultation officielle. Un autre dit : « Surtout pas, ça biaise la consultation. »","o":[["Présenter la décision comme définitive pour gagner du temps",0,"Une consultation formelle sur une décision déjà prise est un simulacre et peut constituer une entrave."],["Échanger en amont, sans présenter la décision comme prise, puis respecter la procédure formelle",2,"Un dialogue préalable construit la confiance. La consultation formelle doit être réelle : l’avis du CSE doit pouvoir influencer le projet."],["Éviter tout échange en dehors des réunions formelles, par prudence juridique et pour garder une trace écrite",1,"Sûr mais pauvre : le dialogue informel permet de désamorcer les crispations."]],"w":"Le dialogue social réussi combine échanges informels en amont et consultation formelle sincère : l’avis des élus peut changer le projet."},{"t":"DIALOGUE UTILE","who":"NovaSoft · direction","x":"Le CSE rend un avis négatif sur la réorganisation et propose trois modifications. La direction passe outre sans répondre.","o":[["Reporter indéfiniment la décision",0,"Vous paralysez l’entreprise et vous aggravez le climat social."],["Passer outre sans répondre : l’avis ne lie pas l’employeur, qui garde le dernier mot sur la réorganisation",1,"L’avis ne lie pas l’employeur, mais ignorer les propositions sans répondre est risqué : le sérieux de la consultation peut être contesté, vous perdez la confiance des élus et préparez des conflits plus durs."],["Répondre point par point aux propositions du CSE, intégrer ce qui est possible, expliquer le reste",2,"La loi n’oblige pas à suivre l’avis, mais une réponse motivée prouve que la consultation a été sérieuse, et améliore souvent le projet."]],"w":"L’avis du CSE ne lie pas l’employeur, mais répondre aux propositions montre un dialogue de qualité."},{"t":"DIALOGUE UTILE","who":"NovaSoft · direction","x":"Un syndicat propose de négocier un accord sur le télétravail. La direction se demande si elle doit passer par le CSE ou par une négociation avec des délégués syndicaux.","o":[["Consulter simplement le CSE : un avis favorable suffit pour conclure un accord collectif valable",0,"Un avis n’est pas un accord. La consultation et la négociation sont deux procédures distinctes."],["Négocier avec les délégués syndicaux (ou, à défaut, le CSE ou des salariés mandatés) un accord collectif",2,"La négociation collective suit ses propres règles, distinctes de la consultation du CSE. Un accord collectif est conclu avec des organisations syndicales, ou selon certaines conditions avec des élus mandatés."],["Décider seul par une décision unilatérale (charte), sans passer par la négociation demandée par le syndicat",1,"Une charte unilatérale n’est possible qu’à défaut d’accord, après avis du CSE ; écarter la négociation proposée par le syndicat prive les salariés des garanties d’un accord collectif."]],"w":"Information, consultation, négociation : trois niveaux différents. Un accord collectif s’obtient par la négociation avec des syndicats (ou des élus mandatés dans certains cas)."},{"t":"DIALOGUE UTILE","who":"NovaSoft · direction","x":"Le DRH demande à un nouveau manager de préparer sa première réunion CSE. Il hésite sur ce qu’il peut dire et ne pas dire.","o":[["Lire la BDESE et l’ordre du jour, cadrer le confidentiel, répondre franchement, noter les engagements",2,"La BDESE (base de données économiques, sociales et environnementales) alimente les consultations. Une préparation sérieuse construit la confiance et la fluidité des échanges."],["Improviser et répondre à tout, y compris aux sujets confidentiels, pour montrer sa transparence et sa bonne foi",0,"Certaines informations sont confidentielles et doivent être signalées comme telles. Il faut aussi connaître les limites de ce qui peut être dit."],["Refuser de répondre à toute question sans notification écrite préalable, pour ne rien dire d’imprécis ou de non validé",1,"Un cadre est utile, mais un refus systématique de répondre bloque le dialogue."]],"w":"Préparer une réunion de CSE : BDESE, ordre du jour, informations confidentielles identifiées, réponses honnêtes, relevé des engagements."}]},"carriere":{"cards":[{"t":"ENTRETIEN PROFESSIONNEL","who":"NovaSoft · RH","x":"Un manager dit : « L’entretien annuel d’évaluation, c’est la même chose que l’entretien professionnel, on en fait un seul. »","o":[["L’entretien professionnel remplace l’évaluation annuelle",1,"Il ne la remplace pas : l’employeur peut organiser une évaluation, mais les deux objets sont différents."],["Les deux sont distincts : l’entretien professionnel porte sur le parcours, les compétences et les besoins de formation du salarié ; il est tous les deux ans et ne sert pas à évaluer la performance",2,"L’entretien professionnel (L6315-1) est consacré aux perspectives d’évolution et de formation. L’évaluation du travail est un autre exercice. On peut les tenir le même jour mais en les distinguant clairement."],["C’est identique : on peut les fusionner sans précaution",0,"Les fusionner sans distinction fait de l’entretien professionnel un entretien de contrôle ; les salariés n’osent plus parler de leur avenir."]],"w":"Entretien professionnel : tous les 2 ans, centré sur le parcours, les compétences et la formation. Il n’évalue pas la performance. Il est proposé à tous les salariés (CDI et CDD) dès l’embauche."},{"t":"ENTRETIEN PROFESSIONNEL","who":"NovaSoft · RH","x":"Une salariée revient d’un congé maternité de 5 mois. Son manager dit : « On a déjà fait l’entretien il y a 18 mois, on verra dans 6 mois. »","o":[["Lui proposer un entretien professionnel dès son retour, quel que soit le rythme de deux ans",2,"L’entretien professionnel doit être proposé systématiquement à la reprise après un congé maternité, parental, d’adoption, sabbatique, de longue maladie, ou après un mandat syndical."],["Lui proposer un entretien seulement si elle en fait elle-même la demande à son retour",1,"L’initiative revient à l’employeur : il doit proposer l’entretien."],["Attendre la prochaine échéance de deux ans, puisque le dernier entretien date de seulement 18 mois",0,"Ignorer l’obligation de proposer l’entretien au retour est un manquement."]],"w":"Entretien professionnel après une absence longue : maternité, adoption, parental, proche aidant, sabbatique, longue maladie, mandat syndical. L’employeur doit le proposer."},{"t":"ENTRETIEN PROFESSIONNEL","who":"NovaSoft · RH","x":"NovaSoft veut faire l’état des lieux à six ans pour une salariée présente depuis 2020. La RH dit que « il suffit d’avoir fait 3 entretiens ».","o":[["L’état des lieux est facultatif",0,"Il est obligatoire, tous les 6 ans."],["Compter seulement les entretiens tenus : si les trois entretiens ont eu lieu tous les deux ans, l’obligation est remplie",0,"Il faut aussi vérifier les mesures d’évolution (formation, certification, progression)."],["Vérifier les entretiens tenus et au moins deux des trois mesures : formation, certification, progression",2,"L’état des lieux récapitulatif à 6 ans vérifie la tenue des entretiens et deux critères parmi trois (formation, certification, progression). Dans les entreprises d’au moins 50 salariés, le non-respect peut entraîner un abondement correctif du CPF."]],"w":"État des lieux à 6 ans : entretiens tenus, et au moins deux mesures sur trois (formation, certification, progression salariale ou professionnelle). Sanction possible : abondement correctif du CPF (≥50 salariés)."},{"t":"ENTRETIEN PROFESSIONNEL","who":"NovaSoft · squad Alpha","x":"Vous menez l’entretien professionnel de Karim. Vous commencez par lui présenter vos attentes sur ses objectifs de l’année, puis vous passez à son évolution.","o":[["Inverser : partir de son projet, de ses envies et de ses compétences, avant les besoins de l’entreprise",2,"L’entretien professionnel est un temps de projection du salarié. Commencer par les attentes de l’entreprise le transforme en entretien d’évaluation."],["Ne parler que de la formation et du budget disponible",1,"La formation est un point, mais l’entretien porte aussi sur la mobilité, les qualifications et l’emploi."],["Continuer : commencer par les objectifs donne un cadre clair et permet ensuite d’aborder ses souhaits d’évolution",0,"Le salarié se sentira jugé et parlera peu de ses vrais souhaits."]],"w":"Structure d’un bon entretien professionnel : bilan des acquis, projet du salarié, besoins de l’entreprise, plan d’action (formation, mobilité, calendrier)."},{"t":"FORMATION ET CPF","who":"NovaSoft · équipe Data","x":"Sam souhaite utiliser son CPF pour une formation de 3 mois en journée. Son manager répond : « Je refuse, le CPF, c’est ton problème. »","o":[["L’employeur peut refuser sans jamais répondre, la décision de formation relevant de son pouvoir de direction",0,"L’absence de réponse dans les 30 jours vaut accord."],["Le salarié peut partir en formation sans prévenir, puisqu’il utilise ses droits CPF et que l’employeur n’a pas à valider",0,"Sur le temps de travail, il doit demander l’accord."],["Rappeler que l’employeur doit répondre sous 30 jours à la demande d’accord ; le silence vaut accord",2,"Si la formation a lieu pendant le temps de travail, l’accord de l’employeur est requis. Il dispose de 30 jours pour répondre : le silence vaut acceptation. Hors temps de travail, aucun accord n’est nécessaire."]],"w":"CPF sur le temps de travail : demande à l’employeur, réponse dans les 30 jours, silence = accord. Hors temps de travail : aucun accord nécessaire."},{"t":"FORMATION ET CPF","who":"NovaSoft · RH","x":"Une salariée qualifiée a travaillé à temps plein pendant 4 ans. Elle demande à quel montant son CPF peut atteindre au maximum.","o":[["Il n’y a pas de limite",0,"Il existe un plafond d’alimentation."],["500 € par an, plafonné à 5 000 € ; 800 € par an et 8 000 € pour les salariés peu qualifiés",2,"L’alimentation du CPF est de 500 € par an à temps plein (plafonné à 5 000 €), 800 € par an et 8 000 € de plafond pour les personnes peu ou pas qualifiées."],["Il est alimenté de 24 heures par an dans la limite de 150 heures, comme avant la conversion en euros de 2019",0,"C’est l’ancien régime en heures, supprimé pour les salariés du privé ; il reste en heures pour les agents publics (25 heures par an jusqu’à 150)."]],"w":"CPF : 500 € par an (plafond 5 000 €) ; 800 € par an (plafond 8 000 €) pour les peu qualifiés. En 2026, une participation forfaitaire restant à la charge du salarié existe (montant à vérifier)."},{"t":"FORMATION ET CPF","who":"NovaSoft · squad Gamma","x":"Nina est depuis 8 ans sur le même poste. Elle craint que ses compétences deviennent obsolètes. Vous êtes son manager et vous disposez d’un plan de formation.","o":[["Rappeler que l’employeur doit assurer l’adaptation au poste et planifier une formation adaptée",2,"L’employeur a une obligation d’adaptation au poste de travail et de maintien de l’employabilité (L6321-1). Une formation d’adaptation se déroule en principe sur le temps de travail."],["Lui dire de suivre des formations sur son temps personnel avec son CPF, qu’elle peut mobiliser sans accord",1,"Le CPF peut compléter, mais l’adaptation au poste est de la responsabilité de l’employeur."],["Ne rien faire tant qu’elle n’est pas en difficulté avérée sur son poste, puis réagir si besoin",0,"Attendre les difficultés expose l’entreprise à une obligation non remplie et coûte plus cher qu’une anticipation."]],"w":"L’employeur doit adapter les salariés à leur poste et maintenir leur employabilité. Le CPF est un droit complémentaire du salarié."},{"t":"FORMATION ET CPF","who":"NovaSoft · équipe Support","x":"Omar veut valider douze ans d’expérience en support client par un diplôme. Il pense qu’il faut forcément repasser par une école.","o":[["Lui dire que seul un retour à l’école est possible, avec un diplôme à repasser sur plusieurs années",0,"Faux : la VAE existe depuis 2002 et a été assouplie en 2022."],["Lui présenter la VAE, accessible dès un an d’expérience, et la financer éventuellement par le CPF",2,"La VAE permet d’obtenir tout ou partie d’une certification à partir de l’expérience, sans repasser par une formation complète. Elle est ouverte dès un an d’expérience."],["Lui dire que la VAE est réservée aux cadres et aux salariés de plus de dix ans d’ancienneté dans l’entreprise",0,"Faux : elle s’adresse à tous, quel que soit le niveau."]],"w":"VAE : obtenir une certification grâce à son expérience, dès un an d’expérience. Elle peut être financée par le CPF ou l’employeur."},{"t":"MOBILITÉ","who":"NovaSoft · direction","x":"Une collaboratrice demande une mobilité vers le service Produit. Son manager dit qu’il la garde « parce qu’elle est indispensable ».","o":[["Refuser : la décision appartient au manager d’origine, qui connaît les besoins et les priorités de son équipe sur l’année",0,"Un refus sans examen entraîne souvent une démission ; l’entreprise perd la compétence et la salariée."],["Accepter immédiatement sans transition, pour ne pas freiner son élan",1,"La mobilité est bonne, mais un départ immédiat désorganise l’équipe d’origine."],["Examiner la demande avec la RH et les deux managers, comparer besoins et projet, préparer une transition",2,"Bloquer une mobilité interne finit par faire partir la personne. L’entreprise y gagne à organiser la transition."]],"w":"Une mobilité interne se prépare : accord des deux services, transition, remplacement. La bloquer coûte plus cher que de l’organiser."},{"t":"MOBILITÉ","who":"NovaSoft · direction","x":"Pour réduire les coûts, la direction propose à un salarié un poste différent avec une baisse de rémunération de 10 %. Il refuse. Le manager veut le sanctionner.","o":[["Imposer la mesure par un simple courrier",0,"Une modification du contrat ne peut pas être imposée."],["Impossible de sanctionner : une baisse de rémunération modifie le contrat et exige l’accord du salarié",2,"Une baisse de rémunération est une modification du contrat de travail. Le salarié peut refuser sans commettre de faute ; l’employeur devra renoncer ou envisager une autre voie dans le respect de la procédure."],["Sanctionner : refuser le poste proposé alors que l’entreprise doit réduire ses coûts est une insubordination",0,"Refuser une modification du contrat n’est pas une faute."]],"w":"Modification du contrat (rémunération, fonctions essentielles) : accord écrit du salarié nécessaire. Changement des conditions de travail : l’employeur peut décider, dans son pouvoir de direction."},{"t":"MOBILITÉ","who":"NovaSoft · direction","x":"Le contrat d’un salarié prévoit une clause de mobilité géographique. L’employeur veut le muter de Metz à Marseille dans huit jours. Il a deux enfants scolarisés.","o":[["Respecter la clause : zone précise, bonne foi, délai raisonnable, situation familiale prise en compte",2,"Une clause de mobilité doit définir précisément sa zone d’application. Sa mise en œuvre doit être de bonne foi et proportionnée à l’intérêt de l’entreprise. Huit jours sont insuffisants."],["L’employeur peut muter où il veut, sans condition, dès lors que le contrat contient une clause de mobilité signée par le salarié",0,"La clause doit définir une zone précise, et son application ne peut pas être abusive."],["Il faut l’accord écrit du salarié à chaque mutation",1,"Avec une clause valide, il n’y a pas d’accord à recueillir à chaque fois, mais la mise en œuvre doit rester raisonnable."]],"w":"Clause de mobilité : zone précise, bonne foi, délai raisonnable, prise en compte de la situation du salarié."},{"t":"MOBILITÉ","who":"NovaSoft · RH","x":"Un poste de chef de projet est à pourvoir. Un manager veut le réserver à un candidat externe sans en informer les salariés internes.","o":[["Recruter directement à l’extérieur : cela apporte du sang neuf et des compétences que l’équipe n’a pas",1,"L’externe peut apporter, mais priver les internes de toute chance coûte en engagement."],["Réserver le poste à un salarié sans le publier",0,"Le favoritisme sans critères crée un sentiment d’injustice."],["Publier d’abord le poste en interne, avec les critères, avant d’aller à l’extérieur",2,"La transparence sur les postes ouverts motive, retient les talents et évite la fuite des salariés qui se sentent bloqués."]],"w":"Publier les postes en interne, avec critères : transparence, équité et rétention. L’externe se compare à l’interne, il ne le remplace pas d’office."},{"t":"COMPÉTENCES ET GEPP","who":"NovaSoft · direction","x":"Trois développeurs expérimentés partent à la retraite dans deux ans. Personne n’a documenté leurs pratiques. La direction ne sait pas comment compenser.","o":[["Leur demander de former tout le monde en six mois, avant leurs départs, via des ateliers collectifs hebdomadaires",1,"Bien intentionné, mais sans cartographie des compétences critiques ni suivi, la transmission par ateliers collectifs reste partielle."],["Cartographier les compétences critiques, organiser tutorat et documentation, recruter les successeurs",2,"La gestion des emplois et des parcours professionnels (GEPP) anticipe les besoins : elle compare les compétences actuelles et futures et organise la transmission."],["Attendre leurs départs pour recruter des profils confirmés, sans mobiliser le temps des équipes d’ici là",0,"Vous perdez la connaissance tacite et vous recrutez dans l’urgence."]],"w":"GEPP : anticiper l’écart entre compétences actuelles et besoins futurs, planifier la transmission, former, recruter. Obligation de négocier tous les 4 ans à partir de 300 salariés."},{"t":"COMPÉTENCES ET GEPP","who":"NovaSoft · RH","x":"Vous construisez une cartographie des compétences. Un manager propose de ne mettre que les diplômes dans le tableau. Un autre veut y mettre aussi les compétences acquises sur le terrain.","o":[["Inclure diplômes, compétences techniques et transversales et niveau de maîtrise, validés avec le salarié",2,"Une cartographie utile reflète les compétences réelles, pas seulement les diplômes. La validation avec le salarié donne de la fiabilité."],["Se limiter aux diplômes : ils sont objectifs, vérifiables et comparables d’un salarié à l’autre",0,"Les diplômes ne disent pas ce que la personne sait faire aujourd’hui."],["Remplir le tableau à partir de l’avis du manager seul, qui connaît le mieux le travail réel au quotidien",1,"Le point de vue du manager est utile mais incomplet : le salarié connaît ses compétences."]],"w":"Cartographie des compétences : diplômes, expériences, compétences techniques et transversales, niveau de maîtrise, validé avec le salarié."},{"t":"COMPÉTENCES ET GEPP","who":"NovaSoft · direction","x":"Une expertise pointue (sécurité cloud) n’existe qu’en un seul exemplaire chez NovaSoft. Le salarié concerné demande une augmentation importante, sinon il part.","o":[["Céder pour le garder, sans rien changer d’autre : l’urgence est de ne pas perdre son expertise cette année",1,"Cela règle l’urgence mais pas la dépendance, et crée un précédent."],["Refuser en bloc et prendre le risque de le voir partir, car une exception créerait un précédent",0,"Le risque de perte est élevé et vous n’avez pas de plan B."],["Reconnaître le risque, former un second expert et examiner la demande sur des critères équitables",2,"Un risque de dépendance à une personne doit être traité par la transmission et la polyvalence. La décision salariale doit rester équitable."]],"w":"Compétence unique = risque : on la partage (tutorat, binôme, documentation). Sans plan B, toute négociation se fait sous pression."},{"t":"COMPÉTENCES ET GEPP","who":"NovaSoft · direction","x":"La direction annonce l’arrivée d’un outil d’intelligence artificielle qui va automatiser une partie du support client. Les salariés du support s’inquiètent pour leur emploi.","o":[["Ne rien dire jusqu’au déploiement, pour éviter les rumeurs et laisser les équipes travailler sereinement",0,"Le silence nourrit la peur et peut constituer un manquement à la consultation du CSE."],["Informer et consulter le CSE, cartographier l’impact sur les métiers, proposer formations et mobilités",2,"L’introduction de nouvelles technologies est un sujet de consultation du CSE. Anticiper les compétences et les parcours rassure et prépare l’avenir."],["Annoncer que personne ne sera concerné, pour rassurer les équipes et éviter les rumeurs",1,"Une promesse rassurante sans analyse sera démentie par les faits."]],"w":"Changement technologique : consulter le CSE, analyser l’impact sur les emplois, former et proposer des mobilités. Anticiper plutôt que subir."},{"t":"PARCOURS ET ÂGES","who":"NovaSoft · RH","x":"Un salarié de 52 ans demande une formation. Son manager répond : « À ton âge, ça ne vaut pas le coup. »","o":[["Rappeler que l’âge est un critère de discrimination interdit et examiner la demande sur le besoin",2,"Refuser une formation à cause de l’âge est une discrimination (L1132-1). La demande s’évalue sur les besoins du poste et du projet."],["Proposer une formation moins coûteuse",1,"La contrainte budgétaire peut jouer, mais pas à cause de l’âge."],["Accepter la remarque : la rentabilité d’une formation diminue avec l’âge, l’entreprise peut en tenir compte",0,"Cette logique est discriminatoire et illégale."]],"w":"Pas de discrimination liée à l’âge dans l’accès à la formation. Les salariés seniors sont une ressource de transmission."},{"t":"PARCOURS ET ÂGES","who":"NovaSoft · RH","x":"Un salarié de 45 ans demande ce qu’il peut faire pour faire le point sur sa santé et son parcours à mi-carrière.","o":[["Lui conseiller d’attendre sa retraite",0,"Ce n’est pas un conseil de carrière."],["Lui répondre qu’il n’existe rien de particulier avant 55 ans, âge du premier rendez-vous dédié aux seniors",0,"Faux : la visite de mi-carrière existe depuis 2021 (échéance fixée par accord ou à 45 ans)."],["Lui indiquer qu’il peut demander une visite médicale de mi-carrière et un entretien professionnel",2,"La visite de mi-carrière permet d’évaluer l’adéquation entre poste et état de santé et d’anticiper l’usure professionnelle. Elle complète l’entretien professionnel."]],"w":"Visite de mi-carrière (médecine du travail) vers 45 ans, entretien professionnel tous les 2 ans : deux outils pour accompagner les parcours longs."},{"t":"PARCOURS ET ÂGES","who":"NovaSoft · direction","x":"Une salariée revient d’un congé maternité. L’entreprise a accordé des augmentations générales pendant son absence. Un manager dit qu’elle n’y a pas droit car elle n’était pas présente.","o":[["Lui accorder une prime à la place",1,"La loi impose un rattrapage de salaire, pas seulement une prime."],["Lui appliquer à son retour les augmentations générales et la moyenne des individuelles de sa catégorie",2,"La loi garantit à la salariée, au retour de congé maternité, le bénéfice des augmentations générales et de la moyenne des augmentations individuelles accordées pendant son absence (L1225-26)."],["Ne lui accorder aucune augmentation : elle était absente et n’a pas contribué aux résultats de l’année écoulée",0,"Illégal : c’est une discrimination liée à la maternité."]],"w":"Après un congé maternité : rattrapage salarial (augmentations générales et moyenne des augmentations individuelles de la catégorie). Un manquement est discriminatoire."},{"t":"PARCOURS ET ÂGES","who":"NovaSoft · squad Delta","x":"Un jeune diplômé vous dit : « Je veux devenir manager dans deux ans, comment je fais ? » Il n’a que 6 mois d’ancienneté.","o":[["Lui dire qu’il est trop tôt et qu’il doit d’abord faire ses preuves pendant au moins deux ou trois ans",0,"Vous éteignez l’envie et le risque de départ augmente."],["Lui promettre le poste dans deux ans",1,"Une promesse sans engagement ni critère est une fausse promesse et une dette que l’entreprise ne pourra peut-être pas honorer."],["L’aider à construire un plan de développement : compétences, expériences, mentor, étapes datées",2,"Un projet de carrière ambitieux se décompose en étapes concrètes. Le soutien du manager transforme l’ambition en compétences."]],"w":"Un plan de carrière réaliste : objectifs, étapes, compétences, soutien. Pas de promesse sans critère."},{"t":"ACCOMPAGNER","who":"NovaSoft · squad Beta","x":"Rayan vous dit : « Je ne sais pas ce que je veux faire dans trois ans. » Vous êtes tenté de lui proposer un plan tout prêt.","o":[["Lui poser des questions ouvertes sur ses envies et ses valeurs, puis proposer d’explorer des pistes",2,"Quand le projet n’existe pas, on aide à l’explorer plutôt qu’à l’imposer. Le bilan de compétences est un outil adapté."],["Lui dire de revenir quand il saura",1,"Vous laissez la personne seule avec son doute."],["Lui imposer le plan que vous avez en tête, qui correspond mieux aux besoins de l’équipe dans trois ans",0,"Un projet imposé n’est pas porté par la personne."]],"w":"Accompagner une carrière, c’est questionner et ouvrir des pistes, pas décider à la place de la personne."},{"t":"ACCOMPAGNER","who":"NovaSoft · direction","x":"Un salarié souhaite faire un bilan de compétences, mais craint que son employeur l’apprenne et s’en méfie. Il vous demande de lui expliquer ce qu’il en est.","o":[["Le rassurer : par le CPF hors temps de travail, sans accord de l’employeur, et les résultats lui appartiennent",2,"Le bilan de compétences est confidentiel. Ses résultats ne sont communiqués à l’employeur qu’avec l’accord du salarié. Sur temps de travail, une autorisation d’absence est nécessaire."],["Lui dire que l’employeur reçoit automatiquement le rapport de synthèse, puisque la formation est financée par le CPF",0,"Faux : le rapport est destiné au seul bénéficiaire."],["Lui dire que c’est impossible sans l’accord de l’employeur",1,"Sur le temps de travail, il faut une autorisation d’absence ; hors temps de travail, non."]],"w":"Bilan de compétences : confidentiel, résultats destinés au salarié seul, utilisable avec le CPF, accord de l’employeur seulement pour l’absence sur le temps de travail."},{"t":"ACCOMPAGNER","who":"NovaSoft · direction","x":"Votre entreprise a mis en place un parcours de mentorat. Les résultats sont décevants : les binômes ne se voient plus au bout de deux mois.","o":[["Abandonner le dispositif : il ne marche pas ici et il mobilise du temps que les équipes n’ont pas",0,"Vous jetez un outil qui marche ailleurs sans en comprendre la cause."],["Analyser les causes : choix des binômes, objectifs, temps dédié, formation des mentors ; puis ajuster",2,"Un mentorat efficace repose sur des objectifs, du temps protégé et des binômes bien choisis. On diagnostique avant de corriger."],["Imposer des rencontres hebdomadaires",1,"Cela peut aider, mais sans comprendre la cause, vous risquez de subir."]],"w":"Un dispositif de développement se pilote : objectifs, temps dédié, indicateurs, ajustements."},{"t":"ACCOMPAGNER","who":"NovaSoft · direction","x":"Vous devez décider des promotions de l’année. Vous disposez d’une enveloppe limitée et de dix candidats méritants.","o":[["Promouvoir ceux que vous appréciez le plus et avec qui la collaboration est la plus fluide au quotidien",0,"Le favoritisme détruit la confiance et expose à la discrimination."],["Tirer au sort entre les dix candidats",1,"Équitable en apparence, mais sans lien avec le mérite : les meilleurs en voudront."],["Définir des critères objectifs et connus, décider collectivement, puis expliquer les décisions à tous",2,"La justice procédurale rend acceptable une décision défavorable. Les critères connus et la décision collective limitent les biais."]],"w":"Promotion : critères objectifs et connus, décision collective, explication. L’équité procédurale compte autant que le résultat."}]},"semaine":{"nev":8,"gauges":[{"k":"res","n":"Résultats"},{"k":"eq","n":"Équipe"},{"k":"cli","n":"Clients"},{"k":"ene","n":"Énergie"}],"start":[6,6,6,6],"roles":[{"n":"Directeur général","m":"Tu veux que les chiffres de la semaine soient tenus.","f":"res"},{"n":"DRH","m":"Tu veilles à ce que l’équipe ne s’épuise pas.","f":"eq"},{"n":"Directrice commerciale","m":"Tu défends chaque client et chaque partie prenante.","f":"cli"},{"n":"Coach du manager","m":"Tu veilles à ce que le manager ne se brûle pas.","f":"ene"},{"n":"Directeur technique","m":"Tu veux des livrables solides et dans les délais.","f":"res"}],"events":[{"t":"LUNDI 8 H · LA LISTE","x":"Vous êtes responsable de la squad Alpha. Lundi matin, vous avez douze tâches sur votre liste : deux réclamations de clients, un rapport, trois demandes d’équipiers, quatre mails en retard et deux sujets de réflexion. Tout vous paraît urgent.","o":[{"t":"Tout traiter vous-même, quitte à y passer le week-end, pour ne décevoir personne","fx":{"res":2,"ene":-2,"eq":-1},"w":"Les résultats montent à court terme. Vous vous épuisez et l’équipe voit qu’on ne délègue pas : elle cesse de prendre des initiatives."},{"t":"Classer chaque tâche avec la matrice d’Eisenhower : faire l’urgent et important, planifier l’important, déléguer l’urgent peu important, supprimer le reste","fx":{"res":1,"ene":1,"cli":-1},"rec":true,"w":"Vous traitez d’abord ce qui compte vraiment et vous évitez la dispersion. Un client attendra un jour de plus, c’est le prix du tri."},{"t":"Répondre à tout dans l’ordre d’arrivée, du plus ancien au plus récent","fx":{"cli":1,"res":-2,"ene":-1},"w":"Les demandes sont traitées dans l’ordre où elles arrivent, pas selon leur importance : les gros sujets avancent trop lentement."}],"rep":"Matrice d’Eisenhower : urgent et important, à faire ; important et non urgent, à planifier ; urgent et peu important, à déléguer ; ni l’un ni l’autre, à éliminer. L’urgent n’est pas forcément important."},{"t":"LUNDI 11 H · LE REPORTING","x":"Le directeur général demande un reporting détaillé pour demain 9 h. Cela représente environ trois heures de travail et n’était pas prévu. Il n’a pas dit à quoi il servirait.","o":[{"t":"Demander à quoi il servira et quelle décision il doit éclairer, puis proposer une version d’une page en une heure","fx":{"res":1,"cli":1},"rec":true,"w":"Le reporting devient utile et sa production proportionnée. La question sur la décision à prendre évite beaucoup de travail inutile."},{"t":"Confier le reporting à un junior, sans explication, en lui disant que c’est urgent","fx":{"eq":-1,"res":-1},"w":"Le junior se retrouve sans contexte ni cadre. Le travail est approximatif et il se sent abandonné."},{"t":"Produire le reporting complet en y passant la soirée, pour répondre exactement à la demande","fx":{"res":2,"ene":-2,"cli":-1},"w":"Vous satisfaisez la demande mais vous y passez la soirée et négligez un sujet client pour le faire."}],"rep":"Avant de produire, clarifier la finalité : « pour qui, pour quelle décision, pour quand ? » Un travail bien cadré coûte souvent moitié moins cher."},{"t":"MARDI · LA RÉUNION SANS FIN","x":"Chaque mardi, une réunion de deux heures rassemble neuf personnes, sans ordre du jour. Elle dérive vers des discussions techniques qui n’intéressent que deux participants. Plusieurs collègues soupirent en silence.","o":[{"t":"La supprimer discrètement en ne l’organisant plus, sans rien dire à personne","fx":{"ene":2,"eq":-2,"res":-1},"w":"Vous gagnez du temps tout de suite, mais l’équipe se sent mise devant le fait accompli et la coordination se délite."},{"t":"Continuer comme avant : une réunion hebdomadaire est une tradition utile à la cohésion","fx":{"ene":-1,"eq":-1},"w":"Le temps des participants est gaspillé et la fatigue s’installe. Une habitude n’est pas une raison suffisante de maintenir un format."},{"t":"Proposer de la ramener à 30 minutes avec un ordre du jour, un animateur et des décisions écrites","fx":{"eq":1,"ene":1,"res":-1},"rec":true,"w":"Vous redonnez du temps à chacun et clarifiez l’usage de la réunion. Un point technique est reporté, mais il sera traité à part avec les bonnes personnes."}],"rep":"Une réunion utile a un objectif, un ordre du jour, un animateur, une durée et un relevé de décisions (qui fait quoi, pour quand)."},{"t":"MARDI 14 H · LE CLIENT PRESSÉ","x":"Un client important appelle : un bug mineur affecte un de ses rapports mensuels. Il exige une correction « aujourd’hui ». Ce n’est ni bloquant ni dangereux. Votre équipe est concentrée sur la livraison de jeudi.","o":[{"t":"Promettre une correction pour ce soir sans consulter l’équipe, puis voir comment faire","fx":{"cli":1,"eq":-2,"res":-1},"w":"Le client est soulagé sur le moment, mais l’équipe apprend une promesse impossible et se sent piégée."},{"t":"Mobiliser toute l’équipe sur le bug aujourd’hui : le client passe avant tout","fx":{"cli":2,"res":-2,"eq":-1},"w":"Le client est ravi mais la livraison de jeudi est compromise et l’équipe a l’impression de subir chaque pression."},{"t":"Qualifier la gravité avec le client, convenir d’un délai réaliste et planifier la correction au sein de l’équipe sans casser la livraison","fx":{"cli":1,"res":1,"eq":-1},"rec":true,"w":"Le client est entendu et obtient un engagement crédible. L’équipe doit absorber la correction, mais sans abandonner son objectif principal."}],"rep":"Évaluer l’urgence réelle avant de réagir : gravité, impact, délai acceptable. Un engagement doit être tenable avant d’être pris."},{"t":"MERCREDI 9 H · LA DÉCISION DE LÉA","x":"Léa, très compétente, vous demande de choisir entre deux outils pour la phase de test. Elle a déjà étudié les deux et sait lequel est le meilleur. Vous êtes pressé et vous avez envie de trancher pour aller vite.","o":[{"t":"Lui rappeler qu’elle a le cadre pour décider, la laisser choisir et convenir d’un point de contrôle dans deux semaines","fx":{"eq":1,"ene":1},"rec":true,"w":"Vous déléguez sans abandonner : cadre clair, d ’il a trois sujets en parallèle depuis un mois. Il ne s’est pas plaint.","o":[{"t":"Lui dire de tenir jusqu’à vendredi : après la livraison, il pourra souffler","fx":{"res":2,"eq":-2,"ene":-1},"w":"La livraison est sécurisée, mais Sam entend que sa santé passe après le résultat, et les autres le voient."},{"t":"Le recevoir tout de suite, écouter, rééquilibrer sa charge et décaler ou supprimer une de ses tâches","fx":{"eq":2,"res":-1},"rec":true,"w":"Vous traitez la cause (la surcharge) avant que l’épuisement ne s’installe. La livraison perd un peu de marge mais l’équipe gagne en confiance."},{"t":"Attendre qu’il demande de l’aide : un adulte sait dire quand il en a besoin","fx":{"eq":-1,"res":-1},"w":"Vous laissez la situation se dégrader. Beaucoup de salariés épuisés ne demandent jamais d’aide."}],"rep":"Un manager repère les signaux faibles (changement de comportement, oublis, irritabilité). L’employeur a aussi une obligation de prévention des risques, y compris psychosociaux."},{"t":"JEUDI 11 H · LA FONCTIONNALITÉ EN PLUS","x":"Tan, le directeur technique, vous demande de livrer une fonctionnalité supplémentaire d’ici vendredi, en plus des deux prévues. L’équipe est déjà à la limite de sa capacité.","o":[{"t":"Répondre non sèchement en rappelant que la capacité de l’équipe est connue","fx":{"res":-1,"cli":-1},"w":"Le refus sans alternative ferme la discussion et vous coûte en crédibilité auprès de la direction."},{"t":"Dire oui et demander à l’équipe de se mobiliser : c’est le directeur technique","fx":{"res":2,"eq":-2,"ene":-1},"w":"La demande est satisfaite sur le papier. L’équipe s’épuise et la qualité est à risque."},{"t":"Proposer deux options : deux fonctionnalités vendredi et la troisième dans dix jours, ou les trois avec une réduction de périmètre, puis demander son arbitrage","fx":{"res":1,"eq":1,"ene":-1},"rec":true,"w":"Vous renvoyez l’arbitrage à celui qui décide, avec les conséquences visibles. Tan conserve le choix et l’équipe n’est pas sacrifiée ;
