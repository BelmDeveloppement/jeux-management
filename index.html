a davantage."],["Rendre les objectifs atteignables par l’équipe et le lien effort-résultat visible",2,"Vroom : la motivation dépend de l’attente (mes efforts mènent-ils au résultat ?), de l’instrumentalité (le résultat mène-t-il à la récompense ?) et de la valence (la récompense m’intéresse-t-elle ?). Ici l’attente est nulle."]],"w":"Vroom : motivation = attente × instrumentalité × valence. Si un des trois facteurs est nul, la motivation est nulle, quel que soit le montant."},{"t":"ATTENTE (VROOM)","who":"Équipe commerciale","x":"Un vendeur atteint régulièrement ses objectifs, mais la prime est versée six mois plus tard et personne ne lui explique le calcul. Il dit : « Je ne vois pas le lien. »","o":[["Ne rien changer : le vendeur atteint déjà ses objectifs",0,"Il atteint ses objectifs maintenant, mais la démotivation s’installe en silence. Votre meilleur élément pourrait partir."],["Verser plus vite la prime et expliquer clairement son calcul",2,"L’instrumentalité (le résultat mène à la récompense) doit être crédible et visible. Une récompense lointaine et floue perd son effet."],["Doubler la prime à la fin de l’année pour marquer le coup auprès des meilleurs vendeurs",1,"Une récompense plus élevée mais toujours lointaine améliore peu l’instrumentalité."]],"w":"Plus la récompense suit vite l’effort et plus le lien est clair, plus elle motive. Un calcul opaque détruit l’instrumentalité."},{"t":"ATTENTE (VROOM)","who":"NovaSoft · équipe Data","x":"Vous proposez à Sam de passer sur un sujet technique très difficile, avec une promotion à la clé. Il refuse. Vous découvrez qu’il ne veut pas encadrer, et que la promotion en impose.","o":[["Lui demander ce qu’il valorise, puis adapter la récompense en conséquence",2,"La valence : la récompense doit avoir de la valeur pour la personne. La promotion que vous voulez lui donner n’est pas celle qu’il veut."],["Insister pour qu’il accepte puisque c’est une promotion méritée et que l’équipe compte sur lui",0,"Imposer une récompense non désirée crée un cadeau empoisonné."],["Proposer le poste à quelqu’un d’autre sans en parler à Sam, pour ne pas le mettre en difficulté",1,"Cela règle le besoin du moment mais vous ne comprenez pas ce qui motive Sam, donc le problème reviendra."]],"w":"La valence : une récompense ne vaut que ce qu’elle vaut pour celui qui la reçoit. Demandez, ne supposez pas."},{"t":"ATTENTE (VROOM)","who":"Entreprise de services","x":"Une collaboratrice dit : « Même si je me forme à ce nouvel outil, je ne serai pas meilleure, il est trop compliqué pour moi. » Vous voulez qu’elle suive la formation.","o":[["Rendre la formation obligatoire sous peine de sanction, avec un suivi des présences",0,"L’obligation sans soutien renforce la peur d’échouer."],["Lui promettre une prime à la fin de la formation, si elle valide la certification",1,"La prime peut aider si l’attente existe ; ici, elle est faible, donc la prime est insuffisante."],["Un accompagnement progressif avec un binôme et des petits succès rapides",2,"L’attente (efficacité personnelle, Bandura) se construit par de petits succès. Un accompagnement progressif la restaure."]],"w":"Quand la personne doute de pouvoir réussir, on agit sur la confiance : étapes courtes, succès précoces, soutien."},{"t":"ÉQUITÉ (ADAMS)","who":"NovaSoft · direction","x":"Vous découvrez que deux collaborateurs aux postes identiques ont des salaires différents de 3 000 € par an, sans raison. Le moins payé l’a appris par hasard et il est très tendu.","o":[["Augmenter le moins payé en lui demandant de ne pas en parler, pour éviter un effet de contagion",1,"Vous réglez le cas mais pas la cause (critères flous) et vous demandez de cacher une injustice."],["Analyser l’écart avec la RH, corriger s’il est injustifié et expliquer les critères",2,"Adams : la perception d’iniquité démotive. Corriger un écart injustifié et expliquer les critères rétablit la confiance."],["Lui dire de ne pas comparer son salaire à celui des autres : cela nuit à l’ambiance",0,"Vous aggravez le sentiment d’injustice et vous ignorez que, légalement, l’égalité de rémunération pour un travail de valeur égale est une obligation."]],"w":"Adams : les gens comparent leurs apports et leurs résultats à ceux des autres. Une iniquité ressentie démotive, même si le salaire en soi est correct."},{"t":"ÉQUITÉ (ADAMS)","who":"Équipe de projet","x":"Deux membres de l’équipe font le même travail. L’un finit systématiquement à 17 h, l’autre reste jusqu’à 19 h pour terminer ses tâches. Ils ont la même prime. Le second commence à dire « à quoi bon ».","o":[["Analyser la charge réelle, rééquilibrer le travail et reconnaître l’effort",2,"L’équité porte sur l’effort perçu autant que sur le résultat. Rééquilibrer et reconnaître évite le désengagement."],["Dire à celui qui reste tard d’arrêter de se plaindre",0,"Vous niez un déséquilibre réel et vous risquez de le démotiver durablement."],["Donner une prime supplémentaire à celui qui reste tard, sans toucher à la charge",1,"Il peut se sentir mieux reconnu, mais la surcharge réelle reste et l’autre peut se sentir lésé."]],"w":"L’équité se joue sur le rapport entre ce que l’on apporte et ce que l’on reçoit. Une charge inégalement répartie est une source d’iniquité."},{"t":"ÉQUITÉ (ADAMS)","who":"NovaSoft · squad Beta","x":"Une promotion vient d’être attribuée à un collaborateur de la squad Beta. Un autre, qui y croyait, vous dit : « Les critères n’ont jamais été clairs. »","o":[["Dire que les décisions de promotion sont confidentielles et ne se discutent pas, par respect de tous",0,"Vous ne divulguez pas les informations d’autrui, mais le refus total de discuter des critères entretient le soupçon de favoritisme."],["Dire à ce collaborateur qu’il sera promu la prochaine fois, s’il continue ses efforts",0,"Une promesse sans engagement ni critère est une fausse promesse : vous créez une dette que vous ne pourrez peut-être pas honorer."],["Reconnaître le manque de transparence, présenter les critères de décision et planifier la suite",2,"La justice procédurale (critères clairs, décision expliquée) compte autant que le résultat pour l’acceptation d’une décision."]],"w":"La justice procédurale : critères connus à l’avance, décision expliquée, possibilité de s’exprimer. Elle rend acceptables des décisions défavorables."},{"t":"ÉQUITÉ (ADAMS)","who":"Cabinet de conseil","x":"Un collaborateur senior, mieux payé que les autres, constate que les juniors reçoivent des primes proportionnellement plus importantes. Il veut quitter l’entreprise.","o":[["Lui proposer une grosse augmentation immédiatement pour qu’il reste, quitte à revoir le budget",1,"Cela peut le retenir, mais vous créez une iniquité nouvelle vis-à-vis des autres, et ne traitez pas la perception."],["Lui expliquer le système de primes, vérifier l’écart et en discuter avec lui",2,"On vérifie la réalité de l’écart avant de réagir et on explique. L’information réduit la perception d’iniquité et permet un ajustement s’il y a lieu."],["Lui dire qu’il est déjà bien payé",0,"Cela ignore le problème de comparaison. Vous le confirmez dans l’idée que l’entreprise ne l’écoute pas."]],"w":"Avant de réagir à un sentiment d’injustice, vérifiez les faits et expliquez les règles : parfois l’écart est justifié mais inconnu."},{"t":"AUTONOMIE","who":"NovaSoft · squad Alpha","x":"Léa propose de tester une nouvelle méthode de travail. Vous craignez le risque. Elle a de bons résultats et vous fait confiance.","o":[["Lui laisser tester sur un périmètre limité, avec critères de succès et point de bilan",2,"Autonomie encadrée : on donne de la latitude (besoin d’autonomie, Deci et Ryan) tout en limitant le risque. La personne se sent responsable."],["Accepter sans aucun cadre ni suivi, pour montrer qu’on lui fait confiance",1,"Vous donnez de l’autonomie, mais sans critères ni bilan : si ça échoue, vous ne saurez pas pourquoi."],["Refuser : il vaut mieux s’en tenir à ce qui fonctionne et a déjà fait ses preuves chez les clients",0,"Un refus de principe, sans examen de la proposition, fait baisser l’initiative. Les meilleurs finissent par partir."]],"w":"L’autonomie motive quand elle est encadrée : objectif clair, limites, point de contrôle."},{"t":"AUTONOMIE","who":"Entreprise de services","x":"Vous contrôlez chaque jour le travail d’une collaboratrice expérimentée. Elle devient passive et fait le strict minimum.","o":[["Supprimer tout contrôle sans prévenir",1,"Vous donnez la confiance, mais sans expliquer ni cadrer, elle ne saura pas ce que vous attendez."],["Augmenter les contrôles pour qu’elle se reprenne",0,"Plus de contrôle renforce la passivité. C’est un cercle vicieux."],["Passer d’un contrôle quotidien à un point hebdomadaire sur les résultats, en lui laissant le choix de la méthode",2,"Le micro-management étouffe l’autonomie et la compétence. Faire confiance sur la méthode et contrôler sur le résultat restaure l’implication."]],"w":"Le micro-management détruit la motivation intrinsèque. On contrôle les résultats, on laisse libre le chemin."},{"t":"AUTONOMIE","who":"NovaSoft · équipe DevOps","x":"Un jeune ingénieur vous demande de nouvelles responsabilités après six mois. Vous le trouvez prometteur mais encore fragile sur certains sujets.","o":[["Lui confier toute la responsabilité d’un projet critique pour qu’il montre ce dont il est capable",0,"Surdimensionné : en cas d’échec, vous le fragilisez et vous exposez l’entreprise."],["Une responsabilité progressive : périmètre limité, coaching et bilan à trois mois",2,"La responsabilité progressive nourrit le besoin de compétence et d’autonomie sans le mettre en difficulté. Style entraîner, puis associer."],["Lui répondre qu’il doit attendre un an d’ancienneté, comme le veut la règle de l’équipe",1,"L’attente est parfois justifiée, mais sans perspective ni étape intermédiaire, la frustration monte."]],"w":"La responsabilité se donne par paliers : périmètre, soutien, bilan. Trop tôt écrase, trop tard décourage."},{"t":"AUTONOMIE","who":"Agence de communication","x":"Une équipe créative est très motivée par ses projets, mais déplore une surcharge administrative (rapports, saisies). Cela réduit sa liberté de créer.","o":[["Leur demander de s’y mettre davantage pour monter en compétence sur les outils de reporting",0,"On ajoute de la charge sur ce qui démotive déjà."],["Embaucher un manager pour contrôler les rapports et garantir la qualité des données",1,"Cela soulage peut-être, mais augmente le contrôle et le coût sans résoudre la cause."],["Simplifier ou automatiser les tâches administratives pour libérer du temps",2,"Réduire les tâches à faible valeur protège ce qui motive (créer). L’agent retrouve de la marge d’autonomie."]],"w":"Retirer ce qui démotive peut être plus efficace qu’ajouter ce qui motive. Libérer du temps pour le cœur du métier est un levier fort."},{"t":"OBJECTIFS ET RECONNAISSANCE","who":"NovaSoft · squad Beta","x":"Vous fixez l’objectif suivant à la squad : « Faire de votre mieux sur la qualité ce trimestre. »","o":[["Passer de 12 à 6 bugs critiques par version d’ici fin septembre, point chaque semaine",2,"Locke : un objectif spécifique, mesurable et ambitieux mais atteignable mobilise plus qu’un « faire de son mieux »."],["Fixer un objectif très élevé pour pousser l’équipe : 0 bug critique dès la prochaine version",1,"Ambitieux, mais irréaliste : l’équipe peut renoncer d’emblée. Un bon objectif est difficile mais atteignable."],["Garder l’objectif tel quel : le flou laisse de la liberté et de l’initiative à l’équipe",0,"Un objectif flou ne guide pas et ne se mesure pas. On ne sait ni quand on réussit ni quand on échoue."]],"w":"Un bon objectif est spécifique, mesurable, atteignable, réaliste et daté (SMART). Les objectifs précis et exigeants mais atteignables motivent plus que le « mieux possible »."},{"t":"OBJECTIFS ET RECONNAISSANCE","who":"Entreprise de services","x":"Un manager dit à son équipe : « Je sais que vous n’y arriverez pas, mais essayez. » Les résultats sont effectivement mauvais.","o":[["Lui expliquer l’effet Pygmalion : nos attentes influencent les résultats des autres",2,"Rosenthal : les attentes élevées ou faibles du manager se transmettent par le ton, le temps accordé, les feedbacks, et influencent les performances."],["Lui dire de continuer, car il est réaliste et que les faits lui donnent raison",0,"Un « réalisme » qui affiche l’échec prépare l’échec. Il crée la prophétie qu’il annonce."],["Lui conseiller de dire l’inverse de ce qu’il pense pour motiver artificiellement l’équipe",1,"Des attentes affichées mais pas crues se voient. Il faut changer sa vision et son soutien, pas seulement ses mots."]],"w":"L’effet Pygmalion : les attentes d’un manager se réalisent en partie parce qu’elles guident ses comportements. Croire en l’équipe, c’est aussi l’outiller."},{"t":"OBJECTIFS ET RECONNAISSANCE","who":"NovaSoft · squad Gamma","x":"Rayan a atteint un objectif difficile, mais vous êtes pressé et vous passez à autre chose sans rien dire. Une semaine plus tard, il a perdu son enthousiasme.","o":[["Attendre l’entretien annuel pour lui en parler",0,"Plus la reconnaissance est tardive, moins elle compte. Attendre l’entretien annuel, c’est trop tard."],["Revenir vers lui, lui dire ce qu’il a réussi, ce que cela a apporté à l’équipe, et lui demander ce qu’il veut faire ensuite",2,"La reconnaissance tardive vaut mieux que pas de reconnaissance. Elle doit être précise et ouvrir sur l’avenir."],["Lui envoyer un message : « Bravo ! »",1,"Mieux que rien, mais trop pauvre en contenu. Il ne saura pas ce qui a compté."]],"w":"La reconnaissance se donne vite, précisément et sincèrement. Mais rattraper un oubli est toujours préférable au silence."},{"t":"OBJECTIFS ET RECONNAISSANCE","who":"Cabinet comptable","x":"Votre entreprise instaure un « employé du mois » récompensé par une carte-cadeau. Après trois mois, les employés se plaignent d’un classement injuste et la coopération baisse.","o":[["Continuer, puisque c’est une bonne idée dans d’autres entreprises du secteur et que ça s’est bien passé",0,"Ce qui marche ailleurs ne marche pas toujours chez vous. Les effets négatifs constatés sont une alerte."],["Augmenter la valeur de la carte-cadeau pour renforcer l’effet incitatif",1,"Cela renforce la compétition et ne résout ni les critères ni la coopération."],["Remplacer par une reconnaissance d’équipe fondée sur des critères collectifs précis",2,"Une reconnaissance individuelle compétitive peut détruire la coopération. Les critères flous alimentent le sentiment d’injustice."]],"w":"Un dispositif de reconnaissance doit être évalué sur ses effets réels. Les récompenses compétitives peuvent nuire à la coopération."}]},"equipe":{"cards":[{"t":"PHASES DE L’ÉQUIPE","who":"NovaSoft · nouvelle squad Epsilon","x":"La squad Epsilon vient d’être formée avec six personnes qui ne se connaissent pas. Tout le monde est poli, personne ne conteste rien, et les réunions sont silencieuses.","o":[["Déléguer entièrement l’organisation à l’équipe pour favoriser son autonomie dès le départ",1,"Trop tôt : le groupe n’a ni repères ni confiance. Il se sentirait abandonné."],["Attendre que les premiers conflits émergent pour les gérer au cas par cas, sans brider l’équipe",0,"On ne provoque pas la tempête, on prépare l’équipe à la traverser. Sans cadre clair, elle sera plus violente."],["Clarifier le but, les rôles et les règles, et créer des occasions de mieux se connaître",2,"Phase de formation (Tuckman) : le groupe cherche ses repères et dépend du manager. Style directif sur le cadre, avec du lien."]],"w":"Formation : le manager donne le cadre (but, rôles, règles) et favorise la connaissance mutuelle."},{"t":"PHASES DE L’ÉQUIPE","who":"NovaSoft · squad Epsilon","x":"Six semaines après, les désaccords éclatent : deux sous-groupes s’affrontent sur la méthode, les débats sont tendus, et un membre dit qu’il veut partir.","o":[["Accepter cette phase comme normale, poser des règles de débat et un mode de décision partagé",2,"Phase de tempête : les désaccords sont normaux et nécessaires. Le manager encadre, écoute, entraîne et ne supprime pas le conflit."],["Remplacer les deux leaders des sous-groupes pour repartir sur une équipe plus apaisée",0,"Vous traitez les personnes pour un phénomène collectif. Vous retardez la maturation de l’équipe."],["Étouffer les désaccords en imposant sa méthode, pour tenir les délais du sprint en cours et rassurer la direction",1,"Cela ramène le calme à court terme, mais l’équipe ne mûrit pas et les tensions réapparaîtront."]],"w":"La tempête n’est pas un échec : c’est le passage obligé vers la normalisation. Le manager encadre le débat plutôt que de le supprimer."},{"t":"PHASES DE L’ÉQUIPE","who":"Entreprise de services","x":"Une équipe fonctionne bien depuis un an. Les règles sont claires, l’ambiance est bonne, mais les gens évitent de se contredire et les idées nouvelles se raréfient.","o":[["Provoquer artificiellement des conflits pour casser la routine et stimuler le débat",1,"La contradiction constructive est utile ; fabriquer des conflits ne l’est pas. Il faut un cadre de confiance."],["Encourager la contradiction constructive : revues critiques, rotation des rôles",2,"Phase de normalisation qui risque la complaisance : pour atteindre la performance, il faut oser challenger. Le style associer ou déléguer s’impose."],["Ne rien changer : tout va bien, l’équipe est efficace et les clients sont satisfaits",0,"L’équipe stagne. Le confort est un risque quand il étouffe l’innovation."]],"w":"Une équipe trop harmonieuse peut cesser d’innover. La performance suppose confiance et capacité à se contredire."},{"t":"PHASES DE L’ÉQUIPE","who":"NovaSoft · squad Alpha","x":"Un membre clé quitte l’équipe, deux nouveaux arrivent. L’équipe, performante jusque-là, devient hésitante et retrouve des tensions anciennes.","o":[["Reprocher à l’équipe de régresser alors qu’elle avait atteint un bon niveau de performance",0,"Le reproche ne sert à rien : c’est un mécanisme normal."],["Reconnaître que l’équipe repart sur un cycle et rejouer le cadre : but, rôles, règles",2,"Tout changement de composition relance le cycle. Le manager adapte son style à la phase réelle."],["Laisser faire : ils se débrouilleront comme avant, ils ont déjà prouvé leur maturité collective",1,"Les anciennes habitudes ne suffisent plus. Sans soutien, l’équipe peut rester bloquée."]],"w":"Une équipe n’est jamais acquise : chaque départ ou arrivée peut ramener à la phase de formation ou de tempête."},{"t":"RÔLES D’ÉQUIPE","who":"NovaSoft · squad Beta","x":"Votre équipe compte cinq excellents spécialistes techniques, tous créatifs. Pourtant les projets prennent du retard : personne ne suit les échéances ni ne termine les détails.","o":[["Demander à chacun d’être plus rigoureux et de mieux suivre les échéances, avec un point mensuel",1,"On demande à tous de faire ce qu’ils font mal. Une répartition des rôles est plus efficace que des injonctions."],["Recruter un sixième expert technique pour renforcer la capacité de production de l’équipe",0,"Vous aggravez le déséquilibre."],["Identifier le rôle manquant (organisateur, finisseur) et le confier à quelqu’un de l’équipe",2,"Belbin : une équipe performante a un équilibre de rôles. Trop d’idées sans finition produit du retard."]],"w":"Belbin : les rôles d’équipe (cerveau, organisateur, finisseur, coordinateur, etc.) doivent être couverts. On recrute et on répartit en fonction des rôles manquants."},{"t":"RÔLES D’ÉQUIPE","who":"Cabinet de conseil","x":"Un consultant brillant propose sans cesse de nouvelles idées, mais n’en termine aucune. Les autres commencent à s’agacer.","o":[["L’associer à un finisseur qui transforme ses idées en livrables",2,"Chaque rôle a ses forces et ses faiblesses : le « cerveau » de Belbin a besoin d’un complément. On exploite le talent sans en subir les limites."],["Le laisser faire : c’est sa nature et son enthousiasme est utile à l’ambiance",1,"On accepte sa nature mais on subit ses limites. Il faut organiser la complémentarité."],["Lui demander d’arrêter de proposer des idées pour se concentrer sur l’exécution du sprint",0,"Vous étouffez sa valeur et vous le démotivez."]],"w":"Les forces d’un rôle sont aussi ses faiblesses admissibles. On organise la complémentarité plutôt que de chercher à corriger la personne."},{"t":"RÔLES D’ÉQUIPE","who":"NovaSoft · équipe Data","x":"Nina anime très bien les réunions, mais elle décide à la place des autres. Deux collègues disent qu’ils ne se sentent plus écoutés.","o":[["Dire aux deux collègues de s’exprimer davantage, même quand Nina parle",0,"Vous renversez la responsabilité sur ceux qui subissent. Le problème est le style de Nina."],["Lui faire remarquer l’effet de son style et l’aider à faire émerger la décision",2,"Le coordinateur efficace fait parler les autres. Un excès devient dirigisme : on conserve la force, on corrige l’excès."],["L’écarter de l’animation des réunions au profit d’un animateur plus neutre, au moins pendant quelques semaines",1,"Vous perdez un talent d’animation. Mieux vaut l’accompagner que l’écarter."]],"w":"Chaque rôle a un excès possible. Le rôle du manager est d’aider la personne à le doser, pas de la changer."},{"t":"RÔLES D’ÉQUIPE","who":"Équipe de projet","x":"Un critique qui pointe systématiquement les risques freine les décisions. Il a souvent raison, mais le reste de l’équipe voit en lui un « rabat-joie ».","o":[["Lui demander de se taire jusqu’à ce que les décisions soient prises, pour ne pas ralentir",0,"Vous perdez une alerte précieuse et l’équipe ne verra pas les risques."],["Laisser l’équipe l’ignorer",0,"Ignorer les risques coûte cher. Ses alertes peuvent éviter des erreurs graves."],["Lui donner un rôle explicite d’examen des risques, avec un temps dédié en réunion",2,"On institutionnalise sa force : sa critique devient attendue, ciblée et utile, au lieu d’être perçue comme une obstruction."]],"w":"Donner un rôle explicite à un profil critique transforme son comportement en contribution attendue."},{"t":"RÉUNIONS","who":"NovaSoft · direction","x":"La réunion hebdomadaire dure deux heures, sans ordre du jour, et finit sans décision. Chacun dit qu’il « n’en peut plus ».","o":[["Un objectif, un ordre du jour chronométré, un animateur et des décisions écrites",2,"Une réunion utile a un objectif, un cadre et une sortie : décisions, responsables, échéances."],["Supprimer la réunion et la remplacer par un compte rendu écrit envoyé chaque lundi par e-mail",1,"Cela soulage, mais les sujets de coordination restent sans lieu pour être traités."],["L’allonger d’une heure pour traiter tous les sujets en attente",0,"La fatigue réduit l’efficacité. Une réunion trop longue produit moins de décisions."]],"w":"Avant, pendant, après : objectif et ordre du jour, animateur et gardien du temps, relevé de décisions (qui, quoi, quand)."},{"t":"RÉUNIONS","who":"Agence de communication","x":"Vous constatez que dans vos réunions, les deux mêmes personnes parlent 80 % du temps. Les autres ne disent rien et ne remettent rien en cause.","o":[["Ne rien changer : ceux qui ont des idées les disent, c’est une question de personnalité",0,"Les introvertis ou ceux qui hésitent ne s’exprimeront pas spontanément. Vous perdez leurs idées."],["Demander aux deux collaborateurs les plus bavards de se taire pour laisser la place aux autres",1,"Cela donne de la place, mais pas la méthode pour que les autres la prennent."],["Changer la méthode : tour de parole, réflexion individuelle avant discussion, facilitateur",2,"On élargit la participation par la méthode, pas en demandant aux silencieux de parler. Cela réduit l’influence des plus bavards."]],"w":"Pour faire parler tout le monde, on agit sur la méthode : tour de table, temps individuel avant le groupe, rôle de facilitateur."},{"t":"RÉUNIONS","who":"NovaSoft · squad Delta","x":"Un point quotidien (stand-up) de 15 minutes dérive en discussions techniques d’une heure. Plusieurs membres de la squad s’ennuient.","o":[["Supprimer le stand-up pour gagner du temps et le remplacer par un compte rendu écrit dans le canal Teams de l’équipe",1,"On perd la synchronisation rapide. Le problème est le dérapage, pas le principe."],["Recentrer le stand-up sur trois questions (fait, à faire, blocages), discussions techniques à part",2,"Un rituel court est utile quand il reste court. Les sujets de fond se traitent à part, avec les personnes concernées."],["Le laisser tel quel : les échanges techniques sont utiles et permettent de résoudre les problèmes à chaud",0,"Ils sont utiles pour certains, inutiles pour d’autres. Le temps de tous est gaspillé."]],"w":"Un rituel a une forme et une durée. Les sujets de fond se traitent à part, avec ceux qui sont concernés."},{"t":"RÉUNIONS","who":"Entreprise de services","x":"Vous animez une réunion à distance. Plusieurs participants coupent leur caméra et semblent lire autre chose. L’échange est pauvre.","o":[["Réduire la durée, poser des questions directes et donner à chacun une tâche active",2,"À distance, l’engagement se construit par l’interaction : courte durée, questions nominatives, outils collaboratifs."],["Poursuivre la présentation comme prévu : le contenu est important et le support a été bien préparé",0,"Vous parlez dans le vide."],["Exiger que toutes les caméras soient allumées pour retrouver l’attention des participants",1,"La caméra n’assure pas l’attention, et l’exigence peut être mal vécue. L’interaction est plus efficace."]],"w":"À distance, on remplace la présence par l’interaction : courtes séquences, questions nominatives, outils partagés."},{"t":"INTÉGRATION","who":"NovaSoft · squad Gamma","x":"Une nouvelle recrue arrive lundi. Elle a un poste, un ordinateur mais personne ne l’attend. Elle passe la matinée seule à lire de la documentation.","o":[["Lui dire de se débrouiller : « C’est comme ça qu’on apprend, nous aussi on a fait pareil »",0,"Cette méthode produit de la solitude et des départs pendant la période d’essai."],["Un parcours d’intégration : accueil, parrain, objectifs des premières semaines",2,"Les premières semaines déterminent l’engagement et le risque de départ précoce. Un parcours structuré accélère l’autonomie."],["Lui organiser une grande fête de bienvenue le premier jour avec toute la direction",1,"Chaleureux, mais sans parcours d’apprentissage ni objectif, l’intégration reste superficielle."]],"w":"Un bon accueil : parrain, parcours, objectifs de départ, présentation de l’équipe. Le coût d’un départ en période d’essai est très supérieur à celui d’un parcours d’intégration."},{"t":"INTÉGRATION","who":"NovaSoft · équipe Support","x":"Un nouveau salarié, très compétent, fait remarquer en réunion que « ce n’est pas comme ça qu’on faisait dans mon ancienne entreprise ». L’équipe ressent cela comme de l’arrogance.","o":[["Dire à l’équipe de s’adapter à lui puisqu’il vient avec l’expérience d’un grand groupe",0,"L’équipe se sentira niée dans son expertise et le conflit éclatera."],["Lui dire de se taire pendant six mois, le temps de bien comprendre comment fonctionne l’entreprise",0,"Vous perdez une richesse et le signal est : « on ne vous écoute pas »."],["Lui expliquer les raisons des pratiques actuelles et l’inviter à proposer ses idées chiffrées",2,"On canalise son regard neuf vers une contribution utile et argumentée, plutôt que de laisser la comparaison heurter l’équipe."]],"w":"Un nouveau apporte un regard neuf : il faut le canaliser, pas l’étouffer, et lui apprendre les codes du collectif."},{"t":"INTÉGRATION","who":"Entreprise de services","x":"À la fin de la période d’essai, un salarié dit qu’il n’a presque pas vu son manager. Vous n’avez eu qu’un entretien en trois mois.","o":[["Programmer des points réguliers dès le premier jour, avec un bilan à mi-période d’essai",2,"Le suivi du nouvel arrivant est une responsabilité du manager. Un bilan à mi-période permet de corriger à temps."],["Lui confier un mentor mais sans point avec vous",1,"Le mentor aide, mais ne remplace pas votre suivi. Vous êtes responsable du bilan."],["Attendre la fin de la période d’essai pour lui faire un retour global et décider sur la durée",0,"Vous ne lui avez pas donné la chance de réussir, et vous prenez une décision grave avec peu d’informations."]],"w":"Pendant la période d’essai, le manager suit, donne du feedback et fait un bilan intermédiaire. Ce n’est pas une épreuve de survie."},{"t":"INTÉGRATION","who":"NovaSoft · squad Alpha","x":"Un salarié en reprise après un long arrêt revient dans une équipe qui a changé. Il se sent « hors du coup » et hésite à demander de l’aide.","o":[["Organiser un entretien de reprise, partager ce qui a changé et lui proposer un parrain",2,"L’accueil après absence est une intégration. Un entretien de reprise et un référent facilitent le retour."],["Lui laisser le temps de se débrouiller seul pour retrouver ses marques à son rythme",0,"Il peut se sentir abandonné et ne pas oser demander."],["Faire comme s’il n’était jamais parti, pour qu’il se sente vite de nouveau intégré à l’équipe",1,"Bien intentionné pour éviter de le mettre mal à l’aise, mais cela l’isole face aux changements."]],"w":"Un retour après absence se prépare comme une intégration : entretien, information sur les changements, référent."},{"t":"DIVERSITÉ ET CONFIANCE","who":"NovaSoft · direction","x":"L’entreprise compte 19 femmes sur 85 salariés, presque toutes au support et au produit. Un manager technique dit : « Nous ne trouvons pas de candidates. »","o":[["Ne rien changer : on recrute les meilleurs, quel que soit le genre, et les candidatures sont rares",0,"Cette position ignore le risque de biais inconscients et prive l’entreprise de talents."],["Analyser tout le processus de recrutement (offres, canaux, jury) et agir sur les biais",2,"La rareté apparente peut venir des offres, des canaux et des biais de sélection. On agit sur le processus avant d’accuser le vivier."],["Fixer un quota de femmes à embaucher en urgence pour corriger rapidement la situation avant la revue annuelle",1,"L’intention est bonne, mais un quota imposé sans analyse peut être contre-productif et juridiquement délicat."]],"w":"La diversité se travaille en amont : offres, canaux, grille de sélection. L’égalité professionnelle fait l’objet d’un index obligatoire dès 50 salariés."},{"t":"DIVERSITÉ ET CONFIANCE","who":"NovaSoft · squad Beta","x":"Dans une réunion, un membre plaisante sur l’âge d’un collègue plus âgé. Tout le monde rit sauf le collègue concerné, qui se tait. Vous êtes manager.","o":[["Prendre l’auteur de la blague en privé le lendemain, sans rien dire sur le moment, pour ne pas l’exposer",1,"C’est une bonne démarche, mais l’absence de réaction immédiate laisse penser que le groupe est d’accord."],["Ne rien dire : c’était une blague, personne ne semble s’en être offusqué et ça risque de l’aggraver",0,"Le silence du manager vaut approbation. L’âge est un critère de discrimination interdit, et les blagues répétées peuvent devenir du harcèlement."],["Intervenir immédiatement et calmement pour recadrer, puis échanger avec le collègue",2,"Ne rien dire valide la remarque. Intervenir sur le moment envoie un signal clair : le respect est une règle de l’équipe."]],"w":"Face à une remarque discriminante : réagir sur le moment (brièvement), puis en privé. Le silence du manager est un message."},{"t":"DIVERSITÉ ET CONFIANCE","who":"Cabinet de conseil","x":"Dans votre équipe, un collaborateur n’ose jamais poser de questions de peur de paraître incompétent. Une erreur récente aurait pu être évitée s’il avait demandé.","o":[["Lui dire de se débrouiller mieux et de ne solliciter l’équipe qu’en cas de vrai blocage",0,"Vous renforcez sa peur. L’erreur suivante sera cachée."],["Créer un climat où signaler une erreur est valorisé : montrer l’exemple, remercier, ne pas sanctionner",2,"Edmondson : la sécurité psychologique est la condition d’une équipe performante. Les erreurs signalées tôt coûtent moins cher."],["Créer une procédure de contrôle supplémentaire pour sécuriser chaque livraison avant la mise en production",1,"Elle peut aider mais traite le symptôme. Le fond est la peur de demander."]],"w":"La sécurité psychologique : l’équipe ose poser des questions, dire « je ne sais pas » et signaler une erreur. Le manager la construit par son exemple."},{"t":"DIVERSITÉ ET CONFIANCE","who":"NovaSoft · direction","x":"Votre équipe de direction montre une absence de confiance : les décisions sont discutées en couloir, chacun protège son périmètre, et les engagements ne sont pas tenus.","o":[["Revenir aux fondamentaux : parler en réunion, clarifier les engagements, mesurer collectivement",2,"Lencioni : confiance, conflit constructif, engagement, responsabilité mutuelle, résultats collectifs. Il faut reconstruire la base."],["Organiser un week-end de cohésion avec activités de loisirs pour resserrer les liens",0,"La cohésion artificielle sans changement de pratique laisse la défiance intacte."],["Remplacer le directeur le plus bruyant, qui monopolise la parole et bloque les décisions des autres",1,"La personne n’est pas forcément la cause. Le fonctionnement collectif reste à traiter."]],"w":"Une équipe se reconstruit par ses pratiques : parler en réunion, tenir les engagements, mesurer ensemble. Pas par un week-end."}]},"recrutement":{"cards":[{"t":"L’OFFRE D’EMPLOI","who":"NovaSoft · recrutement d’un développeur","x":"Un manager rédige l’offre : « Recherchons jeune développeur dynamique, de préférence célibataire et disponible, 25-30 ans maximum. » Il vous la soumet avant publication.","o":[["Publier telle quelle : c’est le souhait de l’équipe",0,"Vous exposez l’entreprise à un risque de sanction pour discrimination à l’embauche, et vous écartez des candidats compétents."],["Réécrire l’offre sur les compétences, les missions et les conditions, en supprimant toute référence à l’âge, à la situation familiale ou à la « jeunesse »",2,"Une offre ne doit contenir aucun critère discriminatoire : âge, situation de famille, sexe, etc. (Code du travail, L1132-1). On décrit le poste, pas la personne."],["Garder l’offre mais retirer seulement « célibataire »",1,"Un critère illégal est retiré, mais l’âge reste un critère discriminatoire, tout autant que « jeune »."]],"w":"Une offre d’emploi décrit le poste, les compétences et les conditions. Elle ne peut contenir ni critère discriminatoire, ni mention d’âge, de situation familiale ou de nationalité (hors règles légales)."},{"t":"L’OFFRE D’EMPLOI","who":"NovaSoft · recrutement d’un technicien support","x":"L’offre indique 12 exigences obligatoires : diplôme Bac+5, 10 ans d’expérience, cinq langues et trois certifications. Après un mois, vous n’avez reçu aucune candidature.","o":[["Garder 3 à 4 critères indispensables, classer le reste en souhaitable et l’afficher clairement dans l’offre",2,"Une liste excessive décourage les bons candidats. Les critères indispensables doivent correspondre à ce que le poste exige vraiment."],["Garder les 12 exigences mais prolonger la diffusion de l’offre de deux mois et la relayer sur d’autres sites d’emploi : la qualité exige de la patience",1,"Un peu de patience peut payer, mais un mois sans candidature est un signal que l’offre est mal calibrée."],["Baisser le salaire proposé pour compenser les exigences",0,"Absurde : moins attractif et plus exigeant, vous aggravez le manque de candidatures."]],"w":"Une offre efficace hiérarchise : peu de critères indispensables, des critères souhaitables, des conditions claires. Trop d’exigences écartent les bons profils."},{"t":"L’OFFRE D’EMPLOI","who":"Entreprise de services","x":"Un responsable veut préciser le salaire dans l’offre pour attirer plus de candidats. Un autre dit que « on n’indique jamais le salaire ». Vous cherchez la bonne pratique.","o":[["Ne rien indiquer, comme d’habitude",1,"Légal à ce jour, mais vous perdez des candidats qui ne postulent pas à l’aveugle, et l’évolution du droit va vers plus de transparence."],["Afficher la fourchette haute du marché, quitte à ajuster à la baisse lors de la négociation, pour attirer davantage de candidats",0,"Mensonge qui se retrouvera à la négociation : vous perdez le candidat et votre crédibilité."],["Indiquer une fourchette réaliste : candidats alignés, moins de négociations inutiles",2,"Aujourd’hui l’indication du salaire est en principe facultative en France, mais elle est de plus en plus attendue ; une fourchette réaliste fait gagner du temps. Une transposition de la directive européenne sur la transparence salariale est annoncée."]],"w":"La transparence sur la rémunération progresse (directive européenne 2023/970 en cours de transposition). Une fourchette réaliste est un atout d’attractivité."},{"t":"L’OFFRE D’EMPLOI","who":"NovaSoft · direction","x":"Votre offre est publiée uniquement par cooptation : les salariés en parlent à leur réseau. Résultat : les candidats se ressemblent beaucoup (même école, même âge, même région).","o":[["Garder la cooptation et la compléter : site emploi, écoles variées, associations, plateformes diverses",2,"La cooptation est utile (rapide, fiable) mais peut reproduire les profils. Élargir les sources augmente la diversité et le vivier."],["Ne rien changer : les profils se ressemblent parce que les salariés ne recommandent que des personnes qu’ils jugent compétentes, donc bonnes",0,"C’est un biais de similarité. Vous passez à côté de talents et vous accroissez le risque de discrimination indirecte."],["Arrêter la cooptation",1,"Vous perdez un canal efficace. Mieux vaut le compléter."]],"w":"La cooptation produit des profils proches de ceux qui recommandent. Diversifier les canaux évite la discrimination indirecte."},{"t":"PRÉSÉLECTION","who":"NovaSoft · tri de CV","x":"Vous recevez 120 CV. Un manager veut éliminer d’office ceux qui ont une « trop longue période d’inactivité » et ceux qui viennent de certains quartiers.","o":[["Lire tous les CV sans critères et choisir « à l’instinct »",1,"Légal, mais vulnérable aux biais de similarité, de halo et de confirmation. L’instinct reproduit nos préférences."],["Éliminer les CV du quartier mentionné, puis appliquer les autres critères de façon identique à tous les candidats restants",0,"Le lieu de résidence est un critère discriminatoire interdit (L1132-1). Vous engagez la responsabilité de l’entreprise."],["Fixer des critères objectifs liés au poste avant de lire les CV et les appliquer à tous",2,"Une grille de critères définie à l’avance limite les biais. Le lieu de résidence est un motif de discrimination interdit."]],"w":"Avant de lire les CV, fixer une grille de critères liés au poste. Le lieu de résidence, l’âge, le nom, le sexe ne sont jamais des critères valables."},{"t":"PRÉSÉLECTION","who":"NovaSoft · profils de développeurs","x":"Un manager hésite entre deux candidats : l’un a un parcours classique, l’autre a changé trois fois de secteur et a repris une formation. Il dit : « Le second est instable. »","o":[["Choisir le premier, plus rassurant : son parcours linéaire laisse penser qu’il restera plus longtemps dans l’entreprise",1,"Le rassurant n’est pas forcément le meilleur. Le choix doit s’appuyer sur la grille."],["Évaluer ce que ces changements révèlent (apprentissage, adaptation) face aux compétences demandées",2,"Un parcours atypique est une information à analyser, non un défaut. On compare aux critères du poste, pas à un modèle idéal."],["Écarter le second sur la base du mot « instable »",0,"Un jugement de valeur sans fait. Biais de confirmation : on cherche des preuves de ce qu’on croit déjà."]],"w":"Un parcours atypique ne s’évalue pas avec un préjugé. On compare les compétences et la motivation aux exigences du poste."},{"t":"PRÉSÉLECTION","who":"NovaSoft · RH","x":"Une candidate vous contacte pour une autre offre. Vous retrouvez son profil public sur un réseau social privé avec des photos de vacances et des opinions politiques. Un manager veut les utiliser.","o":[["Se limiter aux informations professionnelles ; ignorer photos et opinions personnelles",2,"Les informations recueillies doivent présenter un lien direct et nécessaire avec l’emploi (L1221-6). Les opinions et la vie privée sont exclues."],["Utiliser les photos pour juger de sa personnalité",0,"Vie privée et opinions ne sont pas des critères valables : discrimination et atteinte à la vie privée."],["Ne rien regarder du tout sur les réseaux, même professionnels, par prudence juridique et pour garantir l’égalité de traitement",1,"Consulter un profil professionnel public est admis. Ne rien regarder est inutilement restrictif."]],"w":"Seules les informations liées à l’emploi peuvent servir à décider. Les réseaux personnels (vie privée, opinions) sont à écarter."},{"t":"PRÉSÉLECTION","who":"NovaSoft · RH","x":"Vous conservez les CV de tous les candidats non retenus depuis cinq ans dans un dossier, sans les en avoir informés.","o":[["Conserver sans limite : cela peut servir un jour",0,"Une conservation illimitée sans information est contraire au RGPD."],["Informer les candidats, ne conserver leur CV qu’avec leur accord et pas plus de 2 ans après le dernier contact (recommandation de la CNIL), puis supprimer le reste",2,"Les candidats ont des droits RGPD : information, accès, effacement. Une durée de conservation limitée est la règle."],["Tout supprimer immédiatement dès le refus",1,"Conforme mais peu utile : avec l’accord du candidat, un vivier est légitime pour deux ans."]],"w":"Le RGPD s’applique au recrutement : informer, limiter la durée (2 ans maximum recommandés par la CNIL), respecter les droits."},{"t":"ENTRETIEN","who":"NovaSoft · entretien","x":"Pendant un entretien, un manager demande à une candidate : « Vous avez des enfants ? Vous comptez en avoir ? Qui les garde ? »","o":[["Il peut les poser car c’est important pour la disponibilité, à condition de les formuler avec bienveillance et sans pression",0,"La disponibilité se demande par rapport aux contraintes du poste (horaires, déplacements), pas à la situation familiale."],["Il peut les poser si la candidate est d’accord",0,"Même avec son accord apparent, ces questions sont illégitimes, et un refus de répondre ne peut pas lui être reproché."],["Non : ces questions sont sans lien avec l’emploi et la candidate n’a pas à y répondre",2,"Seules les informations ayant un lien direct et nécessaire avec l’emploi peuvent être demandées. La situation familiale et les projets de grossesse sont exclus."]],"w":"Les questions de l’entretien doivent avoir un lien direct avec l’emploi. Une candidate n’a pas à dire si elle est enceinte ou compte avoir des enfants."},{"t":"ENTRETIEN","who":"NovaSoft · entretien structuré","x":"Trois managers interviewent le même candidat sans préparation. Chacun pose les questions qui lui passent par la tête et donne ensuite son impression générale.","o":[["Demander à celui qui a le plus d’ancienneté de décider",0,"L’ancienneté ne garantit pas la fiabilité du jugement. Vous aggravez le risque de biais."],["Préparer un guide d’entretien commun avec grille de notation, puis noter individuellement avant de comparer",2,"L’entretien structuré est plus prédictif que l’entretien libre. Noter avant de discuter évite l’influence du plus bavard."],["Laisser faire : un entretien est avant tout une conversation, et la spontanéité révèle mieux le candidat qu’un guide figé",1,"La conversation compte, mais sans structure, les comparaisons sont impossibles."]],"w":"Entretien structuré : mêmes questions, critères de notation connus, notes individuelles avant débat. Il prédit mieux la performance que l’entretien libre."},{"t":"ENTRETIEN","who":"NovaSoft · entretien","x":"Un candidat vous dit : « Je préfère ne pas parler de ma santé. » Le poste est de bureau, sans contrainte physique particulière.","o":[["Respecter son choix : l’aptitude médicale relève de la médecine du travail après l’embauche",2,"L’état de santé est un critère protégé. L’employeur ne peut interroger que sur ce qui est nécessaire, et l’aptitude se juge par le médecin du travail."],["Insister pour connaître son état de santé : l’entreprise a le droit de savoir s’il pourra assurer le poste",0,"L’état de santé est un motif de discrimination interdit. Insister expose l’entreprise."],["Écarter sa candidature par prudence",0,"Vous discriminez sur un critère interdit sans fondement."]],"w":"La santé est protégée. Seule la médecine du travail apprécie l’aptitude, et c’est le candidat qui décide de ce qu’il dit sur sa santé."},{"t":"ENTRETIEN","who":"NovaSoft · tests","x":"Vous voulez faire passer un test de personnalité à tous les candidats. Vous ne comptez pas les prévenir, de peur qu’ils « préparent » leurs réponses.","o":[["Faire passer le test sans informer : c’est plus authentique, et les résultats restent confidentiels au sein du service RH",0,"Illégal. Le candidat doit connaître les méthodes et techniques utilisées avant leur mise en œuvre."],["Faire passer le test uniquement aux candidats qui hésitent",1,"Tester seulement certains candidats crée une inégalité de traitement."],["Informer le candidat de la méthode et de son objectif, garantir la confidentialité, consulter le CSE s’il existe",2,"Le candidat doit être informé des méthodes d’évaluation (L1221-8). Le CSE est consulté avant l’introduction de nouvelles méthodes de recrutement."]],"w":"Toute méthode d’aide au recrutement est portée à la connaissance du candidat, confidentielle, pertinente par rapport au poste, et soumise à consultation du CSE."},{"t":"BIAIS DE SÉLECTION","who":"NovaSoft · débrief de recrutement","x":"Un manager dit : « Je l’aime bien, il me rappelle moi à son âge. » Il veut recruter ce candidat plutôt qu’un autre mieux noté sur la grille.","o":[["Choisir le mieux noté sans discuter avec le manager",1,"La décision s’appuie sur l’objectivité, mais sans échange, vous risquez de braquer le manager."],["Revenir à la grille : comparer sur les critères définis, la sympathie n’en est pas un",2,"C’est le biais de similarité : on préfère ceux qui nous ressemblent. La grille objectivise la décision."],["Laisser le manager choisir : il connaît son équipe et c’est lui qui devra travailler au quotidien avec la personne",0,"Vous confiez une décision critique à un biais connu. Les conséquences sont lourdes : coût d’un mauvais recrutement."]],"w":"Biais de similarité : on recrute ceux qui nous ressemblent. Une grille de critères et un débriefing structuré le réduisent."},{"t":"BIAIS DE SÉLECTION","who":"NovaSoft · entretien","x":"Un candidat fait très bonne impression pendant les cinq premières minutes. Le recruteur n’écoute presque plus ensuite et décide de le retenir.","o":[["Reconnaître les effets de primauté et de halo, et noter chaque critère séparément",2,"La première impression colore tout le reste (halo). On neutralise le biais en notant critère par critère."],["Se fier à la première impression : elle est généralement juste et les recruteurs expérimentés la confirment souvent",0,"Les premières impressions sont fortement biaisées, notamment par l’apparence et l’aisance verbale."],["Mettre fin à l’entretien dès que l’impression est bonne",0,"Vous renoncez à vérifier les compétences clés et vous prenez un risque inutile."]],"w":"Effet de halo : un trait positif (aisance, apparence) influence toute l’évaluation. On note critère par critère."},{"t":"BIAIS DE SÉLECTION","who":"NovaSoft · recrutement","x":"Deux candidats sont proches. L’un est une femme de 38 ans qui revient d’un congé parental, l’autre un homme de 29 ans. Un manager dit que le second est « plus fiable ».","o":[["Choisir l’homme : moins de risque d’absence, et l’équipe a besoin de fiabilité sur ce projet critique de l’année",0,"Raisonnement discriminatoire et illégal."],["Tirer au sort entre les deux",1,"Ce n’est pas discriminatoire, mais vous renoncez à choisir sur la valeur professionnelle."],["Recentrer sur les compétences et critères du poste ; le congé parental n’est pas un critère",2,"Écarter une candidate parce qu’elle a pris un congé parental est une discrimination (famille, sexe, grossesse/maternité)."]],"w":"On ne départage pas des candidats sur la base de leur situation familiale, de leur sexe ou de leurs congés."},{"t":"BIAIS DE SÉLECTION","who":"NovaSoft · direction","x":"L’entreprise emploie 3 personnes en situation de handicap sur 85. Un manager dit : « Ça complique l’organisation, on n’en prend pas d’autres. »","o":[["Dire que le handicap est un critère valable d’écartement quand l’organisation est compliquée",0,"Le handicap est un motif de discrimination interdit. L’employeur doit étudier les aménagements raisonnables."],["Rappeler l’obligation d’emploi de 6 % de travailleurs handicapés pour les entreprises d’au moins 20 salariés, et étudier les aménagements possibles et les aides existantes",2,"L’obligation d’emploi concerne les entreprises de 20 salariés et plus (6 %). Des aides financent les aménagements de poste. Écarter un candidat à cause du handicap est discriminatoire."],["Payer la contribution financière prévue plutôt que d’embaucher",1,"Possible légalement, mais ce n’est pas une réponse à la question de la discrimination ni à l’obligation d’inclure."]],"w":"Au-delà de 20 salariés, l’obligation d’emploi est de 6 % de travailleurs handicapés. L’employeur étudie les aménagements raisonnables avant tout refus."},{"t":"PROMESSE ET EMBAUCHE","who":"NovaSoft · embauche","x":"Vous avez envoyé un courriel à un candidat : « Nous sommes heureux de vous confirmer votre embauche au poste d’ingénieur, à 48 000 € brut, début le 1er mars. » Une semaine après, un budget gelé vous amène à vouloir annuler.","o":[["Reconnaître que ce courriel peut valoir promesse d’embauche, et consulter RH ou un juriste avant d’annuler",2,"Une promesse d’embauche précisant poste, rémunération et date d’entrée vaut contrat de travail : la rompre revient à un licenciement qui peut être sans cause réelle et sérieuse."],["Reporter la date de début sans en informer le candidat",0,"Vous trompez le candidat et vous aggravez le litige potentiel."],["Annuler par courriel : ce n’est qu’un courriel, le contrat n’étant pas encore signé par les deux parties, et le budget est gelé",0,"Un courriel précis vaut engagement. L’annulation peut coûter des dommages-intérêts."]],"w":"Une promesse d’embauche précise (poste, rémunération, date d’entrée) vaut contrat de travail. On distingue l’offre ouverte à discussion de la promesse ferme."},{"t":"PROMESSE ET EMBAUCHE","who":"NovaSoft · embauche","x":"Un cadre est embauché en CDI. Le contrat est signé mais ne mentionne pas de période d’essai. Le manager dit : « On verra bien : il y a toujours deux mois d’essai. »","o":[["Rajouter la période d’essai après coup par un simple courriel",1,"Impossible : la période d’essai doit être convenue au plus tard à l’embauche ; l’ajouter après coup reviendrait à modifier le contrat."],["Il y a automatiquement deux mois d’essai pour tout CDI",0,"Faux : sans clause, il n’y a pas de période d’essai. Et pour un cadre, la durée maximale est de 4 mois, renouvellement possible seulement si un accord de branche le permet."],["La période d’essai doit être expressément prévue dans le contrat ou la lettre d’engagement : sans mention, il n’y en a pas",2,"La période d’essai ne se présume pas (L1221-23). Elle doit être écrite et signée au plus tard au moment de l’embauche."]],"w":"Période d’essai : écrite dans le contrat. Durées maximales du CDI : 2 mois (ouvriers, employés), 3 mois (agents de maîtrise, techniciens), 4 mois (cadres), renouvelables une fois si l’accord de branche le prévoit."},{"t":"PROMESSE ET EMBAUCHE","who":"NovaSoft · embauche","x":"Un nouveau salarié arrive lundi. Le DRH s’aperçoit le vendredi précédent que la déclaration préalable à l’embauche n’a pas été faite.","o":[["Ne pas la faire : le salarié n’est qu’en période d’essai, et le contrat de travail suffit à prouver l’embauche",0,"Elle est obligatoire dès le premier jour de contrat, y compris en période d’essai."],["La faire immédiatement auprès de l’URSSAF : elle doit précéder l’embauche (jusqu’à 8 jours avant)",2,"La déclaration préalable à l’embauche (DPAE) est obligatoire avant la prise de poste. Son absence peut constituer du travail dissimulé."],["La faire dans le mois qui suit l’embauche",0,"Faux : elle doit précéder l’embauche. Un retard expose à des sanctions."]],"w":"La DPAE est faite avant l’embauche, au plus tôt 8 jours avant. Elle ne souffre pas d’exception, même en période d’essai."},{"t":"PROMESSE ET EMBAUCHE","who":"NovaSoft · stagiaire","x":"Vous accueillez un stagiaire de 5 mois. Un manager dit : « C’est un stagiaire, il n’a pas besoin d’être rémunéré, il apprend. »","o":[["Pas de gratification : un stage est un temps de formation, et le stagiaire n’est pas un salarié de l’entreprise",0,"Faux au-delà de deux mois. Le défaut de gratification est sanctionné."],["Une gratification seulement si le stagiaire fait un travail utile",1,"Ce critère n’existe pas : la durée seule déclenche l’obligation."],["Gratification obligatoire au-delà de deux mois de stage, avec convention signée",2,"Au-delà de deux mois consécutifs (ou 44 jours de présence), la gratification est obligatoire. La convention de stage est exigée."]],"w":"Stage de plus de deux mois : gratification obligatoire et convention de stage. Un stagiaire n’est pas un salarié bon marché."},{"t":"RÉUSSIR L’ARRIVÉE","who":"NovaSoft · direction","x":"Un développeur recruté il y a trois mois vient de démissionner : il dit n’avoir « jamais compris ce qu’on attendait de lui ». Le coût d’un départ est estimé à 50 % du salaire annuel (42 000 € chez NovaSoft).","o":[["Analyser l’intégration et le suivi des trois premiers mois, puis corriger le parcours : objectifs clairs, parrain, points réguliers",2,"Le coût d’un départ (ici 21 000 €) justifie d’investir dans l’accueil. La cause est souvent l’absence d’attentes claires."],["Lancer un nouveau recrutement plus rapide pour combler le poste",1,"Combler vite masque la cause. Vous perdrez le suivant pour la même raison."],["Conclure qu’il n’était pas le bon candidat et recruter quelqu’un d’autre",0,"Vous répétez le scénario : mêmes méthodes, même résultat."]],"w":"Un départ précoce coûte cher (ici 21 000 €) : on analyse l’intégration, on clarifie les attentes et on suit le nouvel arrivant."},{"t":"RÉUSSIR L’ARRIVÉE","who":"NovaSoft · RH","x":"Vous voulez mesurer la réussite de vos recrutements. Un collègue propose de ne regarder que le nombre de postes pourvus et la durée de recrutement.","o":[["Ajouter des indicateurs de qualité : satisfaction du manager, rétention à 12 mois, diversité, coût",2,"Pourvoir vite n’est pas pourvoir bien. Les indicateurs de qualité et de rétention mesurent la valeur réelle d’un recrutement."],["Ne mesurer que la rapidité : le reste est subjectif et difficile à comparer d’un poste à l’autre, donc peu utile au pilotage",0,"La rapidité sans qualité incite à recruter n’importe qui."],["Mesurer seulement le coût par recrutement",1,"Le coût est utile mais ne dit rien de la qualité ni de la rétention."]],"w":"Mesurer un recrutement : délai, coût, qualité à 6 mois, rétention à 12 mois, diversité. Un seul indicateur oriente les mauvaises décisions."},{"t":"RÉUSSIR L’ARRIVÉE","who":"NovaSoft · direction","x":"Un manager veut baisser le salaire de départ d’une candidate à son premier poste « parce qu’elle débute », alors qu’un collègue embauché l’an dernier au même poste a été payé 3 000 € de plus.","o":[["Maintenir l’offre basse : elle négociera si elle veut plus, et le collègue avait peut-être des atouts particuliers",0,"« Peut-être des atouts » n’est pas un critère : sans justification objective, vous reproduisez des écarts de rémunération connus pour pénaliser certains profils."],["Aligner l’offre sur une grille de rémunération objective pour éviter les écarts injustifiés",2,"Un écart non justifié entre collaborateurs de même niveau crée un risque d’iniquité et, selon les cas, de discrimination. Une grille limite l’arbitraire."],["Proposer le même salaire que le collègue mais sans prime",1,"Le salaire s’aligne, mais vous créez une autre différence (la prime) sans critère."]],"w":"À poste et expérience comparables, la rémunération d’embauche suit une grille. L’égalité de rémunération est une obligation légale."},{"t":"RÉUSSIR L’ARRIVÉE","who":"NovaSoft · direction","x":"Un manager vous demande un conseil : « Je ne retiens que ceux qui acceptent de travailler le week-end quand on le demande. Est-ce légal ? »","o":[["Oui : c’est le choix de l’employeur",0,"Le choix des candidats est libre dans la limite des règles ; mais on ne peut pas imposer des contraintes contraires au droit du travail."],["Oui, si le candidat signe une décharge",0,"Une décharge ne peut pas supprimer des droits impératifs."],["Non : les conditions d’emploi (horaires, astreintes, week-end) doivent être dans le contrat et soumises à des règles légales et conventionnelles ; on ne peut pas exiger une disponibilité illimitée",2,"Les horaires et astreintes sont encadrés (durées maximales, repos, majorations, convention collective). Une disponibilité sans limite n’est pas exigible."]],"w":"Les conditions de travail annoncées doivent respecter le droit : durée du travail, repos, astreintes. Une « disponibilité totale » n’est pas une condition légitime."}]},"rh":{"cards":[{"t":"TEMPS DE TRAVAIL","who":"NovaSoft · équipe DevOps","x":"Pour une mise en production, Rayan travaille jeudi de 8 h à 20 h 30, avec 1 h de pause : 11 h 30 de travail effectif. Son manager dit que c’est « normal les jours de mise en prod » et ne prévoit rien.","o":[["Laisser faire car Rayan est volontaire",0,"Les durées maximales sont d’ordre public : l’accord du salarié ne permet pas d’y déroger."],["Rappeler que la durée quotidienne maximale est de 10 h, sauf dérogation ; revoir l’organisation de la mise en production",2,"La durée maximale du travail effectif est de 10 h par jour (L3121-18). Elle peut être portée à 12 h seulement par accord d’entreprise ou de branche, ou avec autorisation de l’inspection du travail en cas d’activité accrue ou d’urgence. Sans cela, l’employeur est en infraction."],["Laisser faire : une mise en production est une urgence qui justifie tout, d’autant que Rayan récupérera ces heures plus tard",0,"Aucune urgence ordinaire ne suspend les durées maximales ; elles protègent la santé des salariés."]],"w":"Durées maximales : 10 h par jour (12 h par dérogation), 48 h par semaine, 44 h en moyenne sur 12 semaines. Les dérogations sont encadrées par accord ou autorisation."},{"t":"TEMPS DE TRAVAIL","who":"NovaSoft · équipe Data","x":"Sam termine une intervention urgente jeudi à 23 h. Le vendredi, une réunion client est prévue à 8 h et son manager voudrait qu’il y soit.","o":[["Ne pas exiger sa présence à 8 h : 11 heures consécutives de repos, donc reprise à 10 h au plus tôt, sauf dérogation",2,"Le repos quotidien minimal est de 11 heures consécutives (L3131-1). De 23 h à 8 h, il n’a que 9 h de repos. Des dérogations existent mais elles sont encadrées."],["Exiger sa présence : l’urgence client prime, et la réunion de 8 h conditionne le renouvellement du contrat annuel avec ce client",0,"Le repos quotidien est une règle de santé publique ; le client ne justifie pas de l’ignorer."],["Lui demander de choisir librement",1,"La liberté de choix ne suffit pas : on ne peut pas renoncer au repos minimal."]],"w":"Repos quotidien : 11 heures consécutives minimum. Repos hebdomadaire : 24 h consécutives, auxquelles s’ajoutent les 11 h quotidiennes."},{"t":"TEMPS DE TRAVAIL","who":"NovaSoft · équipe Support","x":"Nina travaille 41 heures cette semaine. Son salaire horaire brut est de 15 €. Les heures supplémentaires sont rémunérées au taux légal, sans accord particulier.","o":[["6 heures payées au taux normal : 6 × 15 € = 90 €",0,"Les heures supplémentaires sont majorées par la loi, au minimum de 10 % par accord et de 25 % à défaut."],["5 heures supplémentaires payées à 125 % : 5 × 15 € × 1,25 = 93,75 € brut",0,"Erreur de comptage : les heures supplémentaires commencent à la 36e heure, donc 41 − 35 = 6 et non 5."],["6 heures supplémentaires (41 − 35), payées à 125 % : 6 × 15 € × 1,25 = 112,50 € brut en plus",2,"Les heures de la 36e à la 43e heure sont majorées de 25 %. Ici, 41 − 35 = 6 heures supplémentaires, soit 6 × 15 × 1,25 = 112,50 €."]],"w":"Heures supplémentaires : à partir de la 36e heure ; majoration de 25 % jusqu’à la 43e, 50 % au-delà. Un accord peut fixer une majoration plus faible (10 % minimum)."},{"t":"TEMPS DE TRAVAIL","who":"PME de services","x":"Une collaboratrice enchaîne six heures de travail sans interruption pour finir un dossier. Son manager dit que la pause est facultative « si elle préfère continuer ».","o":[["Pause d’au moins 20 minutes obligatoire dès 6 heures de travail consécutives",2,"C’est la règle légale (L3121-16). Elle protège la santé : le salarié ne peut pas y renoncer."],["La pause est facultative si le salarié est d’accord et préfère terminer son dossier avant l’heure du déjeuner",0,"Le droit à la pause est d’ordre public : on ne peut pas y renoncer."],["La pause est de 45 minutes obligatoires",0,"La loi fixe un minimum de 20 minutes, une convention peut prévoir plus."]],"w":"Pause légale minimale : 20 minutes dès 6 heures de travail consécutives. Les accords peuvent prévoir mieux."},{"t":"TEMPS DE TRAVAIL","who":"NovaSoft · équipe Data","x":"Sam est d’astreinte ce week-end. Il est appelé samedi à 14 h pour une intervention de 40 minutes depuis chez lui. Il demande si c’est du temps de travail.","o":[["Non : une astreinte n’est jamais du travail, l’intervention à domicile étant couverte par la compensation d’astreinte",0,"L’intervention pendant l’astreinte est du travail effectif et se paie."],["Oui pour tout le week-end",0,"La période d’astreinte n’est pas du temps de travail effectif, mais doit donner lieu à une contrepartie."],["Oui pour les 40 minutes d’intervention ; l’astreinte est compensée à part (financièrement ou en repos)",2,"L’intervention est du temps de travail effectif. La période d’astreinte, où le salarié reste disponible sans travailler, est compensée à part."]],"w":"Astreinte : disponibilité à distance. L’astreinte donne lieu à compensation ; les interventions sont du temps de travail effectif."},{"t":"CONGÉS ET ABSENCES","who":"NovaSoft · squad Gamma","x":"Léa veut prendre 5 semaines de congés d’affilée en été. Elle a acquis les droits nécessaires. Vous craignez l’absence.","o":[["Refuser tout congé d’été en raison de la charge de travail",0,"L’employeur fixe l’ordre des départs mais ne peut pas empêcher de prendre le congé principal sans raison."],["Le congé principal ne peut pas dépasser 24 jours ouvrables consécutifs, soit 4 semaines, sauf cas particuliers : proposer 4 semaines puis un report",2,"Le congé payé est de 5 semaines par an (30 jours ouvrables) ; le congé principal est de 12 à 24 jours ouvrables consécutifs ; le reste se prend à part."],["Accepter les 5 semaines d’affilée : elle a ses droits",1,"Seule une dérogation (ancienneté, enfants à charge, contraintes particulières) permet de dépasser 24 jours consécutifs."]],"w":"Congés payés : 2,5 jours ouvrables par mois travaillé, soit 30 jours par an. Le congé principal dure 12 à 24 jours ouvrables consécutifs."},{"t":"CONGÉS ET ABSENCES","who":"Entreprise de services","x":"Le 10 juin, vous annoncez à un salarié que ses congés prévus du 1er au 15 juillet sont annulés à cause d’un gros projet. Il dit qu’il a déjà payé son voyage.","o":[["Impossible en principe : dates non modifiables moins d’un mois avant le départ, sauf circonstances exceptionnelles",2,"Le délai de prévenance d’un mois protège les salariés (L3141-16). Une urgence ordinaire n’est pas une circonstance exceptionnelle."],["C’est possible si le salarié est remboursé de ses frais",1,"Le remboursement n’autorise pas la modification : il faut l’accord du salarié ou des circonstances exceptionnelles."],["C’est possible : l’employeur a le dernier mot sur le calendrier des congés quand un gros projet menace l’activité de l’entreprise",0,"L’employeur fixe l’ordre des départs, mais ne peut pas modifier les dates moins d’un mois avant le départ sans circonstances exceptionnelles."]],"w":"L’ordre et les dates des départs sont communiqués un mois avant au plus tard. Après, l’employeur ne peut plus les modifier sauf circonstances exceptionnelles."},{"t":"CONGÉS ET ABSENCES","who":"NovaSoft · direction","x":"Un salarié revient d’un arrêt maladie de 4 mois. On lui dit : « Pendant ton arrêt, tu n’as acquis aucun congé payé. »","o":[["C’est exact : le contrat étant suspendu pendant l’arrêt maladie, aucun congé payé ne s’acquiert, sauf en cas d’accident du travail ou de maladie professionnelle",0,"C’était l’ancienne règle, contraire au droit européen. Elle a été corrigée."],["C’est inexact : depuis la loi du 22 avril 2024, l’arrêt maladie ouvre des droits à congés (2 jours ouvrables par mois si non professionnel)",2,"La loi de 2024 a aligné le droit français sur le droit européen. L’acquisition est de 2 jours ouvrables par mois en maladie non professionnelle (24 par an), et de 2,5 en maladie professionnelle ou accident du travail."],["Il acquiert 2,5 jours par mois, comme s’il travaillait",1,"Ce taux s’applique à la maladie professionnelle et à l’accident du travail. En maladie ordinaire, c’est 2 jours."]],"w":"Arrêt maladie et congés payés : depuis 2024, acquisition de 2 jours ouvrables par mois en maladie non professionnelle ; 2,5 en cas d’accident du travail ou de maladie professionnelle (point à vérifier lors de votre lecture)."},{"t":"CONGÉS ET ABSENCES","who":"NovaSoft · équipe Support","x":"Omar ne se présente plus au travail depuis trois semaines, sans nouvelles. Vous envisagez de le considérer comme démissionnaire.","o":[["Le considérer démissionnaire sans autre formalité : trois semaines d’absence injustifiée caractérisent à elles seules l’abandon de poste",0,"La démission doit être claire et non équivoque : on ne la présume qu’au terme d’une procédure."],["Le licencier le jour même pour faute grave sans autre formalité",1,"L’abandon de poste peut justifier une sanction, mais la procédure disciplinaire s’impose : convocation, entretien, notification."],["Lui adresser une mise en demeure de justifier son absence et de reprendre sous 15 jours minimum ; à défaut, présomption de démission",2,"Depuis 2022, la présomption de démission en cas d’abandon de poste suppose une mise en demeure et un délai minimal de 15 jours. L’employeur ne peut pas la déclarer lui-même sans cette procédure."]],"w":"Abandon de poste : mise en demeure écrite, délai d’au moins 15 jours, puis présomption de démission possible. Sinon, la voie disciplinaire avec sa procédure."},{"t":"SANCTION","who":"NovaSoft · squad Beta","x":"Rayan a insulté un collègue le 3 juin. Vous l’apprenez le 5 juin et décidez de le sanctionner. Vous n’avez rien fait jusqu’au 10 août.","o":[["Trop tard : les faits fautifs se prescrivent par 2 mois à compter de la connaissance par l’employeur",2,"L’employeur doit engager les poursuites disciplinaires dans les deux mois de la connaissance des faits (L1332-4). Ici, le délai a expiré début août."],["Pas de limite : une sanction est possible à tout moment tant que le salarié est présent dans l’entreprise et que la faute n’a pas été pardonnée par écrit",0,"Faux : la prescription disciplinaire est de 2 mois."],["Le délai est de 1 an",0,"Faux : c’est 2 mois, sauf si des poursuites pénales ont été engagées dans ce délai."]],"w":"Prescription disciplinaire : 2 mois à compter de la connaissance des faits par l’employeur (sauf poursuites pénales dans ce délai)."},{"t":"SANCTION","who":"PME industrielle","x":"Un salarié arrive régulièrement en retard. Le chef d’atelier décide de lui retenir une journée de salaire à titre de sanction pour « marquer le coup ».","o":[["Autorisé si le règlement intérieur le prévoit",0,"Faux : même le règlement intérieur ne peut pas prévoir d’amende."],["Autorisé : l’employeur est libre de choisir la sanction dès lors qu’elle est proportionnée à la gravité et à la répétition des retards constatés",0,"Faux : les amendes et sanctions pécuniaires sont interdites."],["Interdit : les amendes sont prohibées ; sanctionner autrement (avertissement, mise à pied) et ne retenir que le temps non travaillé",2,"L’employeur ne peut pas infliger d’amende (L1331-2). Il peut retenir le salaire du temps réellement non travaillé, ce qui n’est pas une sanction."]],"w":"Pas de sanction pécuniaire. On peut retenir le salaire du temps non travaillé (retard), mais pas une somme supplémentaire à titre de punition."},{"t":"SANCTION","who":"NovaSoft · équipe Data","x":"Sam a déjà reçu un avertissement pour un retard de livraison. Pour les mêmes faits, son manager décide de lui infliger en plus une mise à pied de trois jours.","o":[["Possible : plus la faute est grave, plus on peut cumuler",0,"Faux : une même faute ne peut pas être sanctionnée deux fois."],["Impossible : on ne peut pas sanctionner deux fois les mêmes faits",2,"Règle « non bis in idem » : un même fait ne peut donner lieu à deux sanctions. L’avertissement a épuisé le pouvoir disciplinaire pour ce fait."],["Possible si Sam est d’accord",1,"Même avec l’accord du salarié, la double sanction est irrégulière."]],"w":"Un même fait ne peut être sanctionné qu’une seule fois. On choisit la sanction avant de la notifier."},{"t":"SANCTION","who":"NovaSoft · direction","x":"Un manager veut sanctionner un salarié par une mise à pied de cinq jours. Il lui envoie un courriel simple : « Tu es mis à pied du lundi au vendredi. »","o":[["Respecter la procédure : convocation, entretien préalable, puis notification écrite motivée",2,"Pour une sanction qui a un effet sur la présence, la fonction, la carrière ou le salaire, l’entretien préalable est obligatoire. La notification se fait par écrit, entre 2 jours ouvrables et 1 mois après l’entretien."],["Un simple courriel suffit",0,"Non : la procédure est obligatoire, sinon la sanction est irrégulière."],["Une notification orale devant témoin suffit, à condition qu’elle soit confirmée le jour même par un courriel",0,"Non : la notification est écrite et motivée, et ne peut intervenir que 2 jours ouvrables au moins après l’entretien : ni oralement, ni le jour même."]],"w":"Sanction autre qu’un avertissement : convocation, entretien préalable, notification écrite entre 2 jours ouvrables et 1 mois après l’entretien. L’assistance du salarié est possible."},{"t":"LICENCIEMENT","who":"NovaSoft · direction","x":"Vous convoquez un salarié à un entretien préalable à un éventuel licenciement. La lettre de convocation est remise en main propre le lundi 3, pour un entretien fixé au mercredi 5.","o":[["C’est correct : l’entretien a lieu après la remise de la lettre, qui a été remise en main propre contre décharge",0,"Le délai minimal de 5 jours ouvrables n’est pas respecté."],["Il faut 15 jours calendaires",0,"Faux : c’est 5 jours ouvrables."],["Trop court : 5 jours ouvrables minimum entre la présentation de la lettre et l’entretien",2,"Le délai de 5 jours ouvrables laisse au salarié le temps de préparer sa défense (L1232-2)."]],"w":"Licenciement pour motif personnel : convocation, au moins 5 jours ouvrables avant l’entretien ; la lettre de licenciement part au plus tôt 2 jours ouvrables après l’entretien."},{"t":"LICENCIEMENT","who":"NovaSoft · direction","x":"Un salarié ayant 6 ans d’ancienneté et un salaire brut de référence de 3 000 € est licencié (hors faute grave). Quelle est l’indemnité légale minimale ?","o":[["6 × 1/3 × 3 000 € = 6 000 €",0,"Le 1/3 de mois ne s’applique qu’à partir de la 11e année."],["6 × 1/4 × 3 000 € = 4 500 €",2,"Moins de 10 ans d’ancienneté : 1/4 de mois par année. 6 ans × 0,25 × 3 000 = 4 500 €."],["3 000 € : un mois de salaire",0,"Ce n’est pas le calcul légal : il dépend de l’ancienneté."]],"w":"Indemnité légale de licenciement : 1/4 de mois par année jusqu’à 10 ans, puis 1/3 de mois par année au-delà. Condition : au moins 8 mois d’ancienneté ininterrompus. Faute grave : pas d’indemnité."},{"t":"LICENCIEMENT","who":"NovaSoft · direction","x":"Un salarié est en arrêt maladie depuis deux mois. Un manager dit : « Il est trop souvent malade, on le licencie. »","o":[["Impossible : licencier à cause de l’état de santé est discriminatoire, donc nul",2,"L’état de santé est un motif de discrimination interdit. Seules des situations précises (inaptitude constatée par le médecin du travail, perturbation grave et objectivée du service) peuvent entrer en ligne de compte, avec de fortes garanties."],["Possible : l’employeur peut rompre un contrat quand il veut, dès lors que les absences gênent l’équipe",0,"Le licenciement exige une cause réelle et sérieuse. La maladie en tant que telle n’en est pas une."],["Possible après trois mois d’arrêt",0,"Aucun délai magique n’autorise le licenciement pour maladie."]],"w":"Un licenciement fondé sur l’état de santé est discriminatoire, donc nul. L’inaptitude se constate par le médecin du travail."},{"t":"LICENCIEMENT","who":"NovaSoft · direction","x":"Une élue titulaire du CSE a commis une faute et vous envisagez de la licencier. Vous suivez la procédure normale de convocation et de notification.","o":[["Suffisant : la procédure normale s’applique à tous, la faute étant bien établie et l’entretien préalable respecté",0,"Faux : les élus sont protégés pendant leur mandat et six mois après."],["Il suffit d’informer le CSE",1,"Informer le CSE ne suffit pas : il donne un avis, mais ce n’est pas lui qui autorise, c’est l’inspection du travail."],["Insuffisant : licencier un salarié protégé exige l’autorisation préalable de l’inspection du travail",2,"Les représentants du personnel bénéficient d’une protection spéciale (L2411-1 et suivants). Sans autorisation, le licenciement est nul."]],"w":"Salarié protégé (élu du CSE, délégué syndical) : licenciement soumis à l’autorisation de l’inspection du travail. À défaut, il est nul."},{"t":"AUTRES RUPTURES","who":"NovaSoft · RH","x":"Un salarié et l’entreprise s’accordent sur une rupture conventionnelle. Ils signent la convention le 4 mars. Le salarié se demande quand elle prend effet.","o":[["Immédiatement après la signature du 4 mars, puisque les deux parties sont d’accord et ont toutes deux signé la convention",0,"Faux : le délai de rétractation et l’homologation s’imposent."],["Après 15 jours calendaires de rétractation, puis homologation par l’administration (15 jours ouvrables d’instruction)",2,"La convention n’est valable qu’après la rétractation (15 jours calendaires) et l’homologation par la DREETS. La date de rupture est fixée après."],["Seulement après un préavis de trois mois",0,"Faux : il n’y a pas de préavis dans une rupture conventionnelle ; la date est fixée d’un commun accord."]],"w":"Rupture conventionnelle : entretien(s), signature, rétractation 15 jours calendaires, homologation (15 jours ouvrables). L’indemnité est au moins égale à l’indemnité légale de licenciement."},{"t":"AUTRES RUPTURES","who":"NovaSoft · direction","x":"Le manager de Nina lui propose une rupture conventionnelle en lui disant que « sinon, ce sera le licenciement ». Elle hésite.","o":[["C’est légal si l’indemnité est généreuse",1,"Le montant ne remplace pas le consentement libre."],["C’est légal : l’employeur peut mettre la pression en rappelant l’alternative du licenciement, si elle est réelle",0,"La contrainte vicie le consentement."],["Elle ne peut pas être imposée : le consentement doit être libre, sans pression ni menace",2,"Le consentement doit être libre. Une pression ou une menace expose la rupture à l’annulation par les juges."]],"w":"La rupture conventionnelle est une rupture amiable, voulue par les deux parties. Aucune des parties ne peut l’imposer."},{"t":"AUTRES RUPTURES","who":"NovaSoft · nouveau salarié","x":"Un cadre embauché depuis 10 jours est en période d’essai. L’employeur décide de mettre fin au contrat. Il veut le prévenir le jour même.","o":[["Respecter un délai de prévenance de 48 heures (présence de 8 jours à 1 mois)",2,"Délai de prévenance de l’employeur : 24 heures si moins de 8 jours de présence, 48 heures de 8 jours à 1 mois, 2 semaines après 1 mois, 1 mois après 3 mois."],["Aucun délai : c’est la période d’essai",0,"Faux : le délai de prévenance existe, même en période d’essai."],["Un mois de préavis, comme pour un cadre",0,"Faux : le délai dépend de la durée de présence, pas de la catégorie."]],"w":"Rupture de la période d’essai par l’employeur : prévenance 24 h (moins de 8 jours), 48 h (8 jours à 1 mois), 2 semaines (1 à 3 mois), 1 mois (plus de 3 mois)."},{"t":"AUTRES RUPTURES","who":"NovaSoft · équipe Data","x":"Sam a un CDD de 6 mois. Au troisième mois, son manager veut mettre fin au contrat « parce que ça se passe moins bien que prévu ».","o":[["Possible : un employeur peut toujours rompre un contrat",0,"Faux pour le CDD, qui est protégé par des cas de rupture limités."],["Impossible : un CDD ne rompt avant terme que pour faute grave, force majeure, inaptitude, accord des parties ou CDI trouvé",2,"Le CDD est un contrat à durée déterminée : l’employeur ne peut pas l’arrêter par simple décision. Une rupture irrégulière donne droit à des dommages-intérêts."],["Possible avec un préavis de un mois, comme pour un CDI, dès lors que le manager en informe le salarié par écrit et que l’entreprise verse l’indemnité de fin de contrat",0,"Il n’y a pas de préavis dans le CDD."]],"w":"Le CDD ne peut être rompu avant terme que dans des cas limités (faute grave, force majeure, inaptitude, accord, CDI trouvé par le salarié). Indemnité de précarité de 10 % en fin de contrat, sauf exceptions."},{"t":"SANTÉ ET SÉCURITÉ","who":"NovaSoft · équipe Support","x":"Nina vous dit qu’elle est harcelée par un collègue depuis des mois. Vous répondez que vous n’aviez rien vu et que, sans preuve formelle, vous ne pouvez rien faire.","o":[["Attendre une plainte écrite officielle",0,"Une alerte orale suffit à déclencher l’obligation d’agir."],["Proposer à Nina de changer de service sans autre action, pour la protéger rapidement du collègue en cause, tout en évitant un conflit ouvert",1,"Protéger la salariée peut passer par un aménagement, mais lui proposer de partir sans traiter l’auteur lui fait porter les conséquences, et l’obligation d’enquêter demeure."],["Agir immédiatement : l’employeur doit enquêter dès qu’il est informé, sans attendre de preuve formelle",2,"L’employeur est tenu de prendre les mesures nécessaires pour protéger la santé des salariés (L4121-1) et de mener une enquête dès qu’il a connaissance de faits de harcèlement."]],"w":"Face à une alerte de harcèlement : enquête rapide et impartiale, mesures de protection, sanction de l’auteur si les faits sont établis. L’employeur engage sa responsabilité s’il ne fait rien."},{"t":"SANTÉ ET SÉCURITÉ","who":"PME industrielle · atelier","x":"Un opérateur refuse de travailler sur une machine dont le carter de sécurité est cassé, en invoquant son droit de retrait. Le chef d’atelier veut retenir son salaire et le sanctionner.","o":[["On peut sanctionner car il a désobéi",0,"Faux : exercer un droit de retrait légitime n’est pas une faute."],["Le retrait est légitime en cas de danger grave et imminent : ni retenue de salaire ni sanction ; réparer la machine",2,"Le salarié qui a un motif raisonnable de penser que la situation présente un danger grave et imminent peut se retirer (L4131-1). L’employeur doit corriger la situation."],["Le droit de retrait n’existe que sur autorisation du chef d’atelier ou du responsable sécurité, qui évalue seul la réalité du danger",0,"Faux : c’est un droit individuel qui ne dépend pas de l’autorisation."]],"w":"Droit de retrait : motif raisonnable de danger grave et imminent. Pas de sanction ni de retenue de salaire, et l’employeur doit remédier au danger."},{"t":"SANTÉ ET SÉCURITÉ","who":"NovaSoft · direction","x":"Un nouveau salarié est embauché en CDI. Le DRH dit que la visite médicale « se fera quand on aura le temps ».","o":[["Une visite d’information et de prévention a lieu dans les trois mois de la prise de poste",2,"La vis
