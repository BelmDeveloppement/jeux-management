<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jeux de management</title>
<meta name="description" content="Jeux de management sur plateau unique avec application téléphone : conflit, communication, motivation, équipe, recrutement, règles RH, CSE, carrière, engagement, QVT, RSE.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;600;700;800&display=swap">
<style>
:root{
  --bg:#FBF9F2; --surface:#FFFFFF; --soft:#F2EEE1; --ink:#1A2346; --muted:#5A6082; --line:#DDD8C6;
  --navy:#1F2A5C; --on-navy:#FFFFFF; --ocre:#8F6A08; --ok:#1E7A52; --warn:#B3481F; --bad:#B3261E;
  --f-title:'Baloo 2','Trebuchet MS',system-ui,sans-serif; --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11163A; --surface:#1A2150; --soft:#161C47; --ink:#EEF0FA; --muted:#A5ABCE; --line:#313A70;
  --navy:#E9B949; --on-navy:#1A2346; --ocre:#E9B949; --ok:#59C896; --warn:#FF9A73; --bad:#FF8A80; color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-title);line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:600px;margin:0 auto;padding-block:14px 30px;display:flex;flex-direction:column;gap:14px}
.wrap.wide{max-width:1080px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;min-width:0}
.brand b{font-family:var(--f-title);font-weight:800;font-size:19px;letter-spacing:.03em;min-width:0;overflow-wrap:anywhere}
.dots{display:flex;gap:5px}.dots i{width:11px;height:11px;border-radius:50%}
.pill{display:inline-block;font-family:var(--f-title);font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;padding:4px 14px;border-radius:99px;background:var(--navy);color:var(--on-navy)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.col{display:flex;flex-direction:column;gap:12px}
.soft{background:var(--soft);border-radius:12px;padding:12px 14px}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:12.5px}
.btn{font-family:var(--f-title);font-weight:700;font-size:18px;border:0;border-radius:12px;padding:13px 18px;cursor:pointer;background:var(--navy);color:var(--on-navy);min-height:48px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{font-size:15px;padding:8px 14px;min-height:40px}
.btn.block{width:100%}
:focus-visible{outline:3px solid #3B6FD8;outline-offset:2px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
input[type=text]{font:inherit;font-weight:700;font-size:18px;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:100%;min-height:48px}
label.f{display:flex;flex-direction:column;gap:5px;font-weight:700;font-size:14px;color:var(--muted)}
.sit{font-size:18px;line-height:1.5}
.who{font-weight:800;font-size:15px;color:var(--ocre)}
.opts{display:flex;flex-direction:column;gap:10px}
.op{display:flex;gap:12px;align-items:flex-start;text-align:left;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:12px 14px;font:inherit;font-weight:600;font-size:16.5px;cursor:pointer;min-height:56px;width:100%}
.op .lt{flex:none;width:34px;height:34px;border-radius:50%;background:var(--navy);color:var(--on-navy);display:grid;place-items:center;font-family:var(--f-title);font-weight:800;font-size:18px}
.op.sel{border-color:var(--ink);box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.op.dim{opacity:.6}
.op.good{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.op.mid{border-color:#C98A00;background:color-mix(in srgb,#E9A400 14%,var(--surface))}
.op.bad{border-color:var(--line)}
.op .why{display:block;font-weight:600;font-size:14.5px;color:var(--muted);margin-top:4px}
.op .tg2{display:inline-block;font-size:12px;font-weight:800;padding:1px 8px;border-radius:99px;margin-left:6px;vertical-align:middle;background:var(--line);color:var(--ink)}
.op.good .tg2{background:var(--ok);color:#fff}
.big{font-family:var(--f-title);font-weight:800;font-size:64px;line-height:1}
.code{font-family:var(--f-title);font-weight:800;font-size:64px;letter-spacing:.14em;line-height:1}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.pl{display:flex;flex-direction:column;gap:6px}
.pr{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--soft);min-width:0}
.pr .nm{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:700}
.sw{flex:none;width:16px;height:16px;border-radius:50%;border:2px solid rgba(0,0,0,.25)}
.tag{font-size:12px;font-weight:800;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--ink);white-space:nowrap}
.tag.on{background:var(--ok);color:#fff}
.chip{font-weight:800;font-size:13px;padding:3px 10px;border-radius:99px;white-space:nowrap;background:var(--line);color:var(--ink)}
.cover{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:max(16px,env(safe-area-inset-top,0px)) 16px 24px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tw{overflow-x:auto}
.note{border-left:4px solid var(--ocre);padding:4px 0 4px 12px}
.err{color:var(--warn);font-weight:700}
.hint{font-size:14px;color:var(--muted)}
.toggle{display:flex;align-items:center;gap:10px;font-weight:700;cursor:pointer}
.toggle input{width:22px;height:22px}
.gs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.gg{background:var(--soft);border-radius:12px;padding:8px 10px;min-width:0}
.gg .gn{font-weight:800;font-size:13px;display:flex;justify-content:space-between;gap:6px}
.bar{height:12px;border-radius:99px;background:var(--line);margin-top:6px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px;transition:width .4s}
.bar.low i{background:var(--bad)!important}
.fx{display:inline-block;font-weight:800;font-size:13px;padding:2px 9px;border-radius:99px;margin:2px 4px 2px 0;background:var(--line)}
.fx.p{background:color-mix(in srgb,var(--ok) 22%,var(--surface));color:var(--ok)}
.fx.m{background:color-mix(in srgb,var(--bad) 18%,var(--surface));color:var(--bad)}
.gl{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.gc{display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;color:var(--ink);font:inherit;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 14px 14px 18px;border-left-width:8px;min-width:0}
.gc .no{font-family:var(--f-title);font-weight:800;font-size:13px;letter-spacing:.14em;color:var(--muted)}
.gc h3{font-size:21px}
.gc .meta{display:flex;gap:6px;flex-wrap:wrap}
.role{border:2px dashed var(--ocre);border-radius:12px;padding:8px 12px;background:var(--soft)}
.tm{font-family:var(--f-title);font-weight:800;font-size:44px;text-align:center}
@media (prefers-reduced-motion:no-preference){.op{transition:transform .08s}.op:active{transform:scale(.98)}}
</style>

<script>
const DATA = {"games":[{"id":"cap","no":4,"titre":"CAP MANAGER","accroche":"Le bon style de management, au bon moment, pour la bonne personne.","moteur":"choix","public":"Master 1, Master 2, managers","duree":"1 h","color":"#E4572E","theme":"Leadership situationnel","ext":"https://belmdeveloppement.github.io/cap-manager/","obj":[],"regle":[],"apres":"","debrief":""},{"id":"conflit","no":20,"titre":"Cap sur le conflit","accroche":"Désamorcer, négocier, arbitrer : quel réflexe face à un conflit en équipe ?","moteur":"choix","public":"Master 1, Master 2, managers","duree":"1 h","color":"#D63A3A","theme":"Gestion des conflits","obj":["Reconnaître les cinq modes de gestion d’un conflit (modèle de Thomas et Kilmann)","Distinguer fait, interprétation et besoin avant de réagir","Choisir entre médiation, arbitrage et négociation","Poser un cadre sans humilier"],"regle":["Chaque joueur a un pion à sa couleur. Le joueur actif lance le dé et avance.","Sur une case « ? », la situation s’affiche sur tous les téléphones : chacun choisit sa réponse en secret.","Corrigé : le joueur actif avance de 3 pas avec le meilleur choix (1 pas si le choix est acceptable) ; les autres avancent d’1 pas s’ils ont trouvé le meilleur choix.","Imprévu : dé pair, +2 cases ; dé impair, −1 case. Pause café : on rejoue. Le premier pion qui atteint l’Arrivée termine la partie (en formation : 2 tours)."],"apres":"Quel conflit de votre équipe ou de votre stage traitez-vous par évitement depuis trop longtemps ? Quelle première phrase allez-vous dire, et à qui, cette semaine ?","debrief":"Questions : quel mode utilisez-vous par réflexe (fuir, céder, imposer, couper la poire en deux, résoudre) ? Quand l’évitement est-il le bon choix ? Quelle différence entre un désaccord de fond et un conflit de personnes ?"},{"id":"message","no":21,"titre":"Le bon message","accroche":"Dire les choses sans blesser et sans les édulcorer : feedback, écoute, refus, mauvaise nouvelle.","moteur":"choix","public":"Master 1, Master 2, managers","duree":"1 h","color":"#2F6FD8","theme":"Communication managériale","obj":["Formuler un message DESC (Décrire, Exprimer, Spécifier, Conclure)","Donner un feedback factuel, précis et utile","Pratiquer l’écoute active et la reformulation","Annoncer une décision difficile"],"regle":["Chaque joueur a un pion à sa couleur. Le joueur actif lance le dé et avance.","Sur une case « ? », la situation s’affiche sur tous les téléphones : chacun choisit sa réponse en secret.","Corrigé : le joueur actif avance de 3 pas avec le meilleur choix (1 pas si le choix est acceptable) ; les autres avancent d’1 pas s’ils ont trouvé le meilleur choix.","Imprévu : dé pair, +2 cases ; dé impair, −1 case. Pause café : on rejoue. Le premier pion qui atteint l’Arrivée termine la partie (en formation : 2 tours)."],"apres":"Quel message difficile reportez-vous ? Écrivez-le en quatre phrases DESC avant ce soir.","debrief":"Questions : quelle formulation vous a le plus surpris ? Quel est le coût d’un message flou ? Où passe la frontière entre franchise et agressivité ?"},{"id":"motivation","no":22,"titre":"Qui motive quoi ?","accroche":"Maslow, Herzberg, Vroom, Adams : quel levier pour quelle personne, et quel piège à éviter ?","moteur":"choix","public":"Master 1, Master 2, managers","duree":"1 h","color":"#F08A24","theme":"Motivation","obj":["Distinguer facteurs d’hygiène et de motivation (Herzberg)","Appliquer l’attente, l’instrumentalité et la valence (Vroom)","Repérer une perception d’injustice (Adams)","Choisir un levier adapté à la personne"],"regle":["Chaque joueur a un pion à sa couleur. Le joueur actif lance le dé et avance.","Sur une case « ? », la situation s’affiche sur tous les téléphones : chacun choisit sa réponse en secret.","Corrigé : le joueur actif avance de 3 pas avec le meilleur choix (1 pas si le choix est acceptable) ; les autres avancent d’1 pas s’ils ont trouvé le meilleur choix.","Imprévu : dé pair, +2 cases ; dé impair, −1 case. Pause café : on rejoue. Le premier pion qui atteint l’Arrivée termine la partie (en formation : 2 tours)."],"apres":"Choisissez un collaborateur ou un camarade : quel levier de motivation avez-vous supposé sans le lui demander ? Posez-lui la question cette semaine.","debrief":"Questions : une prime motive-t-elle durablement ? Quelle situation a montré qu’une même mesure produit des effets opposés selon les personnes ? Que faire quand la cause est l’injustice perçue ?"},{"id":"equipe","no":23,"titre":"L’équipe se construit","accroche":"Tuckman, Belbin, diversité, réunions : faire d’un groupe une équipe.","moteur":"choix","public":"Master 1, Master 2, managers","duree":"1 h","color":"#2E9E6B","theme":"Management d’équipe","obj":["Situer une équipe dans les phases de Tuckman","Identifier des rôles d’équipe (Belbin) et leurs excès","Animer une réunion utile","Intégrer un nouveau et gérer la diversité"],"regle":["Chaque joueur a un pion à sa couleur. Le joueur actif lance le dé et avance.","Sur une case « ? », la situation s’affiche sur tous les téléphones : chacun choisit sa réponse en secret.","Corrigé : le joueur actif avance de 3 pas avec le meilleur choix (1 pas si le choix est acceptable) ; les autres avancent d’1 pas s’ils ont trouvé le meilleur choix.","Imprévu : dé pair, +2 cases ; dé impair, −1 case. Pause café : on rejoue. Le premier pion qui atteint l’Arrivée termine la partie (en formation : 2 tours)."],"apres":"Dans quelle phase de Tuckman est votre groupe actuel ? Quelle action concrète le ferait passer à la suivante ?","debrief":"Questions : à quelle phase un conflit est-il sain ? Quel rôle manque dans votre équipe habituelle ? Que change l’arrivée d’un nouveau ?"},{"id":"recrutement","no":24,"titre":"Le bon recrutement","accroche":"De l’offre d’emploi à l’intégration : choisir sans discriminer, évaluer sans se tromper.","moteur":"choix","public":"Master 1, Master 2, managers, RH","duree":"1 h","color":"#8B4FC9","theme":"Recrutement","obj":["Rédiger une offre non discriminante et attractive","Mener un entretien structuré et légal","Éviter les biais de sélection","Réussir la période d’essai et l’intégration"],"regle":["Chaque joueur a un pion à sa couleur. Le joueur actif lance le dé et avance.","Sur une case « ? », la situation s’affiche sur tous les téléphones : chacun choisit sa réponse en secret.","Corrigé : le joueur actif avance de 3 pas avec le meilleur choix (1 pas si le choix est acceptable) ; les autres avancent d’1 pas s’ils ont trouvé le meilleur choix.","Imprévu : dé pair, +2 cases ; dé impair, −1 case. Pause café : on rejoue. Le premier pion qui atteint l’Arrivée termine la partie (en formation : 2 tours)."],"apres":"Reprenez la dernière offre d’emploi de votre organisation (ou une offre publique) : quelles formulations corrigeriez-vous, et pourquoi ?","debrief":"Questions : quel biais avez-vous reconnu chez vous ? Qu’est-ce qu’un critère de sélection défendable ? Que coûte une erreur de recrutement ?"},{"id":"rh","no":25,"titre":"RH : ça passe ou ça casse ?","accroche":"Temps de travail, congés, sanction, rupture : les règles RH qu’un manager doit connaître.","moteur":"choix","public":"Master 1, Master 2, managers","duree":"1 h","color":"#0E9AA7","theme":"Règles RH","obj":["Appliquer les règles de temps de travail et de repos","Respecter la procédure de sanction et de licenciement","Connaître les ruptures du contrat","Savoir quand consulter la RH ou un juriste"],"regle":["Chaque joueur a un pion à sa couleur. Le joueur actif lance le dé et avance.","Sur une case « ? », la situation s’affiche sur tous les téléphones : chacun choisit sa réponse en secret.","Corrigé : le joueur actif avance de 3 pas avec le meilleur choix (1 pas si le choix est acceptable) ; les autres avancent d’1 pas s’ils ont trouvé le meilleur choix.","Imprévu : dé pair, +2 cases ; dé impair, −1 case. Pause café : on rejoue. Le premier pion qui atteint l’Arrivée termine la partie (en formation : 2 tours)."],"apres":"Quelle règle RH ignoriez-vous avant ce jeu ? Notez-la et vérifiez-la dans votre convention collective.","debrief":"Questions : quelle erreur coûte le plus cher à l’entreprise ? Qui doit décider d’une sanction ? Pourquoi la forme compte-t-elle autant que le fond ?"},{"id":"cse","no":26,"titre":"Dialogue au CSE","accroche":"Consulter, informer, négocier : la bonne relation entre direction et représentants du personnel.","moteur":"choix","public":"Master 1, Master 2, managers, RH","duree":"1 h","color":"#C2410C","theme":"Dialogue social","obj":["Connaître le rôle et les moyens du CSE","Distinguer information, consultation et négociation","Éviter le délit d’entrave","Préparer une consultation"],"regle":["Chaque joueur a un pion à sa couleur. Le joueur actif lance le dé et avance.","Sur une case « ? », la situation s’affiche sur tous les téléphones : chacun choisit sa réponse en secret.","Corrigé : le joueur actif avance de 3 pas avec le meilleur choix (1 pas si le choix est acceptable) ; les autres avancent d’1 pas s’ils ont trouvé le meilleur choix.","Imprévu : dé pair, +2 cases ; dé impair, −1 case. Pause café : on rejoue. Le premier pion qui atteint l’Arrivée termine la partie (en formation : 2 tours)."],"apres":"Dans votre organisation, qui siège au CSE et sur quels sujets a-t-il été consulté cette année ? Interrogez un élu ou la RH.","debrief":"Questions : qu’est-ce qu’une consultation « utile » ? Où est la frontière avec l’entrave ? Que gagne une direction à jouer le jeu ?"},{"id":"carriere","no":27,"titre":"Cap carrière","accroche":"Entretien professionnel, formation, mobilité : accompagner un parcours.","moteur":"choix","public":"Master 1, Master 2, managers, RH","duree":"1 h","color":"#4F46E5","theme":"Plan de carrière","obj":["Conduire un entretien professionnel","Mobiliser CPF, VAE, bilan de compétences et mobilité","Relier compétences, besoins et parcours (GEPP)","Accompagner les seniors et les parcours atypiques"],"regle":["Chaque joueur a un pion à sa couleur. Le joueur actif lance le dé et avance.","Sur une case « ? », la situation s’affiche sur tous les téléphones : chacun choisit sa réponse en secret.","Corrigé : le joueur actif avance de 3 pas avec le meilleur choix (1 pas si le choix est acceptable) ; les autres avancent d’1 pas s’ils ont trouvé le meilleur choix.","Imprévu : dé pair, +2 cases ; dé impair, −1 case. Pause café : on rejoue. Le premier pion qui atteint l’Arrivée termine la partie (en formation : 2 tours)."],"apres":"Quel est votre prochain pas de carrière à 12 mois ? Quelle compétence, quelle formation, quel interlocuteur ?","debrief":"Questions : qui est responsable d’une carrière ? Quelle différence entre entretien professionnel et entretien annuel ? Que perd-on quand on ne propose aucune mobilité ?"},{"id":"semaine","no":28,"titre":"La semaine du manager","accroche":"Urgent, important, délégation : tenir la semaine sans sacrifier l’équipe.","moteur":"comite","public":"Master 1, Master 2, managers","duree":"1 h","color":"#2563EB","theme":"Organisation et délégation","obj":["Prioriser avec la matrice d’Eisenhower","Déléguer sans abandonner","Arbitrer entre résultat, équipe et soi","Dire non"],"regle":["Une seule équipe, un seul pion : à tour de rôle, un joueur lance le dé et avance le pion de l’équipe. Chacun a un rôle secret avec une priorité et une mission.","Sur une case « ? », un événement arrive sur les téléphones : chacun vote en secret, puis les votes sont révélés.","90 secondes de débat, une seule décision : les 4 jauges bougent. Si une jauge tombe à zéro, toute l’équipe perd.","Points personnels : +1 si votre priorité progresse, +1 si votre vote est retenu, +3 si votre mission est remplie à la fin. Fin de partie : le pion atteint l’Arrivée (un tour de plateau)."],"apres":"Quelle tâche gardez-vous alors qu’elle pourrait être déléguée ? À qui, et avec quel cadre, dès lundi ?","debrief":"Questions : quelle option vous a coûté le plus à votre rôle ? Que se passe-t-il quand on sacrifie la jauge Soi ? Qu’avez-vous délégué trop tard ?"},{"id":"engagement","no":29,"titre":"Engagement NovaSoft","accroche":"eNPS à −5, turn-over à 22 % : remobilisez l’entreprise avec un budget limité.","moteur":"comite","public":"Master 1, Master 2, managers, RH","duree":"1 h","color":"#16A34A","theme":"Engagement","obj":["Lire un baromètre d’engagement (eNPS, turn-over, absentéisme)","Relier causes et leviers d’engagement","Arbitrer avec un budget","Mesurer l’effet d’une action"],"regle":["Une seule équipe, un seul pion : à tour de rôle, un joueur lance le dé et avance le pion de l’équipe. Chacun a un rôle secret avec une priorité et une mission.","Sur une case « ? », un événement arrive sur les téléphones : chacun vote en secret, puis les votes sont révélés.","90 secondes de débat, une seule décision : les 4 jauges bougent. Si une jauge tombe à zéro, toute l’équipe perd.","Points personnels : +1 si votre priorité progresse, +1 si votre vote est retenu, +3 si votre mission est remplie à la fin. Fin de partie : le pion atteint l’Arrivée (un tour de plateau)."],"apres":"Si vous deviez mesurer l’engagement de votre équipe en trois questions, lesquelles poseriez-vous, et que feriez-vous du résultat ?","debrief":"Questions : quelle action a payé tout de suite et laquelle à six mois ? Qu’est-ce qui s’est dégradé quand on a économisé ? Qui parle pour les absents du comité ?"},{"id":"qvt","no":30,"titre":"Le bon climat (QVT)","accroche":"Charge, autonomie, reconnaissance, relations : redonnez de l’air à une équipe sous tension.","moteur":"comite","public":"Master 1, Master 2, managers, RH","duree":"1 h","color":"#0891B2","theme":"Qualité de vie et conditions de travail","obj":["Identifier les facteurs de risques psychosociaux","Agir sur l’organisation plutôt que sur les individus","Concilier performance et santé","Prévenir le harcèlement et l’épuisement"],"regle":["Une seule équipe, un seul pion : à tour de rôle, un joueur lance le dé et avance le pion de l’équipe. Chacun a un rôle secret avec une priorité et une mission.","Sur une case « ? », un événement arrive sur les téléphones : chacun vote en secret, puis les votes sont révélés.","90 secondes de débat, une seule décision : les 4 jauges bougent. Si une jauge tombe à zéro, toute l’équipe perd.","Points personnels : +1 si votre priorité progresse, +1 si votre vote est retenu, +3 si votre mission est remplie à la fin. Fin de partie : le pion atteint l’Arrivée (un tour de plateau)."],"apres":"Quel facteur de tension (charge, autonomie, reconnaissance, relations, sens) pèse le plus sur votre équipe ? Quelle action gratuite pourriez-vous lancer ?","debrief":"Questions : un baby-foot résout-il un problème de charge ? Quelles décisions ont amélioré une jauge au détriment d’une autre ? Qui est responsable de la santé au travail ?"},{"id":"rse","no":31,"titre":"RSE : cap climat","accroche":"Réduire l’empreinte carbone, tenir le social et la performance : le jeu des causes et des effets.","moteur":"comite","public":"Master 1, Master 2, managers","duree":"1 h","color":"#15803D","theme":"RSE et climat","obj":["Comprendre les trois piliers de la RSE et leurs arbitrages","Raisonner en chaînes de causes et d’effets (esprit des ateliers de type fresque)","Distinguer les émissions directes et indirectes (scopes 1, 2 et 3)","Éviter l’écoblanchiment"],"regle":["Une seule équipe, un seul pion : à tour de rôle, un joueur lance le dé et avance le pion de l’équipe. Chacun a un rôle secret avec une priorité et une mission.","Sur une case « ? », un événement arrive sur les téléphones : chacun vote en secret, puis les votes sont révélés.","90 secondes de débat, une seule décision : les 4 jauges bougent. Si une jauge tombe à zéro, toute l’équipe perd.","Points personnels : +1 si votre priorité progresse, +1 si votre vote est retenu, +3 si votre mission est remplie à la fin. Fin de partie : le pion atteint l’Arrivée (un tour de plateau)."],"apres":"Quelle est la principale source d’émissions de votre organisation ou de votre mode de vie ? Quelle action vous semble la plus efficace et la moins coûteuse ?","debrief":"Questions : quel effet indirect avez-vous sous-estimé ? Quelle décision a déplacé le problème plutôt que de le résoudre ? Comment prouver qu’une action est réelle ?"},{"id":"crise","no":32,"titre":"Crise chez NovaSoft","accroche":"Panne, client furieux, rumeurs, épuisement : tenir tous les fronts à la fois.","moteur":"comite","public":"Master 2, managers","duree":"1 h","color":"#7C2D12","theme":"Synthèse management des hommes","obj":["Mobiliser ensemble motivation, communication, conflit, équipe et règles RH","Décider sous pression et à plusieurs","Arbitrer entre court terme et long terme","Assumer les conséquences d’une décision"],"regle":["Une seule équipe, un seul pion : à tour de rôle, un joueur lance le dé et avance le pion de l’équipe. Chacun a un rôle secret avec une priorité et une mission.","Sur une case « ? », un événement arrive sur les téléphones : chacun vote en secret, puis les votes sont révélés.","90 secondes de débat, une seule décision : les 4 jauges bougent. Si une jauge tombe à zéro, toute l’équipe perd.","Points personnels : +1 si votre priorité progresse, +1 si votre vote est retenu, +3 si votre mission est remplie à la fin. Fin de partie : le pion atteint l’Arrivée (un tour de plateau)."],"apres":"Quelle crise vous attend dans les trois prochains mois ? Qui sera dans votre cellule de crise, et qui décidera ?","debrief":"Questions : à quel moment avez-vous cessé de consulter l’équipe ? Quelle décision aviez-vous prise trop vite ? Qu’auriez-vous préparé avant la crise ?"}],"content":{"conflit":{"cards":[{"t":"DIAGNOSTIC","who":"NovaSoft · squad Alpha","x":"Karim et Léa ne se parlent plus depuis la revue de code. Karim dit : « Léa est arrogante. » Léa dit : « Karim bloque tout exprès. » Vous êtes leur manager.","o":[["Organiser tout de suite une réunion à trois pour qu’ils s’expliquent, avant que le climat ne se dégrade encore",1,"Réunir est utile, mais trop tôt : sans préparation, chacun défend sa version et le face-à-face peut aggraver les choses."],["Leur demander séparément de décrire les faits, sans qualificatif",2,"On sépare faits, interprétations et émotions. « Arrogante » et « exprès » sont des jugements, pas des faits : on ne peut rien en faire tant qu’on ne les a pas décomposés."],["Leur dire qu’ils sont adultes et doivent régler ça entre eux : vous avez déjà trois projets en retard à gérer",0,"L’évitement par le manager laisse le conflit s’installer. Il envoie aussi le message que le sujet n’est pas important."]],"w":"Avant de traiter un conflit, on décompose : faits observables, interprétations, émotions, besoins. Seuls les faits et les besoins permettent de négocier."},{"t":"DIAGNOSTIC","who":"Agence de communication · 12 personnes","x":"Deux graphistes se disputent chaque semaine sur les délais. En entretien, l’un dit : « Il me met la pression. » L’autre : « Il rend toujours tard. » En regardant le planning, vous voyez que la commande arrive du commercial le jeudi pour un rendu le vendredi.","o":[["Corriger le processus : commandes plus tôt, délais réalistes, puis le dire aux deux",2,"Un conflit de personnes peut cacher un problème de structure. Agir sur la cause (le planning) désamorce la tension sans désigner de coupable."],["Leur proposer un atelier sur la communication non violente",1,"Utile à terme, mais cela traite le symptôme : tant que la commande arrive le jeudi, le conflit reviendra."],["Rappeler à chacun ses responsabilités individuelles et les sanctionner s’il le faut",0,"On traite deux personnes pour un problème d’organisation. La cause est dans le processus, pas dans les caractères."]],"w":"Chercher d’abord la cause organisationnelle : rôles flous, délais irréalistes, ressources insuffisantes. Beaucoup de conflits « relationnels » sont des conflits de structure."},{"t":"DIAGNOSTIC","who":"NovaSoft · équipe Support","x":"Nina vous dit : « Omar me traite comme sa secrétaire. » Omar, lui, vous dit : « Je lui demande juste de saisir les tickets. » La fiche de poste de Nina ne mentionne pas la saisie des tickets.","o":[["Dire à Nina de ne pas prendre les choses personnellement : la saisie ne prend que dix minutes par jour",0,"On nie son ressenti et on ne règle pas la cause. Le sentiment d’être rabaissée a un fondement : une tâche hors fiche de poste."],["Demander à Omar de s’excuser auprès de Nina, pour apaiser son ressenti dès aujourd’hui",0,"Une excuse forcée ne change pas la répartition des tâches et durcit Omar. Le problème de rôle reste entier."],["Clarifier la répartition des tâches avec eux, par écrit",2,"Le conflit porte sur un rôle non défini. Clarifier le périmètre règle le fond ; sans cela, le sentiment de mépris persistera."]],"w":"Un conflit de rôles se règle par la clarification des responsabilités. Écrire ce qui est décidé évite que le conflit renaisse."},{"t":"DIAGNOSTIC","who":"Cabinet comptable · 30 personnes","x":"Depuis la fusion de deux équipes, les anciens du cabinet A et ceux du cabinet B déjeunent séparément et se critiquent. Aucune dispute précise n’a eu lieu. Vous sentez la tension monter.","o":[["Lancer des projets mixtes avec un objectif commun",2,"Un but commun qui exige la coopération réduit la rivalité entre groupes (objectifs superordonnés). On agit avant l’escalade."],["Réunir tout le monde pour leur demander d’être solidaires",1,"Le discours est bienvenu, mais sans mécanisme concret il reste une exhortation qui ne change pas les habitudes."],["Attendre un incident précis pour intervenir, puisqu’il n’y a pas de faits",0,"Attendre que le conflit éclate, c’est le laisser grandir. La tension latente est déjà un signal à traiter."]],"w":"Face à une tension entre groupes, créer un objectif commun et des occasions de coopérer est plus efficace qu’un appel à la bonne entente."},{"t":"CHOISIR UN MODE","who":"Équipe projet · urgence","x":"Un serveur est tombé. Deux ingénieurs proposent deux solutions opposées. Le client perd de l’argent à chaque minute. Vous connaissez bien le sujet et vous avez un avis clair.","o":[["Organiser un tour de table pour que chacun s’exprime",1,"La collaboration est précieuse, mais pas quand chaque minute coûte. On y reviendra pour le retour d’expérience."],["Chercher un compromis entre les deux solutions en retenant la moitié de chaque proposition",0,"Couper la poire en deux sur un incident technique peut donner une solution qui ne marche pas. Le temps compte."],["Trancher immédiatement et expliquer votre décision ensuite",2,"En situation d’urgence avec une expertise claire, imposer est le bon mode (compétition). Il faut ensuite expliquer, pour préserver la relation."]],"w":"Il n’existe pas de bon mode universel. Imposer (compétition) est légitime en urgence, ou quand l’enjeu est vital et que le manager sait. À condition d’expliquer ensuite."},{"t":"CHOISIR UN MODE","who":"NovaSoft · squad Beta","x":"Rayan et Sam veulent des outils de test différents. Les deux outils conviennent, coûtent le même prix, et l’équipe est prête à utiliser n’importe lequel. Le débat dure depuis trois semaines.","o":[["Imposer votre outil préféré",1,"Cela règle le sujet vite, mais un manager qui impose sur un sujet mineur crée du ressentiment pour pas grand-chose."],["Leur demander de trancher ensemble en une heure, ou tirer au sort",2,"L’enjeu est faible : passer du temps à débattre coûte plus cher que le risque de se tromper. Un compromis rapide (ou le tirage au sort) est le mode adapté."],["Organiser un atelier de deux jours pour comparer les outils en profondeur",0,"Investir deux jours sur un sujet à faible enjeu est disproportionné. La collaboration complète se réserve aux enjeux importants."]],"w":"Le mode doit être proportionné à l’enjeu. Sur un sujet mineur, le compromis rapide (ou l’accommodation) évite de gaspiller de l’énergie."},{"t":"CHOISIR UN MODE","who":"Direction · stratégie","x":"Votre directeur commercial et votre directrice technique s’opposent sur la feuille de route : plus de nouveautés ou plus de qualité. Les deux arguments sont solides. L’enjeu est majeur pour l’entreprise.","o":[["Comprendre les intérêts de chacun pour chercher une solution gagnant-gagnant",2,"Pour un enjeu majeur avec des points de vue valables, la collaboration (résolution) cherche une solution gagnant-gagnant. C’est long mais rentable."],["Couper la poire en deux : la moitié du budget pour chacun, ce qui évite un arbitrage conflictuel",0,"Le compromis est ici une solution faible : on obtient deux demi-réponses à un enjeu qui mérite d’aller au fond des besoins."],["Décider seul selon votre intuition et votre expérience du marché, pour gagner du temps",1,"Trancher est possible, mais vous perdez l’information des deux experts et risquez de frustrer l’un d’eux durablement."]],"w":"La collaboration est le mode à privilégier quand l’enjeu est élevé, que les points de vue sont légitimes et qu’on dispose de temps."},{"t":"CHOISIR UN MODE","who":"Comité de direction","x":"Un collègue d’un autre service vous demande de laisser passer son projet en priorité. Pour vous c’est un détail, pour lui c’est vital. Vous n’avez pas d’engagement contraire.","o":[["Refuser par principe pour ne pas créer de précédent : demain tous demanderont la priorité",0,"Camper sur sa position sans enjeu réel abîme la relation sans rien rapporter."],["Accepter : cela compte peu pour vous et beaucoup pour lui",2,"L’accommodation (céder) est un bon choix quand l’enjeu est faible pour soi et important pour l’autre : elle construit du crédit relationnel."],["Proposer un échange : vous acceptez, il vous aide sur un sujet à vous",1,"Le troc est acceptable, mais ici il transforme un geste de bonne volonté en transaction et fait perdre le capital sympathie."]],"w":"Céder n’est pas perdre : c’est un choix tactique pertinent quand le sujet compte peu pour soi, à condition de ne pas céder à tout, tout le temps."},{"t":"MÉDIATION","who":"NovaSoft · squad Gamma","x":"Max et Inès sont en désaccord ouvert sur la méthode de travail. Max veut des specs détaillées, Inès veut de l’itératif. Chacun vous demande de lui donner raison.","o":[["Prendre le parti de celui qui a le plus d’ancienneté, car son expérience dans l’entreprise fait foi",0,"Un arbitrage fondé sur l’ancienneté est arbitraire et vexe l’autre, sans aucun lien avec le problème."],["Refuser de choisir et leur demander de s’entendre : ils sont assez expérimentés pour y arriver",1,"Cela peut marcher sur un point mineur. Ici, l’absence de décision laisse l’équipe sans cap et chacun dans son camp."],["Écouter chacun, puis arbitrer selon des critères expliqués",2,"Quand les parties ne trouvent pas d’accord, le manager peut arbitrer, à condition d’écouter et d’expliquer. L’arbitrage transparent reste accepté."]],"w":"Arbitrer est une responsabilité managériale quand la négociation échoue. Un arbitrage est accepté s’il suit des critères explicites et connus."},{"t":"MÉDIATION","who":"Association · 25 salariés","x":"Le conflit entre deux responsables dure depuis un an. Les tentatives du directeur ont échoué : chacun le voit comme partial. L’ambiance de tout le service se dégrade.","o":[["Continuer à les recevoir chacun à son tour, en espérant un déclic",1,"La patience n’est pas inutile mais l’année écoulée montre que cette méthode ne marche plus."],["Faire appel à un médiateur externe accepté par les deux",2,"Quand le manager n’est plus perçu comme neutre, un tiers extérieur peut restaurer la confiance. La médiation est volontaire et confidentielle."],["Muter l’un des deux dans un autre service pour rétablir le calme rapidement",0,"Déplacer une personne sans traiter la cause punit sans résoudre et alimente le sentiment d’injustice."]],"w":"La médiation fait intervenir un tiers neutre, accepté par les deux parties, qui facilite le dialogue sans décider à leur place."},{"t":"MÉDIATION","who":"NovaSoft · équipe Data","x":"Vous menez une médiation entre deux collègues. Au bout de dix minutes, l’un d’eux se met à accuser l’autre de choses qui datent de trois ans.","o":[["Rappeler le cadre : le sujet du jour, le reste est noté pour plus tard",2,"Le médiateur tient le cadre. Remonter dans le passé noie le problème et nourrit les rancunes ; on se concentre sur l’objet précis."],["Laisser faire quelques minutes pour qu’il vide son sac, la tension retombera ensuite d’elle-même",1,"Laisser exprimer le ressenti peut aider un moment, mais sans limite la séance devient un tribunal."],["Prendre le parti de celui qui est accusé pour rééquilibrer une discussion devenue injuste",0,"Le médiateur doit rester neutre. Prendre parti ruine sa légitimité immédiatement."]],"w":"Un médiateur fixe un cadre : un sujet à la fois, un temps de parole égal, pas de jugement sur les personnes, confidentialité."},{"t":"MÉDIATION","who":"PME industrielle · atelier","x":"Un chef d’équipe a crié sur un opérateur devant les autres. L’opérateur est sous le choc, le chef d’équipe dit qu’il a juste « haussé le ton » pour la sécurité.","o":[["Ne rien dire : l’urgence sécurité justifie le ton employé dans l’atelier",0,"Même pour la sécurité, crier devant les collègues humilie. Ne rien dire valide le comportement et expose l’entreprise (obligation de prévention)."],["Demander à l’opérateur d’être moins sensible : l’atelier est un milieu exigeant",0,"Minimiser le ressenti d’une personne humiliée aggrave le conflit et peut relever du harcèlement si cela se répète."],["Entendre les deux séparément, puis rappeler respect et sécurité",2,"On écoute les deux versions, on sépare la fin (sécurité) et les moyens (cris). Ce rappel protège la relation et la sécurité à la fois."]],"w":"Un conflit peut mettre en cause deux objectifs légitimes (sécurité et respect). Le manager doit défendre les deux, et recadrer la forme sans nier le fond."},{"t":"NÉGOCIER","who":"NovaSoft · budget formation","x":"Deux responsables veulent chacun l’intégralité du budget formation, 20 000 €. L’un affirme : « J’ai besoin de 20 000 € ». L’autre : « Sinon c’est moi qui prends tout. »","o":[["Donner tout le budget à celui qui insiste le plus, pour clore le débat",0,"Récompenser la pression apprend à toute l’équipe que crier paie."],["Leur demander ce que chacun veut faire de cet argent",2,"On passe des positions (« tout le budget ») aux intérêts (former sur tel besoin). Les intérêts compatibles permettent souvent une solution créative."],["Diviser le budget en deux parts égales de 10 000 € pour rester équitable",1,"Le partage est équitable en apparence, mais il peut satisfaire aucun besoin réel. On a négocié sur les positions."]],"w":"Négocier sur les intérêts plutôt que sur les positions (Fisher et Ury) : la question « pourquoi » ouvre des solutions que la discussion « combien » ferme."},{"t":"NÉGOCIER","who":"Cabinet d’audit","x":"Une collaboratrice demande du télétravail 3 jours par semaine. Vous craignez la perte du lien d’équipe. Le DRH dit que la règle est de 2 jours.","o":[["Explorer leurs intérêts respectifs, puis proposer un essai de 3 mois",2,"On explore les intérêts des deux côtés, puis on teste. Un essai limité, avec des critères de réussite, rassure et permet d’ajuster."],["Répondre non : la règle est de 2 jours et le DRH la fait respecter dans tous les services",1,"La règle protège une cohérence, mais fermer la discussion sans comprendre le besoin prive de solution (ex. jours fixes de présence)."],["Accepter pour garder une bonne collaboratrice, sans en parler au DRH : cela reste entre vous",0,"Contourner la règle crée une inégalité et vous met en difficulté. Une exception se négocie ouvertement."]],"w":"Une négociation réussie explore les intérêts des deux parties, propose des options et se conclut sur des critères objectifs (période d’essai, indicateurs)."},{"t":"NÉGOCIER","who":"NovaSoft · équipe Delta","x":"Ludovic vous demande une prime pour son équipe. Vous avez un budget limité. Il se dit prêt à en parler « une dernière fois », puis menace de partir.","o":[["Céder immédiatement pour le garder : son équipe est la plus performante du trimestre, le risque est trop grand",0,"Céder à la menace montre que la pression marche : tous les autres managers feront pareil, et l’équité interne est brisée."],["Refuser en disant que personne n’est irremplaçable, pour ne pas céder à la pression d’un ultimatum",0,"La phrase est blessante et rompt le dialogue. Elle augmente le risque de départ réel."],["Reconnaître l’enjeu, examiner les options possibles, répondre selon des critères connus",2,"On ne cède pas à la menace, mais on ne ferme pas la porte. Des critères objectifs (résultats, grille) rendent la décision acceptable."]],"w":"Face à un ultimatum, on reste ferme sur les critères et souple sur les moyens. Ni capituler, ni humilier."},{"t":"NÉGOCIER","who":"Équipe commerciale","x":"Vous négociez avec un client en retard de paiement. Il propose de payer 70 % maintenant et de contester le reste. Vous préférez être payé intégralement, mais la trésorerie est tendue.","o":[["Accepter immédiatement les 70 % : la trésorerie est tendue et cet argent est disponible tout de suite",1,"L’argent rentre, mais vous perdez votre pouvoir de négociation et risquez de ne jamais voir les 30 %."],["Évaluer votre meilleure alternative, puis proposer un échéancier ferme",2,"Connaître sa meilleure alternative en cas d’échec (MAAN) donne un point d’appui. Un échéancier ferme est un compromis solide."],["Menacer de rompre le contrat pour obtenir le paiement intégral, sans autre option",0,"Une menace sans solution de repli est un bluff. Si le client ne cède pas, vous perdez le client et l’argent."]],"w":"Avant une négociation, on prépare sa meilleure alternative (MAAN) : sans elle, on négocie à l’aveugle."},{"t":"ESCALADE","who":"NovaSoft · squad Alpha","x":"Deux semaines après votre première intervention, Karim et Léa échangent à présent par messages écrits, en copiant l’équipe. Le ton est sec et chacun cherche des alliés.","o":[["Intervenir tout de suite : conversation en face à face, règles de communication, et suivi",2,"Les alliés et les messages publics signalent une escalade (stades de Glasl). Plus on intervient tôt, plus c’est simple."],["Demander à l’équipe de choisir son camp pour clarifier",0,"Demander de prendre parti accentue la division en deux camps."],["Attendre : cela se calmera tout seul",0,"Un conflit qui recrute des alliés ne se calme pas seul. Il s’étend à l’équipe."]],"w":"Les conflits s’aggravent par étapes : crispation, polémique, actes, coalitions. Il faut intervenir avant que des camps se forment."},{"t":"ESCALADE","who":"Entreprise de services · 80 salariés","x":"Une salariée vous signale que son collègue lui envoie régulièrement des remarques sur son physique, malgré ses demandes d’arrêter. Il dit que « c’est de l’humour ».","o":[["Demander à la salariée de dire clairement non et de ne pas en faire une affaire",0,"Elle a déjà dit non. Reporter la charge sur elle est un manquement de l’employeur."],["Proposer une médiation entre les deux pour qu’ils règlent cela dans la discrétion",0,"Mettre sur un pied d’égalité victime et auteur présumé est inadapté, et la médiation ne remplace pas l’obligation d’enquêter."],["Enquêter vite, protéger la salariée, sanctionner si les faits sont établis",2,"Ce n’est plus un conflit mais potentiellement du harcèlement sexuel. L’employeur a l’obligation de prévenir et de sanctionner. La médiation est inadaptée."]],"w":"Il faut distinguer conflit et harcèlement : face à des agissements répétés à connotation sexuelle ou à un harcèlement moral, la médiation ne suffit pas, l’employeur doit enquêter et protéger."},{"t":"ESCALADE","who":"NovaSoft · équipe DevOps","x":"Deux membres de l’équipe se sont insultés devant un client. Ce n’est pas la première fois, et l’un d’eux avait déjà reçu un avertissement oral.","o":[["Leur demander de s’excuser publiquement devant le client, pour réparer l’image de l’entreprise",1,"Réparer vis-à-vis du client est utile, mais une excuse publique forcée humilie et ne remplace pas le recadrage."],["Recevoir chacun, rappeler les règles, et associer la RH pour une sanction proportionnée",2,"Quand les rappels ne suffisent plus, la sanction est un outil. Elle doit être proportionnée, décidée avec la RH, et suivre la procédure."],["Licencier immédiatement les deux pour faute grave : ils ont nui à l’image de l’entreprise devant un client",0,"Une sanction disproportionnée et sans procédure expose l’entreprise à un licenciement sans cause réelle et sérieuse."]],"w":"La sanction fait partie de la gestion des conflits quand le comportement est répété. Elle suit la procédure et reste proportionnée."},{"t":"ESCALADE","who":"Atelier de production · 40 salariés","x":"Un conflit entre deux équipes de production a mené à un arrêt de travail pour l’un des opérateurs. Le CSE vous demande de présenter un plan d’action.","o":[["Répondre qu’il s’agit d’un conflit privé entre salariés, hors du périmètre de l’employeur",0,"L’employeur est tenu à une obligation de sécurité, y compris pour les risques psychosociaux. Ce n’est pas un sujet privé."],["Mettre en place seulement une formation à la gestion des conflits pour tous les salariés",1,"Une formation peut faire partie du plan, mais sans diagnostic ni action sur l’organisation, elle ne traite pas la cause."],["Présenter diagnostic, actions et suivi, en consultant le CSE",2,"Le conflit est devenu un risque professionnel. Un plan avec diagnostic, actions et suivi, discuté avec le CSE, répond à l’obligation de prévention."]],"w":"Un conflit qui nuit à la santé est un risque professionnel : l’employeur doit diagnostiquer, agir sur l’organisation et suivre les résultats."},{"t":"APRÈS LE CONFLIT","who":"NovaSoft · squad Alpha","x":"Karim et Léa ont trouvé un accord : revue de code à deux et avec une grille commune. Un mois plus tard, l’équipe semble calmée. Vous êtes content et vous passez à autre chose.","o":[["Faire un point à un mois avec chacun, vérifier que l’accord est tenu, et le réajuster si besoin",2,"Un accord non suivi s’érode. Le suivi montre que le sujet compte et permet d’ajuster."],["Féliciter publiquement l’équipe devant tout le monde en citant leur conflit",0,"Exposer publiquement un conflit passé peut remettre en cause la réconciliation et gêner les deux personnes."],["Ne plus en parler pour ne pas réveiller le sujet",0,"Le silence laisse l’accord s’éroder sans que vous le sachiez, et vous manquez le signal de reprise."]],"w":"Un accord se suit : un point de contrôle, un ajustement si besoin, et une reconnaissance discrète du chemin parcouru."},{"t":"APRÈS LE CONFLIT","who":"Cabinet de conseil","x":"Après un conflit sévère, un collaborateur vous dit : « Je ne veux plus travailler avec elle. » Elle est la seule experte sur son sujet et vous ne pouvez pas la remplacer.","o":[["Chercher des règles de collaboration minimales : rôles, interfaces, points réguliers, sans exiger l’amitié",2,"On vise une coopération professionnelle, pas une réconciliation affective. Des règles claires suffisent souvent."],["Forcer les deux à partager un bureau pour qu’ils se réconcilient",0,"La proximité forcée sans cadre ravive le conflit et peut aggraver la situation."],["Accepter la demande et les séparer définitivement",1,"Séparer est parfois nécessaire, mais ici l’expertise unique rend cela impossible sans coût pour l’équipe."]],"w":"Après un conflit, l’objectif réaliste est une coopération professionnelle fonctionnelle, pas forcément de bonnes relations personnelles."},{"t":"APRÈS LE CONFLIT","who":"NovaSoft · direction","x":"En analysant les trois derniers conflits de l’entreprise, vous constatez qu’ils portent tous sur la répartition des priorités entre squads. Chaque fois, on a réglé le cas individuel.","o":[["Continuer à traiter les conflits un par un : chaque cas est différent",0,"Vous réglez les symptômes en boucle et perdez du temps. Le point commun est la cause."],["Traiter la cause commune : clarifier un processus de priorisation partagé, avec des critères et un arbitre",2,"Un conflit qui se répète est un symptôme d’un système. Corriger le processus évite les prochains conflits."],["Former les managers à la médiation uniquement",1,"Utile, mais la médiation soigne, elle ne prévient pas. Ici la prévention passe par le processus."]],"w":"Un même type de conflit qui revient désigne un défaut d’organisation. Prévenir vaut mieux que réparer."},{"t":"APRÈS LE CONFLIT","who":"PME de services · 60 salariés","x":"Un manager vient de terminer une médiation réussie entre deux collègues. Il vous demande s’il doit parler du cas aux autres équipes pour « en tirer des leçons ».","o":[["Raconter l’histoire en détail pour que ce soit parlant",0,"Exposer les personnes détruit la confiance et dissuade les autres de demander de l’aide."],["Ne rien partager : cela ne regarde que les deux concernés",1,"La confidentialité est essentielle, mais on peut tirer des leçons générales sans trahir qui que ce soit."],["Partager les enseignements généraux sans citer les personnes ni les détails",2,"On capitalise sur la méthode et les principes, sans exposer les personnes. La confidentialité protège la confiance dans la médiation."]],"w":"Capitaliser sur un conflit se fait sur la méthode, pas sur les personnes : principes partagés, confidentialité respectée."}]},"message":{"cards":[{"t":"RECADRER","who":"NovaSoft · squad Beta","x":"Rayan arrive en retard à la réunion du matin pour la troisième fois en deux semaines. Vous voulez le lui dire dès aujourd’hui.","o":[["« Il faudrait vraiment que les gens soient à l’heure en réunion, c’est une question de respect pour tout le monde. »",1,"Message indirect : Rayan peut ne pas se sentir visé. Dire « les gens » évite le conflit mais aussi le changement."],["« Rayan, trois arrivées après 9 h 15 en deux semaines, et l’équipe attend. Qu’est-ce qui se passe ? »",2,"Description factuelle et chiffrée, impact sur le groupe, question ouverte. C’est le début d’un message DESC : aucun jugement sur la personne."],["« Franchement Rayan, tu n’es vraiment pas sérieux : trois fois en deux semaines, ça ne se fait pas du tout. »",0,"C’est un jugement sur la personne, pas sur un comportement. Il déclenche la défense ou la rancune et ne dit pas quoi changer."]],"w":"Un recadrage efficace décrit des faits observables (dates, heures), dit l’effet produit et ouvre la discussion. Il vise le comportement, jamais la personne."},{"t":"RECADRER","who":"Agence de communication","x":"Une collaboratrice a envoyé à un client un document avec des erreurs de chiffres. Le client s’en est plaint. Vous la recevez dans votre bureau.","o":[["« Trois erreurs de chiffres sont parties chez le client, qui l’a remarqué. Comment éviter cela ? »",2,"On décrit le fait, son impact et on demande à la personne de proposer une solution : elle s’approprie le changement."],["« Ce n’est pas grave, ça arrive à tout le monde. On renvoie une version corrigée au client et on n’en parle plus. »",1,"L’intention est bonne (rassurer), mais le message minimise l’erreur et n’en traite pas la cause : rien n’empêche qu’elle se reproduise. L’impact client existe bel et bien."],["« Tu ne vérifies jamais rien. Tu me fais perdre un client, et ce n’est pas la première fois qu’on te le dit. »",0,"Les mots « jamais » et l’accusation déclenchent la défense. On parle de la personne, pas du fait."]],"w":"Éviter « toujours » et « jamais » : ils sont rarement vrais et ferment la discussion. Un fait précis et une question ouverte invitent à la solution."},{"t":"RECADRER","who":"NovaSoft · équipe Support","x":"Vous avez déjà parlé à Omar de son ton trop sec avec les clients. Rien n’a changé. Il vous dit : « Mais je suis comme ça. »","o":[["« Bon, tant pis, on verra. Je ne vais pas t’imposer de changer ta personnalité, chacun son style de toute façon, et les clients s’y feront. »",0,"Renoncer à nouveau valide le comportement et expose les clients. Le message précédent n’a pas été entendu : il faut le préciser, pas l’abandonner."],["« Si tu es comme ça, alors il faudra que tu changes de métier : le service client n’est pas fait pour toi, et je ne vais pas en reparler dix fois. »",0,"Ultimatum et menace : cela décourage au lieu de faire évoluer. Et aucune attente n’est définie."],["« Deux clients ont demandé un autre interlocuteur cette semaine. J’attends un ton plus ouvert ; je t’aide si besoin. »",2,"On rappelle les faits, on pose l’attente (Spécifier) et on propose un soutien. C’est la structure DESC dans sa version complète."]],"w":"Après un premier échec, il faut préciser l’attente et proposer de l’aide (formation, accompagnement) : « Spécifier » et « Conclure » du DESC."},{"t":"RECADRER","who":"Équipe de direction","x":"Un collègue interrompt systématiquement les autres en réunion. Vous lui parlez en tête à tête, de manière constructive.","o":[["« Hier, tu as coupé la parole à Inès deux fois et elle n’a pas pu finir. Tu peux la laisser finir ? »",2,"Fait précis, impact, attente claire, et demande d’engagement. On reste sur ce qui s’est passé, sans généraliser."],["« Peut-être que tu pourrais réfléchir à ton attitude générale en réunion, et à l’image que tu donnes aux autres membres de l’équipe. »",1,"Trop vague. « Attitude générale » ne dit pas quoi changer : le collègue ne saura pas par où commencer."],["« Tu es mal élevé : tu coupes tout le monde, ça devient pénible et ça mine l’ambiance de toutes les réunions de direction. »",0,"Attaque personnelle : elle blesse sans proposer d’issue."]],"w":"Plus un message est précis, plus il est facile à appliquer. « Ton attitude » est inutilisable ; « laisser finir les phrases » est un comportement concret."},{"t":"REMERCIER","who":"NovaSoft · squad Gamma","x":"Nina a repris seule un dossier client très difficile et l’a sauvé. Vous voulez le lui dire.","o":[["« C’est ton travail, après tout. On ne va pas non plus t’offrir un week-end pour avoir fait ce qu’on te paie à faire. »",0,"Le mot est dévalorisant. L’absence de reconnaissance est l’une des premières causes de départ."],["« Super boulot Nina, bravo ! Toute l’équipe t’en est reconnaissante, et la direction va en entendre parler aussi. »",1,"Agréable, mais vague : la personne ne sait pas ce qui était bien, donc ne saura pas le refaire."],["« Merci Nina. Trois appels au client, la cause du bug trouvée, livraison lundi : c’est le sens du client que j’apprécie. »",2,"Un feedback positif utile est précis : il nomme les actes et la valeur qu’ils portent, donc la personne sait quoi reproduire."]],"w":"La reconnaissance efficace est précise, rapide et sincère. Elle décrit ce qui a été fait et l’effet obtenu."},{"t":"REMERCIER","who":"Entreprise de services","x":"Vous faites un compliment public à un collaborateur discret qui déteste être mis en avant devant tout le monde.","o":[["Ne rien dire : il sait qu’il a bien travaillé",0,"Le silence est interprété comme de l’indifférence. Les gens ont besoin d’entendre ce qui est apprécié."],["Le lui dire en tête à tête, avec des faits précis",2,"On adapte la forme à la personne. La reconnaissance doit être reçue comme telle, pas comme une gêne."],["Le féliciter devant toute l’équipe, parce que la reconnaissance doit être publique",0,"Une règle unique ne convient pas à tous. Pour une personne gênée, le compliment public devient un stress."]],"w":"On adapte la reconnaissance à la personne : certains aiment l’honneur public, d’autres préfèrent un mot discret. La seule erreur est le silence."},{"t":"REMERCIER","who":"NovaSoft · squad Delta","x":"Ludovic vous dit : « Tu félicites toujours les mêmes. » Vous reconnaissez que c’est un peu vrai. Vous voulez rectifier sans en faire des tonnes.","o":[["Reconnaître l’écart et relever les contributions de chacun chaque semaine",2,"Admettre le déséquilibre et corriger par une habitude simple restaure la confiance. L’équité de la reconnaissance compte autant que sa fréquence."],["Répondre que ce n’est pas vrai",0,"Nier sans vérifier détruit la crédibilité. Ludovic exprime un ressenti qui a probablement un fond."],["Féliciter publiquement tout le monde en bloc lors de la prochaine réunion pour compenser",1,"Un compliment collectif générique sonne creux. La reconnaissance précise est celle qui compte."]],"w":"Une reconnaissance perçue comme inéquitable démotive. La régularité et la précision valent mieux que l’emphase."},{"t":"REMERCIER","who":"Cabinet comptable","x":"Un jeune collaborateur propose une idée qui vous paraît naïve, mais qui contient un point intéressant.","o":[["« Ça ne marchera jamais, on a déjà essayé. »",0,"On tue l’initiative. Les bonnes idées futures ne viendront plus."],["Reconnaître l’intérêt du point précis, puis expliquer ce qui bloque le reste",2,"On valorise ce qui est utile et on explique les limites. Le collaborateur apprend et continue à proposer."],["« Super idée ! » sans rien en faire",1,"Un enthousiasme sans suite crée de la déception et de la méfiance plus tard."]],"w":"Dire non à une idée sans éteindre l’envie : valoriser le bon point, expliquer le blocage, et indiquer ce qu’on en retient."},{"t":"ÉCOUTER","who":"NovaSoft · équipe Data","x":"Sam vous dit en entretien : « Je ne sais pas si je vais tenir. J’ai trop de choses en même temps. » Vous avez cinq minutes avant une autre réunion.","o":[["« Tout le monde a beaucoup de choses en ce moment. »",0,"Vous banalisez. Sam entend que son ressenti n’est pas légitime."],["« Pas de souci, je vais te retirer deux dossiers. » (tout de suite, sans plus de questions)",1,"L’intention est bonne, mais vous répondez sans avoir compris. Vous risquez de retirer ce qui compte pour lui et de laisser ce qui l’épuise."],["« Si je comprends bien, tu as trop de sujets à la fois. Qu’est-ce qui pèse le plus ? »",2,"La reformulation montre que vous avez entendu, et la question ouverte invite à aller plus loin. C’est l’écoute active."]],"w":"Écouter, c’est reformuler avant de répondre et poser une question ouverte. On comprend d’abord, on agit ensuite."},{"t":"ÉCOUTER","who":"Entreprise de services","x":"Pendant que vous parlez à un collaborateur qui vous raconte un problème personnel, votre téléphone vibre sans arrêt sur la table.","o":[["Répondre à un message urgent puis reprendre l’écoute",1,"Une vraie urgence peut justifier une interruption brève, mais il faut le dire, sinon la personne se sent moins importante que l’écran."],["Retourner le téléphone, le mettre en silence, et rester concentré sur la personne",2,"L’attention visible est la base de l’écoute. Montrer qu’on se rend disponible vaut plus que n’importe quelle phrase."],["Regarder discrètement l’écran de temps en temps, tout en l’écoutant",0,"Le collaborateur voit tout. Il ressent que vous n’êtes pas là et il se referme."]],"w":"L’écoute commence par la disponibilité : téléphone retourné, regard, temps annoncé. Ce que l’on fait compte plus que ce que l’on dit."},{"t":"ÉCOUTER","who":"NovaSoft · squad Alpha","x":"Léa vous dit, très agacée : « Karim ne comprend rien à la façon dont on travaille ici. » Vous avez envie de lui répondre que Karim est nouveau.","o":[["« Tu es agacée. Qu’a-t-il fait précisément ? »",2,"On accueille l’émotion, puis on demande les faits. Sans ce passage, on ne peut ni aider ni arbitrer."],["« Ne sois pas aussi dure, il est nouveau. »",0,"On invalide le ressenti, on prend parti et on ferme la discussion avant d’avoir compris."],["« Tu as raison, il est vraiment à côté de la plaque. »",0,"Donner raison sans connaître les faits vous place dans son camp et vous retourne contre Karim, que vous devrez ensuite manager."]],"w":"Face à une émotion forte : accueillir (« tu es agacée »), puis demander les faits. Ne jamais valider un jugement sur un absent."},{"t":"ÉCOUTER","who":"Cabinet de conseil · séminaire","x":"Lors d’un entretien annuel, un collaborateur dit : « Je ne vois pas d’avenir ici. » Vous êtes surpris car vous le pensiez satisfait.","o":[["« Mais enfin, tu as eu une augmentation l’an dernier ! »",0,"Vous vous défendez au lieu d’écouter. Le collaborateur entend qu’il est ingrat et se tait."],["« Je vais voir ce que je peux faire. » (sans demander de précision)",1,"L’intention est bonne, mais la promesse floue crée une attente que vous ne saurez pas tenir sans connaître son besoin."],["« Qu’est-ce qui te fait dire cela ? À quoi ressemblerait l’avenir que tu cherches ? »",2,"Deux questions ouvertes : comprendre la cause et le besoin. Vous obtenez de l’information avant de défendre l’entreprise."]],"w":"Un propos qui surprend est une information. Plutôt que se justifier, creuser avec une question ouverte."},{"t":"DIRE NON","who":"NovaSoft · direction","x":"Tan, le directeur technique, vous demande de livrer une fonctionnalité de plus d’ici vendredi. L’équipe est déjà à la limite.","o":[["« Non, c’est impossible : l’équipe est déjà à 120 % de charge depuis un mois, point final. »",1,"La limite est claire mais le ton est fermé : vous ne proposez rien et vous passez pour quelqu’un de difficile."],["« Je peux livrer la fonctionnalité en cours vendredi et la nouvelle dans dix jours, ou l’inverse. Laquelle d’abord ? »",2,"Un « non » assertif : il dit ce qui est possible, il propose un choix et renvoie l’arbitrage au décideur. Vous restez coopératif sans vous épuiser."],["« D’accord, on va y arriver » (en sachant que ce sera impossible, mais on ne contredit pas le directeur)",0,"Dire oui pour éviter le conflit prépare un échec public et abîme la confiance."]],"w":"Dire non avec assertivité : annoncer ce qui est possible, proposer une alternative, demander un arbitrage. Ni soumission, ni agressivité."},{"t":"DIRE NON","who":"Agence de communication","x":"Un client vous demande une modification de dernière minute qui n’était pas prévue au contrat. Vous voulez garder la relation.","o":[["« Je comprends l’enjeu. C’est hors périmètre : je peux le faire à tel prix et tel délai, ou le décaler. »",2,"On reconnaît le besoin, on pose la limite du contrat et on propose deux options. Le client garde la main sans que vous soyez perdant."],["Accepter gratuitement cette fois pour ne pas fâcher un client qui pèse lourd dans le chiffre d’affaires de l’agence",0,"Vous créez un précédent : toutes les prochaines demandes seront gratuites aussi."],["Refuser sèchement en citant l’article du contrat qui limite strictement le périmètre, et clore la discussion là-dessus",1,"Vous avez raison sur le fond, mais la forme met le client en défense et vous perdez la relation sans nécessité."]],"w":"On peut dire non à la demande tout en disant oui à la personne : reconnaître le besoin, rappeler le cadre, proposer des options."},{"t":"DIRE NON","who":"NovaSoft · équipe Support","x":"Un collègue vous demande régulièrement de relire ses documents à la dernière minute. Vous avez dit oui trois fois, et vous n’en pouvez plus.","o":[["Continuer à dire oui en espérant que ça s’arrête : il finira bien par s’organiser mieux",0,"La situation ne s’arrêtera pas seule, et votre rancœur grandira jusqu’à l’explosion."],["Éviter ce collègue et ne plus répondre à ses messages pour ne plus avoir à lui dire non en face",0,"L’évitement est un non muet : le collègue ne comprend pas et la relation se dégrade."],["« Je relis volontiers, mais envoie-moi tes documents au plus tard la veille à 17 h. »",2,"Un non partiel qui pose une règle claire. Vous restez serviable et vous protégez votre temps."]],"w":"Être assertif, c’est poser une règle claire et la tenir. Le manque de clarté nourrit la rancœur."},{"t":"DIRE NON","who":"PME de services","x":"Votre responsable vous demande en réunion d’annoncer à l’équipe une décision que vous jugez injuste. Il dit : « Tu es manager, tu fais passer le message. »","o":[["Annoncer la décision en précisant que vous n’y êtes pour rien et que vous ne l’auriez pas prise",0,"Se désolidariser devant l’équipe décrédibilise la direction et vous-même : vous n’êtes plus un manager, vous êtes un messager."],["Lui dire votre désaccord en privé avant la réunion, puis annoncer la décision",2,"On exprime son désaccord à la bonne personne, au bon moment. Ensuite on assume le rôle de relais sans trahir ni la direction ni l’équipe."],["Annoncer la décision sans dire ce que vous en pensez, ni à votre chef ni à l’équipe",1,"Loyal mais silencieux : votre responsable ne sait rien de votre désaccord et ne pourra pas corriger."]],"w":"Un manager porte les décisions, y compris celles qu’il discute. Le désaccord se dit à la hiérarchie, en privé et avant."},{"t":"MAUVAISE NOUVELLE","who":"NovaSoft · squad Delta","x":"Le client a annulé le projet sur lequel travaille la squad Delta depuis six mois. Vous l’apprenez ce matin et vous devez l’annoncer.","o":[["Réunir l’équipe vite, annoncer la décision, dire ce qu’on ignore, fixer un point à 48 h",2,"La transparence rapide évite les rumeurs. Dire ce qu’on ignore est plus crédible qu’une fausse assurance."],["Annoncer la nouvelle par courriel immédiatement, avec un ton rassurant et un lien vers la FAQ",1,"L’écrit est rapide, mais l’annonce d’une mauvaise nouvelle importante se fait en présence, avec place pour les questions."],["Attendre d’avoir toutes les réponses pour tout annoncer d’un coup, afin de ne pas inquiéter l’équipe inutilement",0,"Le silence nourrit la rumeur. Les gens apprennent la nouvelle par d’autres canaux et vous perdez leur confiance."]],"w":"Une mauvaise nouvelle s’annonce vite, en direct, avec ce qu’on sait, ce qu’on ignore, et le prochain rendez-vous."},{"t":"MAUVAISE NOUVELLE","who":"Entreprise de services","x":"Vous devez annoncer à un collaborateur qu’il n’obtiendra pas la promotion qu’il espérait. Il a de bons résultats.","o":[["Lui annoncer par message pour éviter une discussion difficile",0,"Annoncer une déception importante par écrit est vécu comme un manque de respect et ferme tout dialogue."],["Commencer par trois compliments sincères sur ses résultats pour adoucir, puis annoncer la mauvaise nouvelle",1,"La méthode du « sandwich » est connue de tous : le collaborateur attend le « mais » et n’entend plus les compliments."],["Annoncer la décision d’emblée, l’expliquer, et proposer un plan pour la prochaine échéance",2,"On annonce d’abord (pas de suspense inutile), puis on explique et on ouvre une perspective. Le collaborateur peut rebondir."]],"w":"On annonce la décision d’abord, puis on explique, on accueille l’émotion et on ouvre un chemin. L’effet sandwich est transparent."},{"t":"MAUVAISE NOUVELLE","who":"NovaSoft · direction","x":"Une réorganisation prévoit de fusionner deux équipes. Le CSE n’a pas encore été consulté. Un manager vous demande ce qu’il peut dire à son équipe.","o":[["Ne rien dire du tout jusqu’à la fin de la consultation, par respect de la procédure légale",1,"Aucune règle n’impose un silence complet : les rumeurs vont courir. Un message mesuré vaut mieux."],["Il peut dire qu’un projet est à l’étude, sans décision avant la consultation du CSE",2,"On reste honnête sans présenter comme décidé ce qui ne l’est pas. La consultation du CSE doit précéder la décision."],["Annoncer la fusion comme définitive pour rassurer l’équipe par la clarté et éviter les rumeurs",0,"Présenter comme actée une décision soumise à consultation contredit l’obligation de consulter le CSE avant de décider et fragilise la crédibilité de la direction."]],"w":"En période de projet, la communication reste honnête : un projet n’est pas une décision, et la consultation précède la décision."},{"t":"MAUVAISE NOUVELLE","who":"PME industrielle","x":"Après une erreur de votre part, un client important a subi un retard de livraison. Votre responsable vous demande ce qui s’est passé.","o":[["Expliquer que c’est la faute du fournisseur, sans mentionner votre propre erreur",0,"Si la vérité apparaît, vous perdez toute crédibilité. Et rien n’aura été corrigé."],["Attendre que le client se plaigne avant d’en parler",0,"Vous perdez l’occasion de maîtriser le message et d’agir en premier."],["Assumer votre erreur, décrire les faits et proposer des mesures",2,"L’honnêteté et l’action concrète rétablissent la confiance. Un responsable préfère un collaborateur qui assume à celui qui cache."]],"w":"Face à une erreur : reconnaître, expliquer, corriger, prévenir. Avouer tôt coûte moins cher que cacher."},{"t":"ÉCRIT ET CANAL","who":"NovaSoft · squad Beta","x":"Un collègue vous a envoyé un courriel au ton sec qui vous a énervé. Vous avez envie de répondre tout de suite et d’y mettre tout le monde en copie.","o":[["Attendre, relire, puis proposer un échange oral court pour clarifier",2,"Un ton sec à l’écrit est souvent une interprétation. Un échange oral dissipe les malentendus et évite l’escalade publique."],["Répondre par un message très court et froid, en miroir",1,"Le miroir envenime. Vous entrez dans une escalade silencieuse qui ne résout rien."],["Répondre immédiatement avec la hiérarchie en copie pour faire pression",0,"Mettre la hiérarchie en copie est perçu comme une attaque et transforme un malentendu en conflit."]],"w":"L’écrit transmet mal le ton. Quand l’émotion monte, on change de canal : un appel ou un échange en face à face règle ce que dix messages aggravent."},{"t":"ÉCRIT ET CANAL","who":"Cabinet de conseil","x":"Vous devez demander à votre équipe de modifier une procédure qui concerne la sécurité des données. Les gens lisent peu leurs courriels.","o":[["Annoncer en réunion d’équipe, résumer par écrit en trois lignes, et vérifier que chacun a compris",2,"On combine l’oral, pour comprendre et poser des questions, et l’écrit, pour laisser une trace. Vérifier la compréhension ferme la boucle."],["Envoyer un long courriel détaillé à toute l’entreprise",1,"L’écrit laisse une trace, mais un long courriel est lu en diagonale et vous n’avez aucune preuve de compréhension."],["Prévenir à la machine à café, de bouche à oreille",0,"Le message se déforme, certains ne l’auront pas, et il n’y a aucune trace."]],"w":"Pour un message important : oral pour expliquer, écrit pour tracer, et vérification que le message a été compris."},{"t":"ÉCRIT ET CANAL","who":"NovaSoft · direction","x":"Vous écrivez un courriel à toute l’entreprise pour annoncer un changement d’horaires. Vous hésitez sur la façon de commencer.","o":[["Commencer par un long historique de la décision",0,"Le lecteur décroche avant d’arriver à l’information qui le concerne."],["Commencer par l’essentiel : quoi, quand, pour qui, puis expliquer pourquoi",2,"Un bon courriel met l’essentiel en premier : le lecteur pressé comprend l’action à mener sans tout lire."],["Écrire un objet vague : « Information importante »",0,"Un objet vague est ignoré ou lu trop tard. L’objet doit dire de quoi il s’agit et ce qu’on attend du lecteur."]],"w":"Un message écrit efficace : objet précis, information principale en premier, action attendue claire."},{"t":"ÉCRIT ET CANAL","who":"Équipe en télétravail","x":"Deux membres de votre équipe se plaignent d’être « tenus à l’écart » depuis que l’équipe est à distance. Les échanges passent surtout par messagerie instantanée.","o":[["Leur dire que c’est un problème de motivation personnelle",0,"Vous niez un problème de fonctionnement collectif en l’imputant aux individus."],["Multiplier les messages sur la messagerie pour qu’ils se sentent inclus",1,"Plus de messages ne crée pas de lien. Le volume peut même isoler davantage ceux qui répondent plus lentement."],["Instaurer un point d’équipe régulier en visio, et un temps d’échange informel",2,"À distance, il faut créer des rituels de lien. La messagerie seule laisse certains en dehors des échanges."]],"w":"La communication à distance exige des rituels : points réguliers, canaux clairs, temps informel. Le canal doit être choisi pour son effet."}]},"motivation":{"cards":[{"t":"BESOINS","who":"NovaSoft · équipe Support","x":"Nina vient d’apprendre que son contrat sera renouvelé seulement trois mois. Elle est brillante mais devient distraite et irritable. Elle n’ose pas vous en parler.","o":[["Organiser un déjeuner d’équipe vendredi pour lui changer les idées et la remettre en confiance",1,"Le lien social aide, mais ne règle pas la cause de l’inquiétude."],["Lui donner de la visibilité sur son avenir dès que possible",2,"Dans la pyramide de Maslow, le besoin de sécurité (emploi stable) passe avant l’estime et l’accomplissement. Tant qu’il n’est pas satisfait, aucun autre levier ne marche."],["Lui proposer une formation passionnante sur l’IA pour la stimuler et lui redonner envie",0,"On répond à un besoin supérieur (accomplissement) alors que le besoin de base (sécurité) est menacé. La formation lui semblera hors sujet."]],"w":"Maslow : on ne motive pas par un besoin supérieur quand un besoin de base est menacé. D’abord sécurité, ensuite reconnaissance et accomplissement."},{"t":"BESOINS","who":"Agence commerciale","x":"Votre meilleur vendeur adore les défis chiffrés et les classements. Une nouvelle recrue, au contraire, préfère travailler en binôme et cherche surtout de bonnes relations.","o":[["Au vendeur, proposer des objectifs ambitieux avec classement ; à la recrue, un travail en binôme avec un parrain",2,"McClelland : besoin d’accomplissement pour l’un, d’affiliation pour l’autre. On adapte les leviers à chaque profil."],["Supprimer tous les classements pour éviter la compétition",0,"Vous privez le vendeur de son moteur principal. Il peut chercher ailleurs."],["Proposer le même classement à tout le monde, pour être équitable",1,"L’équité de traitement est un principe, mais le classement peut démotiver ceux qui valorisent la relation."]],"w":"Les besoins dominants diffèrent (McClelland : accomplissement, affiliation, pouvoir). Une même mesure motive les uns et décourage les autres."},{"t":"BESOINS","who":"NovaSoft · squad Alpha","x":"Karim a très bien réussi sa mission. Il a un bon salaire, un bon poste. Pourtant il dit s’ennuyer : « Je fais toujours la même chose. »","o":[["Lui rappeler qu’il a un bon salaire et un bon poste, et que beaucoup aimeraient être à sa place",0,"On nie son ressenti et on augmente le risque de départ."],["Lui accorder une prime exceptionnelle et le féliciter publiquement devant toute la squad",1,"La prime reconnaît, mais ne traite pas l’ennui. L’effet s’épuise vite (Herzberg : l’argent n’est pas un facteur de motivation durable)."],["Lui proposer une mission qui l’élargit : nouveau domaine ou rôle d’expert référent",2,"Besoins d’estime et d’accomplissement : le salaire est un facteur d’hygiène. Karim cherche du développement, pas de l’argent."]],"w":"Quand les besoins de base sont satisfaits, c’est le contenu du travail (défi, développement, responsabilité) qui motive."},{"t":"BESOINS","who":"Entreprise de services","x":"Un jeune collaborateur dit : « Je veux comprendre à quoi sert mon travail pour l’entreprise. » Vous avez l’habitude de donner les tâches sans contexte.","o":[["Lui expliquer le but, le client final et l’effet de son travail sur le résultat",2,"Le sens du travail est un puissant moteur. L’autodétermination (Deci et Ryan) s’appuie sur l’autonomie, la compétence et le sentiment d’utilité."],["Lui montrer le tableau de bord de l’entreprise, sans lien avec sa tâche",1,"Le tableau de bord informe, mais sans lien explicite avec son travail, le sens reste abstrait."],["Lui répondre qu’il n’a pas à comprendre, juste à faire",0,"Vous coupez le lien entre la tâche et le sens. L’implication s’effondre."]],"w":"Le sens est un levier : relier la tâche au but, au client, à l’impact. C’est gratuit et souvent décisif."},{"t":"HYGIÈNE ET MOTIVATION","who":"NovaSoft · équipe DevOps","x":"Les ordinateurs de l’équipe sont lents et la climatisation en panne. Un manager propose de lancer un programme de reconnaissance avant de régler ces problèmes.","o":[["Faire les deux en même temps, mais seulement avec le budget actuel",1,"Faire les deux est bien, mais avec un budget fixe, on rate le plus urgent : le matériel doit passer en premier."],["Lancer d’abord le programme de reconnaissance : cela motive bien plus durablement qu’un ordinateur neuf",0,"Reconnaître des gens qui travaillent dans de mauvaises conditions est contre-productif : les facteurs d’hygiène défaillants annulent l’effet."],["Régler d’abord le matériel : c’est un facteur d’hygiène qui, mal traité, crée de l’insatisfaction",2,"Herzberg : sans hygiène correcte (conditions, matériel, salaire), la reconnaissance est perçue comme du cynisme. Elle viendra ensuite, sinon elle sonne faux."]],"w":"Herzberg : les facteurs d’hygiène (conditions, matériel, salaire) évitent l’insatisfaction ; seuls les facteurs de motivation (reconnaissance, responsabilité, contenu) produisent de l’engagement."},{"t":"HYGIÈNE ET MOTIVATION","who":"PME industrielle","x":"Le salaire de vos opérateurs est dans la moyenne du secteur. Un manager propose une augmentation générale pour « les motiver ».","o":[["Dire non à toute augmentation : « ils sont déjà payés au prix du marché, et le budget est gelé cette année »",0,"Avoir un salaire au niveau du marché ne justifie pas de ne jamais le réviser. Mal géré, ce refus devient un facteur d’insatisfaction."],["Vérifier si l’écart avec le marché est réel ; sinon, investir dans formation et responsabilités",2,"Une augmentation ne motive pas durablement quand le salaire est correct. Les leviers de développement et de responsabilité ont plus d’effet."],["Accorder l’augmentation générale proposée pour calmer le climat avant la fin du trimestre",1,"La satisfaction peut monter un temps, puis l’habitude s’installe et le niveau de motivation retombe."]],"w":"Le salaire est un facteur d’hygiène : trop bas, il démotive ; correct, il n’active plus la motivation. Pour aller plus loin, il faut du contenu et de la responsabilité."},{"t":"HYGIÈNE ET MOTIVATION","who":"NovaSoft · squad Gamma","x":"Max a un salaire élevé et de très bonnes conditions. Il reste pourtant peu impliqué. Il dit qu’on ne lui confie « que des tâches de routine ».","o":[["Enrichir son poste : lui confier un projet complet dont il porte le résultat",2,"Hackman : l’enrichissement (variété, identité de la tâche, autonomie, feedback) augmente la motivation intrinsèque."],["Lui offrir un mois de congé supplémentaire pour qu’il se ressource et revienne motivé",1,"Un avantage de plus, mais pas de changement de contenu : l’implication restera faible au retour."],["Lui dire qu’avec son salaire il n’a pas à se plaindre",0,"On confond hygiène et motivation. Avec ce discours, on risque de le perdre."]],"w":"Enrichir les tâches (projet entier, autonomie, retour sur résultats) est un levier plus fort que des avantages supplémentaires."},{"t":"HYGIÈNE ET MOTIVATION","who":"Cabinet de conseil","x":"Un directeur veut supprimer les repas d’équipe mensuels pour économiser. Il dit : « Ça ne motive personne de toute façon. »","o":[["Supprimer sans rien dire : le budget prime et l’événement n’a plus été rentable depuis deux ans",0,"Si l’équipe y tient, la suppression crée un sentiment de perte (hygiène) pour un gain financier faible."],["Mesurer l’effet réel sur le lien et le climat avant de décider, en interrogeant l’équipe",2,"Une décision sur la motivation sans données est une opinion. Écouter les personnes concernées évite d’alimenter l’insatisfaction pour peu d’économies."],["Remplacer par un cadeau individuel de même valeur, plus simple à gérer pour les RH",1,"Un cadeau n’a pas la même fonction : le repas crée du lien, le cadeau non."]],"w":"Avant de couper un avantage « qui ne motive personne », vérifiez ce qu’il apporte : lien, signal, habitude. Sa suppression peut coûter plus qu’il ne rapporte."},{"t":"ATTENTE (VROOM)","who":"NovaSoft · squad Delta","x":"Vous annoncez une prime de performance pour la squad. Ludovic dit : « Peu importe mes efforts, les objectifs dépendent du client et personne ne les atteint. »","o":[["Augmenter le montant de la prime pour rendre l’objectif plus attractif et relancer l’équipe",0,"Même énorme, une prime inaccessible ne motive pas. Si l’attente est nulle, la motivation est nulle."],["Dire à Ludovic qu’il manque d’ambition et que l’équipe doit faire preuve de plus d’initiative",0,"Vous attribuez à sa personnalité ce qui est un problème de système. Il se désengager
