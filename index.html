irectrice générale","m":"Tu dois livrer les projets clients malgré la crise.","f":"per"},{"n":"DRH","m":"Tu veux remonter l’engagement des équipes.","f":"eng"},{"n":"Directeur financier","m":"Tu surveilles chaque euro du plan de 45 000 €.","f":"bud"},{"n":"Directeur technique (Tan)","m":"Tu ne veux plus perdre tes experts.","f":"ret"},{"n":"Élue du CSE","m":"Tu portes la voix des salariés et du baromètre.","f":"eng"}],"events":[{"t":"LE BAROMÈTRE","x":"L’enquête interne donne un eNPS de −5 : 25 promoteurs, 26 passifs et 29 détracteurs sur 80 répondants. Dans les sept équipes opérationnelles, il est même à −15. La direction se demande que faire des résultats.","o":[{"t":"Garder les résultats confidentiels pour éviter de les inquiéter et lancer un plan préparé par la direction seule","fx":{"per":2,"eng":-2,"ret":-1},"w":"Le plan avance vite et sans discussion. Les salariés comprennent qu’on a demandé leur avis pour rien : la défiance monte."},{"t":"Restituer les résultats à toutes les équipes sous deux semaines, choisir trois actions avec elles et annoncer un calendrier","fx":{"eng":1,"ret":1},"rec":true,"w":"Les salariés qui ont répondu voient que leur voix compte. Associer les équipes aux actions les rend plus acceptables. La restitution coûte un peu de temps et d’animation."},{"t":"Refaire une enquête plus détaillée avant d’agir, pour être certain du diagnostic","fx":{"eng":-1,"ret":-1},"w":"Trois mois de plus sans action : les détracteurs s’impatientent et les plus mobiles commencent à chercher ailleurs."}],"rep":"L’eNPS se calcule : % de promoteurs moins % de détracteurs (ici 25/80 − 29/80 = −5 points). Une enquête sans retour d’action détruit la confiance en l’enquête suivante."},{"t":"LA PRIME GÉNÉRALE","x":"La direction propose une prime exceptionnelle de 1 000 € à chacun des 85 salariés pour « marquer le coup », soit environ 120 700 € avec les charges patronales de 42 %. Le directeur financier hésite.","o":[{"t":"Cibler le budget sur les causes identifiées (charge de travail, management, évolution) avec un plan de 40 000 € dont l’efficacité sera mesurée","fx":{"eng":1,"ret":1,"bud":-1},"rec":true,"w":"Vous traitez les causes du désengagement plutôt que d’en acheter les symptômes. Le montant est maîtrisé et vous suivez l’effet."},{"t":"Ne rien verser : l’argent ne motive pas, selon Herzberg","fx":{"eng":-1,"ret":-1},"w":"Herzberg dit que l’argent ne motive pas durablement, pas qu’il est sans effet : si les salaires sont perçus comme injustes, l’insatisfaction s’installe."},{"t":"Verser la prime à tous : le signal est immédiat et simple à comprendre","fx":{"eng":2,"bud":-2,"per":-1},"w":"L’effet est bon pendant quelques semaines. L’argent ne règle pas les causes, et le budget est consommé sans retour durable."}],"rep":"Facteurs d’hygiène (salaire, conditions) et de motivation (reconnaissance, contenu, responsabilité) : l’argent évite l’insatisfaction mais ne crée pas l’engagement."},{"t":"LE MANAGER DE LA SQUAD DELTA","x":"Ludovic, manager de la squad Delta, a d’excellents résultats techniques. Pourtant trois personnes de son équipe ont démissionné en six mois en citant « l’ambiance et la pression ». La direction dit : « On ne peut pas se passer de lui. »","o":[{"t":"Ne rien changer : ses résultats parlent pour lui et les départs sont des cas individuels","fx":{"per":2,"ret":-2,"eng":-1},"w":"La performance technique est préservée à court terme. Les départs continuent et le reste de l’équipe se démotive."},{"t":"Le rétrograder devant l’équipe pour montrer que la direction réagit","fx":{"eng":-1,"per":-1},"w":"La sanction publique humilie Ludovic, crée de la crainte chez les autres managers, et ne traite pas la cause."},{"t":"Avoir un entretien franc avec lui, l’accompagner (coaching, retours à 360°) et fixer des objectifs de management mesurés à trois mois","fx":{"ret":1,"eng":1},"rec":true,"w":"On reconnaît ses résultats et on traite le problème de management avec un cadre et du soutien. Le coaching coûte un peu mais le départ de trois personnes coûte bien plus."}],"rep":"Chaque départ coûte environ 50 % du salaire annuel (21 000 € pour un salaire moyen de 42 000 €). Trois départs représentent plus de 60 000 €, hors perte de savoir-faire."},{"t":"LE TÉLÉTRAVAIL","x":"Plusieurs squads demandent trois jours de télétravail par semaine. La règle actuelle est de deux jours. Certains managers craignent de perdre le lien d’équipe ; d’autres répondent que les meilleurs candidats l’exigent.","o":[{"t":"Laisser chaque manager décider seul pour son équipe, selon son sentiment","fx":{"eng":-1,"per":-1},"w":"Les écarts entre équipes créent une perception d’injustice et des départs. Le sujet devient un enjeu de rapport de force."},{"t":"Imposer cinq jours de présence pour reconstruire la culture d’entreprise","fx":{"per":2,"eng":-2,"ret":-1},"w":"La présence facilite la coordination à court terme. Les meilleurs profils mobiles partent chez des concurrents plus souples."},{"t":"Négocier un accord : trois jours de télétravail avec deux jours de présence collective fixes, une revue à six mois et des règles de joignabilité","fx":{"eng":1,"ret":1,"per":1},"rec":true,"w":"La flexibilité répond à un besoin des salariés, la présence collective protège le lien. La revue permet d’ajuster sur des faits. Les ajustements d’espaces coûtent un peu."}],"rep":"Le télétravail peut être prévu par accord collectif ou par charte ; l’essentiel est la clarté des règles et leur équité entre équipes."},{"t":"LA FORMATION","x":"Dans le baromètre, 41 % des répondants disent ne pas voir d’évolution possible. Le service RH propose un plan de formation. Un manager suggère une plateforme d’e-learning illimitée à 25 000 € ; un autre suggère de couper les formations pour économiser.","o":[{"t":"Co-construire un plan de formation à partir des besoins exprimés aux entretiens professionnels, avec 20 000 € et un suivi des compétences acquises","fx":{"eng":1,"per":1,"bud":-2},"rec":true,"w":"La formation correspond à des besoins réels, ce qui augmente l’usage, l’engagement et la performance. Le budget est dépensé avec un but."},{"t":"Acheter la plateforme d’e-learning illimitée : l’offre est riche et chacun apprendra ce qu’il veut","fx":{"eng":1,"bud":-2},"w":"Les taux d’usage de ce type de plateforme sont souvent faibles. L’abonnement est payé mais l’effet sur l’évolution est quasi nul."},{"t":"Réduire les formations pour dégager du budget : les salariés apprennent sur le terrain","fx":{"bud":2,"eng":-2,"ret":-2},"w":"Vous économisez à court terme. Les salariés voient leur évolution se fermer et partent : le coût de remplacement dépasse l’économie."}],"rep":"L’entretien professionnel (tous les 2 ans) est l’occasion de recueillir les besoins de formation. L’employeur doit aussi assurer l’adaptation des salariés à leur poste."},{"t":"LA RECONNAISSANCE","x":"Les salariés disent peu reconnaître leur travail. Un manager propose un « employé du mois » avec prime de 200 € ; un autre dit qu’un simple merci spécifique coûte moins cher et suffit.","o":[{"t":"Attendre l’entretien annuel pour dire merci, de manière globale","fx":{"eng":-1,"ret":-1},"w":"Une reconnaissance tardive et générale est peu crédible. Les salariés ne savent pas ce qui est valorisé."},{"t":"Installer un rituel de reconnaissance entre pairs, précis et régulier, et former les managers à donner un retour concret","fx":{"eng":1,"ret":1,"per":-1},"rec":true,"w":"La reconnaissance précise et fréquente est un levier puissant et peu coûteux. Elle demande du temps de manager au début, d’où un petit recul de la performance."},{"t":"Créer un « employé du mois » avec une prime de 200 € pour faire naître l’émulation","fx":{"eng":1,"bud":-1,"ret":-1},"w":"Le classement crée des vexés et nuit à la coopération. Une récompense rare et compétitive engage peu de monde."}],"rep":"Reconnaître : précis, rapide, sincère, adapté à la personne. Les dispositifs compétitifs peuvent détruire la coopération."},{"t":"LES DÉPARTS","x":"Trois responsables techniques ont quitté NovaSoft ce semestre. Les entretiens de départ citent « pas de perspective ». Le turn-over atteint 22 %, soit environ 19 départs par an pour 85 salariés.","o":[{"t":"Faire une contre-offre systématique de +15 % à quiconque menace de partir","fx":{"ret":2,"bud":-2,"eng":-1},"w":"Cela retient à court terme mais crée de l’iniquité et incite chacun à négocier par la menace. Le budget salarial dérape."},{"t":"Créer des parcours d’évolution (filière expert et filière manager), publier les postes en interne et planifier les entretiens de carrière","fx":{"ret":2,"per":1},"rec":true,"w":"Vous offrez des perspectives sans dépendre uniquement des promotions managériales. La publication interne retient les talents."},{"t":"Considérer que ces départs sont naturels dans le secteur et ne rien changer","fx":{"ret":-1,"eng":-1},"w":"Sans action, les départs continuent. À 50 % du salaire annuel par départ, ce renoncement coûte environ 390 000 € par an."}],"rep":"Turn-over : 22 % de 85 salariés ≈ 19 départs. À 21 000 € par départ, cela représente environ 390 000 € par an. Le coût d’un départ ne se limite pas au recrutement : perte de savoir-faire, tension sur l’équipe."},{"t":"LA CHARGE DE TRAVAIL","x":"L’absentéisme est à 5,8 %. La squad Alpha enchaîne les sprints sans pause depuis six mois, avec une charge supérieure à sa capacité. Trois personnes ont eu des arrêts courts, plusieurs disent être épuisées.","o":[{"t":"Proposer des séances de yoga et des corbeilles de fruits en maintenant la même charge","fx":{"eng":1,"bud":-1,"per":-1,"ret":-1},"w":"Les avantages appréciés ne compensent pas la surcharge. Les salariés perçoivent un décalage entre le discours et la réalité."},{"t":"Recruter trois personnes supplémentaires en urgence pour absorber la charge","fx":{"per":2,"bud":-2,"eng":-1},"w":"Les recrutements aident, mais l’intégration de trois nouveaux consomme du temps de l’équipe et le coût pèse sur le budget."},{"t":"Revoir la planification sur la capacité réelle avec une marge de 20 %, et reporter ou refuser un projet qui dépasse cette capacité","fx":{"eng":1,"ret":1,"per":-1},"rec":true,"w":"Vous traitez la cause : un surplus de travail sur une capacité fixe. La performance baisse un peu à court terme mais l’épuisement recule."}],"rep":"Les risques psychosociaux se traitent d’abord sur l’organisation (charge, autonomie, soutien). Les actions individuelles (yoga, coaching) sont complémentaires."},{"t":"LE SENS DU TRAVAIL","x":"Beaucoup de salariés disent ne pas comprendre la stratégie de l’entreprise ni leur contribution. Les décisions de la direction sont jugées opaques.","o":[{"t":"Organiser des rencontres trimestrielles avec la direction : stratégie, chiffres, questions ouvertes, et faire relayer par les managers","fx":{"eng":1,"per":1},"rec":true,"w":"La transparence relie le travail quotidien à la stratégie. Les questions ouvertes montrent le respect de la direction."},{"t":"Envoyer une newsletter soignée avec une vidéo de la direction pour expliquer la stratégie","fx":{"eng":1,"bud":-1,"per":-1},"w":"La newsletter est lue en diagonale. Sans échanges, le sentiment d’opacité demeure."},{"t":"Laisser chaque manager relayer à sa façon, sans support commun","fx":{"eng":-1,"per":-1},"w":"Les messages se déforment d’une équipe à l’autre, ce qui nourrit les rumeurs."}],"rep":"Le sens du travail est un levier d’engagement majeur : comprendre le but, le client, l’impact. La transparence ne s’obtient pas par un seul canal."},{"t":"L’INTÉGRATION DES NOUVEAUX","x":"Cinq personnes recrutées l’an dernier sont parties avant la fin de leur première année. Elles disent « ne pas avoir compris ce qu’on attendait » et « avoir été laissées seules ».","o":[{"t":"Mettre en place un parcours d’intégration : parrain, objectifs à 30, 60 et 90 jours, point de suivi à un mois","fx":{"ret":2,"per":1},"rec":true,"w":"Les premiers mois sont décisifs : clarté des attentes, soutien et suivi réduisent fortement les départs précoces."},{"t":"Mettre fin plus vite aux contrats de ceux qui ne s’adaptent pas, en période d’essai","fx":{"ret":-1,"eng":-1},"w":"Vous traitez le symptôme en renforçant la peur chez les autres. Les départs continuent à chaque recrutement."},{"t":"Offrir une prime d’arrivée de 3 000 € pour attirer et retenir les nouveaux","fx":{"ret":1,"bud":-2},"w":"La prime attire, mais ne remplace pas l’accompagnement. Les nouveaux quittent aussi vite s’ils sont perdus."}],"rep":"Un départ en première année coûte souvent plus que l’année de salaire. Un parcours d’intégration est l’un des investissements les plus rentables."},{"t":"LES IRRITANTS","x":"Dans les commentaires libres du baromètre, les mêmes trois irritants reviennent : ordinateurs lents, outil de tickets inutilisable, horaires de réunion inadaptés. Rien d’impossible.","o":[{"t":"Installer un baby-foot et organiser une soirée pour toute l’entreprise","fx":{"eng":1,"bud":-1,"per":-1},"w":"Agréable, mais sans lien avec les causes déclarées. Les irritants demeurent et les salariés s’en agacent."},{"t":"Traiter les trois irritants sous 30 jours, communiquer sur ce qui est fait avec les noms de ceux qui l’avaient signalé","fx":{"eng":2,"per":1},"rec":true,"w":"Les « quick wins » prouvent que les retours sont entendus. Ils créent de la crédibilité pour les actions de fond."},{"t":"Attendre le budget de l’an prochain pour traiter ces sujets de manière globale","fx":{"eng":-1,"ret":-1},"w":"Attendre une réponse globale retarde des actions simples et décourage ceux qui avaient répondu."}],"rep":"Les actions rapides et visibles (« quick wins ») soutiennent la crédibilité du plan d’engagement."},{"t":"L’ÉGALITÉ DE RÉMUNÉRATION","x":"L’analyse montre que, à poste et ancienneté comparables, les rémunérations des 19 femmes sont en moyenne inférieures de 6 % à celles des hommes. L’écart n’est pas expliqué.","o":[{"t":"Attendre la transposition de la directive européenne sur la transparence salariale","fx":{"eng":-1,"ret":-1},"w":"Attendre revient à tolérer un écart injustifié. L’obligation d’égalité de rémunération existe déjà."},{"t":"Annoncer un objectif de féminisation pour montrer l’engagement, sans toucher aux rémunérations","fx":{"eng":1,"ret":-2},"w":"L’annonce sans action est perçue comme de la communication. Les femmes concernées partent, ce qui aggrave la situation."},{"t":"Auditer les rémunérations à poste équivalent, corriger les écarts injustifiés par étapes et publier les critères de rémunération","fx":{"eng":1,"ret":1,"per":-1,"bud":-1},"rec":true,"w":"Corriger un écart injustifié est une obligation légale. Cela renforce la confiance de toutes et de tous, et l’entreprise reste crédible."}],"rep":"L’égalité de rémunération pour un même travail ou un travail de valeur égale est une obligation. L’index de l’égalité professionnelle est obligatoire dès 50 salariés."},{"t":"LA BOUCLE DE RETOUR","x":"Six mois après le premier baromètre, la direction veut savoir si les actions marchent. Un manager propose de refaire la grande enquête dans deux ans ; un autre veut lier la prime des managers au score de leur équipe.","o":[{"t":"Lancer un mini-sondage trimestriel de trois questions, partager les résultats avec les équipes et ajuster les actions","fx":{"eng":1,"ret":1},"rec":true,"w":"Un suivi léger et fréquent permet d’ajuster rapidement. Les salariés voient que leur avis produit des effets."},{"t":"Lier une part de la prime des managers au score d’engagement de leur équipe","fx":{"per":1,"eng":-1,"ret":-1},"w":"Un objectif chiffré sur un indicateur sensible peut conduire à influencer les réponses. Les salariés cessent de dire la vérité."},{"t":"Refaire la grande enquête dans deux ans : il faut laisser le temps aux actions","fx":{"eng":-1,"ret":-1},"w":"Pendant deux ans, personne ne sait si les actions marchent, et les salariés pensent que le sujet est clos."}],"rep":"Suivre l’engagement par de courtes enquêtes fréquentes (pulse surveys) vaut mieux qu’une grande enquête rare. Les indicateurs ne sont plus fiables si on les transforme en objectif de prime."},{"t":"LA RÉORGANISATION MAL ANNONCÉE","x":"Le directeur général annonce en réunion générale une fusion de deux équipes sans en parler au CSE ni aux managers. Les rumeurs courent dans toute l’entreprise et trois personnes demandent un entretien.","o":[{"t":"Ne rien dire en espérant que la rumeur retombe d’elle-même","fx":{"eng":-1,"ret":-1},"w":"Les rumeurs se renforcent. Le silence est lu comme une confirmation des pires hypothèses."},{"t":"Maintenir la décision en expliquant que la réactivité est nécessaire dans un marché difficile","fx":{"per":2,"eng":-2,"ret":-1},"w":"La décision avance mais le non-respect de la consultation expose l’entreprise à un litige, et les salariés perdent confiance."},{"t":"Reconnaître l’erreur de communication, présenter ce qui est décidé et ce qui ne l’est pas, et consulter le CSE avant toute décision","fx":{"eng":1,"ret":1},"rec":true,"w":"L’honnêteté sur l’erreur et le respect de la consultation rétablissent la confiance. Un projet n’est pas une décision."}],"rep":"Avant une réorganisation importante, le CSE (entreprise de 50 salariés ou plus) est informé et consulté avant la décision. La communication précède les rumeurs, pas l’inverse."}],"aleas":[{"t":"Un concurrent débauche deux experts","x":"Une entreprise concurrente propose des salaires plus élevés et attire deux de vos meilleurs développeurs.","fx":{"ret":-2}},{"t":"Un client renouvelle","x":"Un gros client renouvelle son contrat pour trois ans et félicite l’équipe. L’annonce redonne le moral.","fx":{"per":1,"eng":1}},{"t":"Mauvais avis en ligne","x":"Une plateforme d’avis d’employés publie plusieurs commentaires négatifs sur NovaSoft. Les candidats hésitent.","fx":{"eng":-1,"ret":-1}},{"t":"Aide à la formation","x":"Un financement de branche couvre une partie de vos formations de l’année.","fx":{"bud":2}},{"t":"Arrêt maladie de longue durée","x":"Un salarié clé est absent pour plusieurs mois. L’équipe doit absorber sa charge.","fx":{"per":-1,"eng":-1}},{"t":"Intéressement versé","x":"Les résultats de l’an dernier déclenchent une prime d’intéressement. Les salariés sont satisfaits, mais le budget est entamé.","fx":{"eng":1,"bud":-1}}]},"qvt":{"nev":8,"gauges":[{"k":"san","n":"Santé"},{"k":"rel","n":"Climat"},{"k":"aut","n":"Autonomie"},{"k":"per","n":"Performance"}],"start":[5,5,5,7],"roles":[{"n":"Médecin du travail","m":"Tu veux éviter l’épuisement et les arrêts.","f":"san"},{"n":"DRH","m":"Tu veux un bon climat entre les personnes.","f":"rel"},{"n":"Responsable du Support","m":"Tu dois tenir les délais clients avec ton équipe.","f":"per"},{"n":"Élue du CSE","m":"Tu défends la marge de manœuvre des salariés.","f":"aut"},{"n":"Directeur général","m":"Tu dois tenir les résultats de l’entreprise.","f":"per"}],"events":[{"t":"LE DOCUMENT UNIQUE","x":"NovaSoft a 85 salariés, un absentéisme à 5,8 % et aucun document unique d’évaluation des risques. L’inspection du travail pourrait le demander. Un manager dit que c’est « de la paperasse ».","o":[{"t":"Faire rédiger le document par un cabinet extérieur, sans impliquer les équipes, pour gagner du temps","fx":{"per":1,"aut":-1,"rel":-1},"w":"La conformité est rapide, mais le document décrit mal la réalité et n’engage personne. Les salariés se sentent mis à l’écart."},{"t":"Élaborer le document unique avec des représentants des équipes et le CSE, inclure les risques psychosociaux et fixer un plan d’action daté","fx":{"san":1,"aut":1},"rec":true,"w":"Le document unique est obligatoire. Le construire avec les équipes améliore le diagnostic. Il demande du temps, d’où un petit recul de la performance."},{"t":"Attendre un contrôle ou un accident du travail pour s’en occuper","fx":{"san":-1,"rel":-1},"w":"L’employeur est responsable de la prévention. L’absence de document est sanctionnée et fragilise la défense en cas d’accident."}],"rep":"Le DUERP est obligatoire dès le premier salarié, mis à jour au moins une fois par an à partir de 11 salariés, et recense aussi les risques psychosociaux."},{"t":"LE PIC DE TICKETS","x":"L’équipe Support traite deux fois plus de tickets qu’en temps normal depuis trois semaines. Plusieurs personnes finissent à 20 h, deux sont en arrêt court, et le taux d’erreur augmente.","o":[{"t":"Prioriser les tickets, lisser la charge avec des renforts temporaires, reporter les projets non urgents et fixer une capacité maximale","fx":{"san":2,"per":-1},"rec":true,"w":"Vous agissez sur la cause : la charge. La performance recule un peu à court terme, mais la qualité et la santé se rétablissent."},{"t":"Proposer des séances de méditation du midi tout en maintenant la charge actuelle","fx":{"rel":1,"san":-1,"per":-2},"w":"Les séances sont bien vues mais la charge reste excessive. Les salariés perçoivent un décalage entre le discours et la réalité."},{"t":"Demander à l’équipe de tenir encore trois semaines, avec une prime exceptionnelle à la clé","fx":{"per":2,"san":-2,"rel":-1},"w":"La prime est appréciée mais elle ne compense pas l’épuisement. Les arrêts augmentent et le taux d’erreur aussi."}],"rep":"Le modèle de Karasek : une forte demande avec peu de latitude et peu de soutien est la combinaison la plus risquée pour la santé. On agit d’abord sur l’organisation."},{"t":"LA DÉCONNEXION","x":"Des messages professionnels arrivent régulièrement le soir et le week-end, y compris de la direction. Plusieurs salariés disent ne plus décrocher. Un manager répond : « Personne n’oblige personne à répondre. »","o":[{"t":"Interdire tout message après 19 h, sans exception ni dérogation","fx":{"san":2,"per":-2,"aut":-1},"w":"La règle protège les salariés mais bloque les urgences réelles et les équipes internationales. Elle est vite contournée."},{"t":"Laisser chacun gérer sa disponibilité en fonction de ses besoins","fx":{"san":-1,"rel":-1},"w":"Sans règle, la norme implicite devient la disponibilité permanente, et les plus consciencieux s’épuisent."},{"t":"Négocier avec le CSE une charte de déconnexion : règles d’usage, exemplarité des managers et possibilité de différer l’envoi","fx":{"san":1,"rel":1},"rec":true,"w":"Une règle claire et partagée vaut mieux qu’une bonne volonté diffuse. L’exemple des managers est déterminant."}],"rep":"Le droit à la déconnexion fait partie de la négociation sur l’égalité professionnelle et la qualité de vie au travail ; à défaut d’accord, l’employeur élabore une charte après avis du CSE."},{"t":"UN SIGNALEMENT DE HARCÈLEMENT","x":"Une salariée écrit au DRH : un collègue lui adresse des remarques humiliantes depuis trois mois, devant l’équipe. Plusieurs collègues confirment « avoir remarqué ». Le collègue est apprécié par la direction.","o":[{"t":"Attendre une plainte formelle ou des preuves écrites avant de réagir","fx":{"san":-1,"rel":-1},"w":"L’employeur doit agir dès qu’il est informé. Attendre des preuves aggrave la situation et engage sa responsabilité."},{"t":"Muter discrètement la salariée dans un autre service pour apaiser la situation","fx":{"rel":1,"san":-2,"aut":-1},"w":"Elle est déplacée alors que c’est elle qui a signalé : c’est vécu comme une sanction et dissuade les futurs signalements."},{"t":"Ouvrir une enquête rapide et impartiale, protéger la salariée pendant l’enquête et rappeler les règles à toute l’équipe","fx":{"rel":1,"san":1},"rec":true,"w":"L’employeur a l’obligation de prévenir et de faire cesser le harcèlement. Une enquête impartiale protège toutes les personnes concernées."}],"rep":"Obligation de sécurité (L4121-1) : prévenir, enquêter, protéger, sanctionner. Le harcèlement moral est interdit (L1152-1), l’employeur doit prendre toutes les mesures nécessaires."},{"t":"LE CONTRÔLE DES HEURES","x":"Un manager demande à son équipe de saisir son activité par tranches de 15 minutes et de rendre compte chaque soir. Les salariés se sentent surveillés. Deux ont dit qu’ils envisagent de partir.","o":[{"t":"Passer du contrôle des heures au pilotage par objectifs, avec des points hebdomadaires sur les résultats et les obstacles","fx":{"aut":2,"per":-1},"rec":true,"w":"Plus d’autonomie sur la manière, plus de clarté sur le résultat. Le temps de transition coûte un peu de performance."},{"t":"Installer un logiciel de suivi de l’activité pour avoir une vision précise du travail de chacun","fx":{"per":2,"aut":-2,"rel":-1},"w":"Vous obtenez des données mais détruisez la confiance. Le logiciel nécessite en plus l’information-consultation du CSE et une conformité RGPD."},{"t":"Ne rien changer : le contrôle fonctionne et les résultats sont là","fx":{"aut":-1,"rel":-1},"w":"La performance se maintient à court terme, mais la défiance s’installe et les meilleurs partent."}],"rep":"L’autonomie est un facteur de protection (Karasek). Le contrôle excessif de l’activité réduit la latitude et le sentiment de confiance."},{"t":"LA RECONNAISSANCE","x":"Dans l’enquête de climat, 62 % des répondants disent ne pas se sentir reconnus. Un manager propose une grande soirée d’entreprise ; un autre dit qu’un retour régulier et précis suffirait.","o":[{"t":"Attendre l’entretien annuel pour reconnaître le travail de l’année","fx":{"rel":-1,"aut":-1},"w":"Une reconnaissance tardive et globale ne se confond pas avec le soutien quotidien dont les salariés ont besoin."},{"t":"Instaurer des points individuels réguliers et valoriser des contributions précises, en public ou en privé selon la personne","fx":{"rel":1,"aut":1},"rec":true,"w":"La reconnaissance du travail réel est un facteur de protection (Siegrist : équilibre efforts-récompenses). Elle coûte peu et se renouvelle."},{"t":"Organiser une soirée d’entreprise avec animation et traiteur pour marquer le coup","fx":{"rel":2,"per":-2,"san":-1},"w":"L’événement est apprécié le soir même. Il ne répond pas au manque de reconnaissance du travail quotidien et mobilise du temps."}],"rep":"Modèle de Siegrist : le déséquilibre entre efforts fournis et récompenses reçues (reconnaissance, salaire, perspectives) est un facteur de risque pour la santé."},{"t":"L’OPEN SPACE BRUYANT","x":"Quarante personnes travaillent dans un open space bruyant : appels clients, réunions improvisées. Plusieurs se plaignent de maux de tête et de difficultés de concentration.","o":[{"t":"Passer tout le monde en télétravail cinq jours sur cinq pour supprimer le bruit","fx":{"san":2,"rel":-2,"per":-1},"w":"Le bruit disparaît mais l’isolement et la perte de lien s’installent, notamment pour les nouveaux."},{"t":"Co-concevoir avec l’équipe des zones calmes, des cabines d’appel et des règles de bruit, puis tester un mois","fx":{"per":1,"san":1,"aut":1,"rel":-1},"rec":true,"w":"Les salariés sont les mieux placés pour décrire leur gêne. Les règles de bruit demandent un effort de discipline au départ."},{"t":"Distribuer des bouchons d’oreilles et des casques de bruit à ceux qui le demandent","fx":{"san":-1,"per":-1},"w":"Le geste traite le symptôme de façon individuelle sans changer l’organisation du bruit."}],"rep":"La prévention se hiérarchise : supprimer le risque, le réduire à la source, agir collectivement, et seulement ensuite protéger individuellement."},{"t":"L’ISOLEMENT À DISTANCE","x":"Depuis le passage à trois jours de télétravail, plusieurs salariés disent se sentir isolés. Les nouveaux ont peu de contacts, certains évitent d’allumer la caméra.","o":[{"t":"Considérer que l’isolement est un choix personnel de certains salariés","fx":{"rel":-1,"san":-1},"w":"L’isolement est un risque organisationnel et non un choix individuel : le manager doit le prévenir."},{"t":"Rendre la présence obligatoire cinq jours par semaine pour rétablir l’ambiance d’avant","fx":{"rel":1,"aut":-2,"per":-1},"w":"La présence redonne du lien, mais retire l’autonomie que beaucoup ont gagnée. Certains partent."},{"t":"Créer des rituels : points d’équipe, deux jours de présence collective, parrainage, entretiens individuels réguliers","fx":{"rel":1,"san":1},"rec":true,"w":"Le lien se construit par des rituels réguliers et des temps de présence communs. Le soutien social est un facteur de protection."}],"rep":"Le soutien social (collègues et hiérarchie) atténue l’effet des fortes exigences de travail. À distance, il demande des rituels explicites."},{"t":"LE RETOUR DE SAM","x":"Sam revient après quatre mois d’arrêt pour épuisement. Il est motivé mais fragile. La charge de son ancien poste est restée inchangée. Son manager dit : « Le mieux, c’est qu’il reprenne comme avant. »","o":[{"t":"Organiser la visite de reprise, un entretien de retour, une reprise progressive des tâches et un point tous les quinze jours","fx":{"san":1,"rel":1},"rec":true,"w":"Une reprise cadrée évite la rechute. La performance de l’équipe est un peu moindre au début."},{"t":"Le remettre à 100 % tout de suite : le travail est la meilleure thérapie","fx":{"per":2,"san":-2,"rel":-1},"w":"La charge est absorbée mais le risque de rechute est élevé. L’équipe voit que le retour n’est pas pris en compte."},{"t":"Ne pas évoquer l’arrêt pour ne pas le mettre mal à l’aise","fx":{"rel":-1,"san":-1},"w":"Le silence peut être vécu comme un tabou ou un manque d’attention. Sam a besoin de savoir comment le retour sera organisé."}],"rep":"Après un arrêt maladie de plus de 60 jours, une visite de reprise auprès du médecin du travail est obligatoire. Une visite de pré-reprise peut préparer le retour."},{"t":"LE CONFLIT DE VALEURS","x":"La direction demande au Support d’orienter les clients vers une offre plus chère, même quand elle n’est pas adaptée. Plusieurs salariés disent « trahir leurs clients » et s’en plaignent au manager.","o":[{"t":"Écouter l’équipe, vérifier les pratiques de vente, reformuler l’objectif (satisfaction et vente pertinente) et alerter la direction sur les effets","fx":{"aut":1,"rel":1},"rec":true,"w":"Le conflit de valeurs est un risque psychosocial. Reconnaître le problème et le remonter permet de le traiter à la source."},{"t":"Laisser chacun gérer sa conscience : ce n’est pas un sujet de management","fx":{"rel":-1,"aut":-1},"w":"Le conflit de valeurs est un facteur de risque reconnu. L’ignorer le renforce."},{"t":"Rappeler que les ventes priment et que c’est le métier du Support","fx":{"per":2,"rel":-2,"san":-1},"w":"Les ventes progressent à court terme. Les salariés vivent un conflit entre ce qu’on leur demande et ce qu’ils jugent juste, ce qui use et fait partir."}],"rep":"Parmi les six dimensions de risques psychosociaux (rapport Gollac) figurent les conflits de valeurs : faire un travail que l’on juge contraire à ses principes."},{"t":"LA RUMEUR DE SUPPRESSIONS","x":"Une rumeur circule : « La direction prépare des suppressions de postes. » Rien n’est décidé mais plusieurs salariés dorment mal et deux cherchent ailleurs.","o":[{"t":"Démentir catégoriquement toute suppression, même sans être certain de l’avenir","fx":{"per":2,"rel":-2,"san":-1},"w":"La rumeur retombe un temps. Si la situation change, la direction perd toute crédibilité."},{"t":"Communiquer rapidement et honnêtement sur ce qui est étudié et ce qui ne l’est pas, consulter le CSE et annoncer un calendrier d’information","fx":{"san":1,"rel":1},"rec":true,"w":"L’insécurité de la situation est un facteur de risque. Une information honnête et régulière la réduit."},{"t":"Ne rien dire : commenter alimenterait la rumeur","fx":{"san":-1,"rel":-1},"w":"Le silence laisse la place à l’imagination. Les salariés présument le pire."}],"rep":"L’insécurité de l’emploi est l’un des facteurs de risque psychosocial. Un projet de suppression est soumis à information et consultation du CSE avant toute décision."},{"t":"LE MANAGER SOUS PRESSION","x":"Le responsable du Support dit qu’il n’en peut plus : il gère l’équipe, les clients et les reportings de la direction. Il est irritable avec son équipe, qui commence à l’éviter.","o":[{"t":"Lui dire que le rôle de manager est de supporter la pression","fx":{"san":-1,"aut":-1},"w":"On nie un problème réel. Le manager se sent seul et risque l’arrêt."},{"t":"Lui demander de montrer l’exemple en travaillant davantage pour rassurer l’équipe","fx":{"per":2,"san":-2,"rel":-1},"w":"La production progresse un moment, mais l’exemple est celui de l’épuisement et la pression redescend sur l’équipe."},{"t":"Alléger son périmètre (reporting simplifié, renfort administratif), le former au management et l’orienter vers un réseau de pairs ou un coaching","fx":{"san":1,"rel":1},"rec":true,"w":"Un manager épuisé transmet la pression à son équipe. Le soutenir est une action de prévention pour tous."}],"rep":"Les managers de proximité sont à la fois exposés aux risques psychosociaux et acteurs de la prévention. Les soutenir fait partie de la démarche."},{"t":"LE BAROMÈTRE QVT","x":"La direction souhaite mesurer le climat de travail. Un manager propose un questionnaire de stress individuel avec suivi des scores par personne ; un autre une enquête anonyme avec restitution collective.","o":[{"t":"Lancer une enquête anonyme avec restitution collective, impliquer les équipes dans le plan d’actions et refaire une mesure à six mois","fx":{"rel":1,"aut":1},"rec":true,"w":"L’anonymat favorise l’honnêteté. L’analyse collective cible l’organisation, pas les individus."},{"t":"Faire remplir un questionnaire de stress individuel et suivre l’évolution des scores de chaque salarié","fx":{"san":1,"aut":-2,"rel":-1},"w":"Ce suivi individuel nominatif pose des questions de confidentialité (données de santé) et réduit la confiance."},{"t":"Reporter l’enquête à l’an prochain, après le gros projet en cours","fx":{"san":-1,"rel":-1},"w":"Reporter revient à ne pas mesurer au moment où le besoin est le plus fort."}],"rep":"Un diagnostic collectif et anonyme est préférable à un suivi individuel. Les données de santé sont sensibles et relèvent du médecin du travail."},{"t":"LES HORAIRES","x":"Plusieurs salariés demandent plus de souplesse dans leurs horaires (garde d’enfants, trajets). La direction craint de perdre la coordination des équipes.","o":[{"t":"Laisser chacun arranger ses horaires avec son manager au cas par cas, sans règle commune","fx":{"aut":1,"rel":-1,"per":-1,"san":-1},"w":"L’autonomie progresse un peu, mais l’inégalité perçue entre équipes crée des tensions."},{"t":"Imposer des horaires identiques et stricts pour tout le monde, pour des raisons d’équité","fx":{"per":1,"aut":-2,"san":-1},"w":"La coordination est simple, mais la rigidité ignore les contraintes personnelles et pèse sur l’engagement."},{"t":"Négocier des horaires avec plages fixes de présence communes et plages libres, et en évaluer l’effet à six mois","fx":{"aut":1,"san":1,"rel":1,"per":-1},"rec":true,"w":"Un cadre souple répond à des besoins variés tout en préservant la coordination. La mise en place coûte un peu de performance."}],"rep":"La conciliation vie professionnelle et vie personnelle est un levier de QVT. Une règle commune évite la perception d’arbitraire."}],"aleas":[{"t":"Canicule","x":"Une vague de chaleur rend les locaux difficilement tenables pendant plusieurs jours.","fx":{"san":-1,"per":-1}},{"t":"Fin d’un gros projet","x":"Le projet qui mobilisait tout le monde est livré avec succès. L’équipe respire.","fx":{"per":1,"san":1}},{"t":"Épidémie de grippe","x":"Un quart de l’équipe est absent la même semaine. Le travail s’accumule.","fx":{"san":-2}},{"t":"Une médiation réussie","x":"Un désaccord ancien entre deux collègues se règle grâce à une médiation interne. L’ambiance s’améliore.","fx":{"rel":1,"aut":1}},{"t":"Nouveau chef de service","x":"Un nouveau responsable arrive avec un style très directif. Les habitudes sont bousculées.","fx":{"aut":-1,"rel":-1}},{"t":"Contrôle de l’inspection du travail","x":"L’inspection du travail passe, constate que les dispositions de prévention sont en place et félicite l’effort.","fx":{"san":1,"rel":1}}]},"rse":{"nev":8,"gauges":[{"k":"cli","n":"Climat"},{"k":"soc","n":"Social"},{"k":"fin","n":"Finances"},{"k":"rep","n":"Réputation"}],"start":[4,5,6,5],"roles":[{"n":"Responsable RSE","m":"Tu veux une trajectoire carbone réelle.","f":"cli"},{"n":"DRH","m":"Tu veux que la transition soit juste pour les salariés.","f":"soc"},{"n":"Directeur financier","m":"Tu dois garder des finances saines.","f":"fin"},{"n":"Directrice commerciale","m":"Tu protèges l’image auprès des clients.","f":"rep"},{"n":"Élu du CSE","m":"Tu défends les conditions de travail.","f":"soc"}],"events":[{"t":"LE BILAN CARBONE","x":"NovaSoft (85 salariés) veut connaître son empreinte. Un consultant propose de ne mesurer que l’électricité des bureaux ; un autre un bilan complet incluant les achats, les déplacements et l’usage des produits.","o":[{"t":"Ne mesurer que l’électricité des bureaux, simple et peu coûteuse","fx":{"fin":1,"cli":-1,"rep":-1},"w":"Le bilan est rapide mais il montre une image trompeuse : l’essentiel des émissions est ailleurs."},{"t":"Réaliser un bilan couvrant les trois périmètres, y compris achats, déplacements et numérique, et en tirer trois priorités chiffrées","fx":{"cli":2},"rec":true,"w":"Le périmètre 3 pèse souvent plus de 70 % de l’empreinte d’une entreprise de services. Ne pas le mesurer, c’est passer à côté de l’essentiel."},{"t":"Reporter le bilan à plus tard, quand les clients le demanderont","fx":{"fin":1,"cli":-1,"rep":-1},"w":"On attend une contrainte pour agir ; la réponse aux appels d’offres devient plus difficile."}],"rep":"Scope 1 : émissions directes. Scope 2 : énergie achetée. Scope 3 : toutes les autres, en amont et en aval. Le bilan réglementaire (BEGES) concerne les entreprises de plus de 500 salariés, mais la démarche est utile à toute taille."},{"t":"LES DÉPLACEMENTS","x":"Les déplacements en avion pour les clients représentent 40 % des émissions de NovaSoft. Les commerciaux disent que la présence physique est décisive pour signer.","o":[{"t":"Interdire tout déplacement en avion immédiatement, sans exception","fx":{"cli":2,"rep":-2,"fin":-1,"soc":-1},"w":"La mesure est radicale et fait perdre des contrats. Elle est mal vécue par les équipes commerciales."},{"t":"Compenser les vols avec des crédits carbone et continuer comme avant","fx":{"rep":1,"cli":-1,"fin":-1},"w":"La compensation ne remplace pas la réduction. Elle coûte et laisse l’empreinte réelle inchangée."},{"t":"Fixer des règles de voyage : visio par défaut, train pour les trajets de moins de 4 heures et avion avec accord pour les cas justifiés","fx":{"cli":2,"fin":1,"rep":-1},"rec":true,"w":"Éviter puis réduire : on supprime les trajets inutiles et on change de mode. Une partie des clients regrette la présence mais l’économie est réelle."}],"rep":"Hiérarchie éviter, réduire, compenser : la compensation vient en dernier, pour les émissions résiduelles seulement."},{"t":"LE MESSAGE « NEUTRE EN CARBONE »","x":"Le marketing veut afficher « produit neutre en carbone » sur la nouvelle offre, en s’appuyant sur l’achat de quelques crédits carbone.","o":[{"t":"Renoncer à la mention, publier le bilan réel, la trajectoire de réduction et les crédits achetés avec leur nature","fx":{"rep":1,"cli":1},"rec":true,"w":"Une communication précise et vérifiable protège l’entreprise. Elle est moins spectaculaire mais plus crédible."},{"t":"Afficher « neutre en carbone » : tout le marché le fait","fx":{"rep":2,"fin":1,"cli":-1,"soc":-2},"w":"La mention est risquée : la loi Climat et Résilience encadre strictement l’usage de ce type d’allégation. Les écarts sont sanctionnés et la réputation peut s’effondrer."},{"t":"Utiliser un slogan vague, « nous prenons soin de la planète », sans chiffre","fx":{"rep":-1,"cli":-1},"w":"Un message vague n’apporte rien et fait douter. Les clients attendent des preuves."}],"rep":"L’écoblanchiment (greenwashing) : toute allégation environnementale doit être justifiée et vérifiable. L’allégation « neutre en carbone » est encadrée par la loi."},{"t":"LE NUMÉRIQUE","x":"NovaSoft stocke des téraoctets de données jamais consultées et renouvelle les ordinateurs tous les 3 ans. Le DSI estime que le numérique pèse un quart de l’empreinte.","o":[{"t":"Ne rien changer : le numérique n’est pas un sujet prioritaire","fx":{"cli":-1,"fin":1,"rep":-1},"w":"Le numérique représente une part significative de l’empreinte et son poids augmente."},{"t":"Acheter des équipements neufs à haute performance énergétique pour tous","fx":{"cli":-1,"fin":-2,"soc":1},"w":"L’efficacité énergétique est utile mais la fabrication d’un équipement neuf émet beaucoup. Le gain est annulé."},{"t":"Allonger la durée de vie du matériel à 5 ans, acheter reconditionné quand c’est possible et nettoyer les données inutiles","fx":{"cli":2,"fin":1},"rec":true,"w":"La fabrication des équipements est la principale source d’émissions du numérique. Allonger leur vie est le levier le plus efficace, au prix de machines parfois moins récentes."}],"rep":"Pour le numérique, 70 à 80 % de l’empreinte vient de la fabrication des équipements, pas de leur usage. Le levier principal est d’en acheter moins."},{"t":"LA CANTINE","x":"La cantine sert de la viande à tous les repas. Un groupe de salariés demande plus de repas végétariens ; d’autres craignent qu’on leur impose un régime.","o":[{"t":"Proposer un menu végétarien attractif tous les jours, des produits de saison et locaux, et recueillir l’avis des convives","fx":{"cli":1,"soc":1},"rec":true,"w":"L’offre végétarienne par défaut réduit l’empreinte sans imposer. La qualité et la concertation font l’adhésion."},{"t":"Supprimer la viande de la cantine dès la semaine prochaine","fx":{"cli":2,"soc":-2,"rep":-1},"w":"L’impact climat est réel mais la mesure imposée crée du rejet et un effet boomerang."},{"t":"Laisser la cantine telle quelle : chacun mange ce qu’il veut","fx":{"soc":1,"cli":-1,"rep":-1},"w":"La liberté est préservée, mais l’entreprise ne s’engage sur rien et manque une occasion d’agir."}],"rep":"Cause à effet : l’alimentation pèse lourdement dans l’empreinte, mais les changements acceptés sont ceux qui sont proposés et non imposés."},{"t":"LES FOURNISSEURS","x":"NovaSoft achète des services et du matériel auprès de 120 fournisseurs. Le plus bas prix vient d’un fournisseur qui ne publie aucune donnée sur ses conditions de production.","o":[{"t":"Exiger du fournisseur un audit complet coûteux avant toute commande","fx":{"fin":-1,"soc":-1},"w":"L’exigence est légitime mais disproportionnée pour ce volume d’achat. Elle bloque les commandes sans améliorer la situation."},{"t":"Intégrer des critères sociaux et environnementaux dans les appels d’offres, demander des preuves et accompagner les fournisseurs clés","fx":{"cli":1,"soc":1,"rep":1},"rec":true,"w":"Les achats sont le premier levier du périmètre 3. Les critères et le dialogue font progresser la chaîne. Le prix peut être un peu plus élevé."},{"t":"Choisir le fournisseur le moins cher pour préserver la marge","fx":{"fin":2,"cli":-1,"soc":-1,"rep":-1},"w":"L’économie est immédiate. Mais le risque de réputation et de rupture dans la chaîne d’approvisionnement augmente."}],"rep":"Les achats représentent souvent plus de la moitié de l’empreinte d’une entreprise de services. Le dialogue avec les fournisseurs est un levier décisif."},{"t":"LA VOITURE DE FONCTION","x":"Un tiers des salariés ont une voiture de fonction thermique. Les commerciaux craignent de perdre un avantage ; la direction cherche à réduire les émissions et les coûts.","o":[{"t":"Remplacer toutes les voitures par des modèles électriques d’ici trois mois","fx":{"cli":2,"fin":-2,"soc":-1},"w":"Le gain climat est net mais le rythme et l’investissement sont lourds. Certains ne peuvent pas recharger chez eux."},{"t":"Proposer un budget mobilité au choix : véhicule électrique, vélo, transports en commun, avec une période de transition et une aide à la borne","fx":{"cli":1,"soc":1},"rec":true,"w":"L’avantage devient un choix. La transition est progressive et accompagnée, avec un coût d’accompagnement."},{"t":"Supprimer les voitures de fonction sans compensation","fx":{"fin":2,"cli":1,"soc":-2,"rep":-1},"w":"L’économie est forte mais la perte d’avantage est mal vécue. Les commerciaux partent."}],"rep":"Une transition juste associe les per /* ===================================================== Connexion (PeerJS : l'animateur est le point central) */
const qs = new URLSearchParams(location.search);
let PO;
(function(){ const h=qs.get('peerhost'); if(h && /^(localhost|127\.0\.0\.1)(:\d+)?$/.test(h)){ const a=h.split(':'); PO={host:a[0],port:+(a[1]||9000),path:'/',secure:false}; } })();
const hasPeer = typeof Peer !== 'undefined';
let ROLE=null, VIEW='hub';
function Host(code,onMsg,onClose){
  const conns={}, peer=new Peer('BH-'+code,PO);
  const ready=new Promise((ok,ko)=>{ peer.on('open',ok); peer.on('error',ko); });
  peer.on('connection',c=>{ c.on('open',()=>{ conns[c.peer]=c; }); c.on('data',d=>onMsg(c.peer,d)); c.on('close',()=>{ delete conns[c.peer]; onClose(c.peer); }); });
  return {ready, send:(to,m)=>{ const c=conns[to]; if(c&&c.open) c.send(m); }, broadcast:m=>Object.values(conns).forEach(c=>{ if(c.open) c.send(m); }), destroy:()=>{ try{peer.destroy()}catch(e){} }};
}
function Client(code,onMsg,onLost){
  const peer=new Peer(undefined,PO); let c=null;
  const ready=new Promise((ok,ko)=>{
    peer.on('open',()=>{ c=peer.connect('BH-'+code,{reliable:true}); c.on('open',ok); c.on('data',onMsg); c.on('close',onLost); c.on('error',ko); });
    peer.on('error',ko); setTimeout(()=>ko({type:'timeout'}),12000);
  });
  return {ready, send:m=>{ if(c&&c.open) c.send(m); }, destroy:()=>{ try{peer.destroy()}catch(e){} }};
}
const BASE = location.origin+location.pathname;

const P = {pid:null,name:'',code:'',g:null,e:null,q:0,st:null,hist:[],sel:null,seenR:null,cli:null,lost:false};
let retryT=null;
function viewJoin(prefill,g){
  VIEW='join';
  const sv=ls('bh-player')||{};
  const code0=(prefill||qs.get('room')||sv.code||'').toUpperCase().slice(0,4);
  $('#app').innerHTML='<div class="wrap">'+brand('<button class="btn ghost sm" id="back">Retour</button>')+
   '<div class="card col"><h2>Rejoindre une partie</h2>'+
   '<label class="f">Code affiché chez l’animateur<input type="text" id="code" maxlength="4" autocapitalize="characters" autocomplete="off" value="'+esc(code0)+'" style="text-transform:uppercase;letter-spacing:.3em;text-align:center"></label>'+
   '<label class="f">Ton prénom<input type="text" id="nm" maxlength="18" autocomplete="given-name" value="'+esc(sv.name||'')+'"></label>'+
   '<p class="err" id="je" hidden></p><button class="btn block" id="go">Rejoindre</button></div></div>';
  $('#back').onclick=()=>g?viewGame(g):viewHub();
  $('#go').onclick=()=>{
    const code=$('#code').value.trim().toLowerCase(), name=$('#nm').value.trim();
    if(code.length!==4||!name){ const e=$('#je'); e.hidden=false; e.textContent='Entre le code à 4 caractères et ton prénom.'; return; }
    $('#go').disabled=true; $('#go').textContent='Connexion…';
    P.name=name; P.code=code;
    try{ P.pid=sessionStorage.getItem('bh-pid')||rid(6); sessionStorage.setItem('bh-pid',P.pid); }catch(e){ P.pid=P.pid||rid(6); }
    ls('bh-player',{code,name});
    P.e=null; P.q=0; P.st=null; P.hist=[]; P.sel=null; P.seenR=null; P.g=null;
    connectPlayer(true);
  };
}
function connectPlayer(first){
  P.lost=false;
  if(P.cli){ P.cli.destroy(); }
  const cli=Client(P.code,m=>{ if(m && m.t==='state') onState(m); },()=>{ if(P.cli!==cli||ROLE!=='player') return; P.lost=true; renderPlayer(); scheduleRetry(); });
  P.cli=cli;
  cli.ready.then(()=>{ ROLE='player'; cli.send({t:'hello',pid:P.pid,name:P.name}); if(P.sel!=null) sendVote(); renderPlayer(); },e=>{
    if(first){
      const el=$('#je'); if(!el) return;
      el.hidden=false; el.textContent=(e&&e.type==='peer-unavailable')?'Code inconnu. Vérifie le code affiché chez l’animateur.':'Connexion impossible. Vérifie le réseau (le partage de connexion de l’animateur peut aider) ou demande le mode « un seul écran ».';
      const g=$('#go'); if(g){ g.disabled=false; g.textContent='Rejoindre'; }
    } else scheduleRetry();
  });
}
function scheduleRetry(){ clearTimeout(retryT); retryT=setTimeout(()=>{ if(ROLE==='player'&&P.lost) connectPlayer(false); },3000); }
function leavePlayer(){ clearTimeout(retryT); if(P.cli) P.cli.destroy(); P.cli=null; ROLE=null; P.st=null; viewHub(); }
function onState(s){
  if(!s || typeof s!=='object') return;
  if(s.e!==P.e){ P.e=s.e; P.q=0; P.hist=[]; P.sel=null; P.seenR=null; }
  if(s.q<=P.q) return; P.q=s.q;
  P.g=s.g;
  const prevR = P.st ? P.st.r : null, prevPh = P.st ? P.st.ph : null;
  P.st=s;
  if(s.ph==='vote' && (s.r!==prevR || prevPh!=='vote')){ P.sel=null; }
  if((s.ph==='reveal'||s.ph==='result') && P.seenR!==s.r){ P.seenR=s.r; P.hist.push({i:s.sid,r:s.r,rows:s.rv||[],fin:s.fin}); }
  renderPlayer();
}
function myRow(){ const rv=(P.st&&P.st.rv)||[]; return rv.find(r=>r[0]===P.pid); }
function nameOf(st,id){ const x=(st.ro||[]).find(r=>r[0]===id); return x?x[1]:'?'; }
function idxOf(st,id){ const i=(st.ro||[]).findIndex(r=>r[0]===id); return i<0?0:i; }
function setChoice(k){ P.sel=k; sendVote(); renderPlayer(); }

      '<div class="card col"><h3 style="font-size:20px">Points personnels</h3>'+(st.sc||[]).map(r=>'<div class="pr">'+swatch(idxOf(st,r[0]))+'<span class="nm">'+esc(nameOf(st,r[0]))+'</span><b>+'+r[1]+'</b></div>').join('')+'</div>';

/* ===================================================== Animateur (et mode un seul écran) */
let G=null, H=null, REM={}, PEERPID={};
const LOCAL_ONLY = ()=>ROLE==='local';
function newGame(code,g){
  const o={e:rid(6),q:0,code,g,ph:'lobby',locals:[],order:[],names:{},act:null,sid:null,r:0,deck:[],hist:[],votes:{},rv:null};
  if(gameOf(g).moteur==='comite'){ const C=CONTENT[g]; o.ga=C.start.slice(); o.pg=null; o.ev=0; o.rl={}; o.sc={}; o.bonus={}; o.zero=false; o.al=[]; o.log=[]; }
  return o;
}
function openHost(code){
  return new Promise((ok,ko)=>{ let n=0;
    const go=()=>{ const h=Host(code,onClientMsg,onClientClose);
      h.ready.then(()=>ok(h),e=>{ h.destroy(); if(e&&e.type==='unavailable-id'&&n++<6) setTimeout(go,2500); else ko(e); }); };
    go(); });
}
async function startHost(gid,local){
  ROLE = local?'local':'host';
  const saved = ls('bh-host');
  if(saved && saved.ph!=='end' && saved.g===gid && !!saved.local===!!local){
    VIEW='resume';
    $('#app').innerHTML='<div class="wrap">'+brand()+'<div class="card col"><h2>Une partie est en cours</h2><p class="muted">Code '+esc(saved.code.toUpperCase())+' · '+saved.hist.length+' tour(s) joué(s).</p>'+
      '<button class="btn block" id="rs">Reprendre la partie</button><button class="btn block ghost" id="nw">Nouvelle partie</button></div></div>';
    $('#rs').onclick=()=>begin(saved); $('#nw').onclick=()=>{ ls('bh-host',null); begin(null); };
    return;
  }
  begin(null);
  async function begin(sv){
    G = sv || newGame(rid(4),gid);
    G.local=!!local; REM={}; PEERPID={};
    if(!local){
      $('#app').innerHTML='<div class="wrap">'+brand()+'<div class="card"><h2>Connexion…</h2></div></div>';
      try{ H=await openHost(G.code); }
      catch(e){
        $('#app').innerHTML='<div class="wrap">'+brand()+'<div class="card col"><h2>Connexion impossible</h2><p class="err">Le service de mise en relation des téléphones ne répond pas ('+esc((e&&e.type)||'erreur')+'). Essayez le partage de connexion d’un téléphone, ou jouez sur un seul écran.</p>'+
          '<button class="btn block" id="rt">Réessayer</button><button class="btn block ghost" id="lc">Un seul écran</button></div></div>';
        $('#rt').onclick=()=>startHost(gid,false); $('#lc').onclick=()=>{ ROLE='local'; startHost(gid,true); };
        return;
      }
    }
    persist(); hostRender(); emitState();
  }
}
function persist(){ if(G) ls('bh-host',G); }
function onClientMsg(peerId,m){
  if(!G||!m||typeof m!=='object') return;
  if(m.t==='hello'){
    const pid=String(m.pid||'').slice(0,12), name=String(m.name||'').trim().slice(0,18);
    if(!pid||!name) return;
    PEERPID[peerId]=pid;
    REM[pid]={name,here:true,peer:peerId,vote:(REM[pid]&&REM[pid].vote)||null};
    if(G.order.indexOf(pid)<0 && G.ph==='lobby') G.order.push(pid);
    if(G.order.indexOf(pid)>=0) G.names[pid]=name;
    emitState(); refreshHost();
  } else if(m.t==='vote'){
    const pid=PEERPID[peerId]; if(!pid||!REM[pid]) return;
    const n=gameOf(G.g).moteur==='choix'?CONTENT[G.g].cards[G.sid||0].o.length:4;
    const s=(Number.isInteger(m.s)&&m.s>=0&&m.s<n)?m.s:null;
    REM[pid].vote = s!=null ? {s,rnd:String(m.rnd||'')} : null;
    if(G.ph==='vote') updateVotes();
  }
}
function onClientClose(peerId){
  const pid=PEERPID[peerId]; delete PEERPID[peerId];
  if(pid && REM[pid] && REM[pid].peer===peerId){ REM[pid].here=false; if(G){ emitState(); refreshHost(); } }
}
function refreshHost(){ if(!G) return; if(G.ph==='lobby') updatePlayers(); else if(G.ph==='vote') updateVotes(); }
function roster(){
  const all=[];
  G.locals.forEach(l=>{ if(G.order.indexOf(l.id)<0) G.order.push(l.id); G.names[l.id]=l.name; });
  G.order.forEach(id=>{
    const r=REM[id], l=G.locals.find(x=>x.id===id);
    if(r&&r.here) all.push({id,name:r.name,local:false,sel:r.vote?r.vote.s:null,rnd:r.vote?r.vote.rnd:null});
    else if(l) all.push({id,name:l.name,local:true});
  });
  const used={}; all.forEach(p=>{ used[p.name]=(used[p.name]||0)+1; if(used[p.name]>1) p.name=p.name+' ('+used[p.name]+')'; });
  return all;
}
function roundKey(){ return G.e+'.'+G.r; }
function currentVotes(){
  const v={}; roster().forEach(p=>{
    if(p.local){ const x=G.votes[p.id]; if(x&&x.rnd===roundKey()) v[p.id]={s:x.s}; }
    else if(p.rnd===roundKey() && p.sel!=null) v[p.id]={s:p.sel};
  }); return v;
}
function stateObj(){
  const ro=roster();
  const pay={t:'state',e:G.e,q:Date.now(),g:G.g,ph:G.ph,sid:G.sid,r:G.r,act:G.act,ro:ro.map(p=>[p.id,p.name])};
  if(G.ga){ pay.ga=G.ga; pay.pg=G.pg; pay.ev=G.ev; pay.rl=G.rl; }
  if(G.rv&&(G.ph==='reveal'||G.ph==='debate'||G.ph==='result')) pay.rv=G.rv;
  if(G.ph==='result'){ pay.fin=G.fin; pay.sc=G.lastSc; }
  if(G.ph==='pause'||G.ph==='alea'){ pay.pz=G.pz; }
  if(G.ph==='end'){ pay.sm=G.sm; pay.vd=G.vd; pay.fs=G.fs; }
  return pay;
}
function emitState(){ if(!H||!G) return; H.broadcast(stateObj()); }
function stopHost(){ if(H) H.destroy(); H=null; G=null; REM={}; PEERPID={}; ROLE=null; }
function nextActive(){ const ro=roster(); if(!ro.length) return null; const i=ro.findIndex(p=>p.id===G.act); return ro[(i+1)%ro.length].id; }
const isComite = ()=>gameOf(G.g).moteur==='comite';
function hostRender(){
  const f={lobby:hostLobby,turn:isComite()?hostTurnC:hostTurn,vote:isComite()?hostVoteC:hostVote,reveal:hostReveal,debate:hostDebate,result:hostResult,alea:hostAlea,pause:hostPause,end:isComite()?hostEndC:hostEnd}[G.ph];
  VIEW='host-'+G.ph; f();
}
function setPhase(ph){ G.ph=ph; persist(); hostRender(); emitState(); window.scrollTo(0,0); }
function hostBar(){ return brand('<button class="btn ghost sm" id="hq">Terminer</button>',gameOf(G.g).titre.toUpperCase()); }
function bindBar(){
  const b=$('#hq'); if(!b) return;
  b.onclick=()=>{
    if(b.dataset.armed){ endGame(); return; }
    b.dataset.armed='1'; b.textContent='Confirmer la fin'; b.style.borderColor='var(--warn)'; setTimeout(()=>{ if(b.isConnected){ b.dataset.armed=''; b.textContent='Terminer'; b.style.borderColor=''; } },3500);
  };
}
function playersHTML(opts){

function updatePlayers(){
  const el=$('#plist'); if(!el) return; el.innerHTML=playersHTML({remove:true});
  el.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ G.locals=G.locals.filter(l=>l.id!==b.dataset.rm); G.order=G.order.filter(i=>i!==b.dataset.rm); persist(); updatePlayers(); emitState(); });
  const n=roster().length, st=$('#start'); if(st) st.disabled = n<1;

function hostLobby(){
  const g=gameOf(G.g), local=LOCAL_ONLY();
  $('#app').innerHTML='<div class="wrap wide">'+hostBar()+
   '<div class="two"><div class="card col">'+
   (local?'<h2>Partie sur un seul écran</h2><p class="muted">Ajoutez les joueurs (ou les équipes). Quand une situation arrive, on passe le téléphone : chacun répond en secret.</p>':
   '<div class="row" style="align-items:flex-start;gap:18px"><div><div class="muted small" style="font-weight:800">CODE DE LA PARTIE</div><div class="code">'+esc(G.code.toUpperCase())+'</div></div>'+

   '<p class="muted">Les joueurs scannent le QR code (ou ouvrent <b>'+esc(location.host+location.pathname)+'</b>, « Rejoindre une partie ») et saisissent ce code et leur prénom.</p>')+
   '<div class="soft small"><b>Règle en bref.</b><ol style="margin:6px 0 0;padding-left:20px">'+g.regle.map(o=>'<li>'+esc(o)+'</li>').join('')+'</ol></div>'+
   '<p class="err small" id="warn" hidden>Plus de 5 joueurs : les pions n’existent qu’en 5 couleurs. Formez des équipes qui partagent un téléphone.</p>'+
   '</div><div class="card col"><div class="row" style="justify-content:space-between"><h3 style="font-size:22px">Joueurs (<span id="cnt">0</span>)</h3></div><div class="pl" id="plist"></div>'+
   '<div class="row" style="flex-wrap:nowrap"><input type="text" id="ln" maxlength="18" placeholder="Ajouter un joueur sur cet écran" aria-label="Prénom du joueur à ajouter"><button class="btn sm" id="la" style="flex:none">Ajouter</button></div>'+

  $('#la').onclick=add; $('#ln').onkeydown=e=>{ if(e.key==='Enter') add(); };
  $('#start').onclick=()=>{ const ro=roster(); G.act=ro[0].id; if(isComite()) assignRoles(); setPhase('turn'); };
}
function assignRoles(){
  const C=CONTENT[G.g], ro=roster(); const idx=shuffle(C.roles.map((_,i)=>i));
  G.rl={}; ro.forEach((p,i)=>{ G.rl[p.id]=idx[i%idx.length]; G.sc[p.id]=0; });
}
function votedCount(){ return Object.keys(currentVotes()).length; }
function updateVotes(){
  const el=$('#vlist'); if(!el) return; const v=currentVotes(), ro=roster();
  el.innerHTML=ro.map((p,i)=>'<div class="pr">'+swatch(i)+'<span class="nm">'+esc(p.name)+(p.id===G.act&&!isComite()?' <span class="tag">actif</span>':'')+'</span>'+
    (v[p.id]?'<span class="tag on">a répondu</span>':'<span class="tag">…</span>')+
    (p.local?'<button class="btn sm '+(v[p.id]?'ghost':'')+'" data-v="'+esc(p.id)+'">'+(v[p.id]?'Modifier':'Voter')+'</button>':'')+'</div>').join('');
  el.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>localVote(b.dataset.v));
  const n=Object.keys(v).length, rb=$('#rev'); if(rb){ rb.disabled=n<1; rb.textContent=(isComite()?'Révéler les votes (':'Révéler le corrigé (')+n+'/'+ro.length+')'; }
}
function localVote(pid){
  const g=gameOf(G.g), name=(roster().find(p=>p.id===pid)||{}).name||'';
  let sel=(G.votes[pid]&&G.votes[pid].rnd===roundKey())?G.votes[pid].s:null;
  const cv=document.createElement('div'); cv.className='cover'; cv.setAttribute('role','dialog'); cv.setAttribute('aria-label','Vote de '+name);
  document.body.appendChild(cv);
  const C=CONTENT[g.id];
  const draw=()=>{
    const head='<div class="card" style="text-align:center"><div class="muted small" style="font-weight:800">AU TOUR DE</div><h2 style="font-size:38px">'+esc(name)+'</h2><p class="muted">Les autres ne regardent pas l’écran.</p></div>';
    let inner;
    if(g.moteur==='choix'){ const c=C.cards[G.sid]; inner=cardHTML(c,G.r)+'<div class="card">'+optsVote(c,sel)+'</div>'; }
    else { const e=C.events[G.sid]; inner=roleCard(g,{rl:G.rl},pid)+evHTML(e,G.ev,C.nev)+'<div class="card">'+optsComite(e,sel)+'</div>'; }
    cv.innerHTML='<div class="wrap">'+head+inner+'<div class="row"><button class="btn grow" id="ok" '+(sel!=null?'':'disabled')+'>Valider et cacher</button><button class="btn ghost" id="x">Annuler</button></div></div>';
    cv.querySelectorAll('.op[data-k]').forEach(b=>b.onclick=()=>{ sel=+b.dataset.k; draw(); });
    $('#ok').onclick=()=>{ G.votes[pid]={s:sel,rnd:roundKey()}; persist(); cv.remove(); updateVotes(); };
    $('#x').onclick=()=>{ cv.remove(); };
  };
  draw();
}
function dealCard(kind,n){
  const key='deck_'+kind;
  if(!G[key]||!G[key].length){ G[key]=shuffle(Array.from({length:n},(_,i)=>i)); }
  return G[key].pop();
}

/* ---- Moteur A : écrans animateur */
function hostTurn(){

function drawSituation(){

}
function hostVote(){
  const g=gameOf(G.g), c=CONTENT[g.id].cards[G.sid];
  $('#app').innerHTML='<div class="wrap wide">'+hostBar()+
   '<div class="two"><div class="col">'+cardHTML(c,G.r)+'<div class="card"><div class="opts">'+c.o.map((o,i)=>'<div class="op" style="cursor:default"><span class="lt">'+LET[i]+'</span><span>'+esc(o[0])+'</span></div>').join('')+'</div></div><p class="hint">Lisez la situation et les options à voix haute. Chacun répond sur son téléphone, sans en parler.</p></div>'+

function reveal(){

function hostReveal(){
  const g=gameOf(G.g), c=CONTENT[g.id].cards[G.sid];
  const fake={ro:roster().map(p=>[p.id,p.name]),rv:G.rv,act:G.act,sid:G.sid};
  $('#app').innerHTML='<div class="wrap wide">'+hostBar()+
   '<div class="two"><div class="col">'+cardHTML(c,G.r)+'<div class="card col"><h3 style="font-size:20px">Corrigé</h3>'+optsCorr(c,null)+'<div class="note"><b>À retenir.</b> '+esc(c.w)+'</div></div></div><div class="col">'+
   resultsChoix(fake,g,null)+'<p class="hint">Chacun avance son pion du nombre de pas indiqué. Les pas bonus ne déclenchent aucune case. Animez la discussion : qui a hésité, et pourquoi ?</p>'+
   '<button class="btn block" id="nx">Joueur suivant</button></div></div></div>';
  bindBar();
  $('#nx').onclick=()=>{ G.act=nextActive(); setPhase('turn'); };
}
function statsOf(pid){
  let b=0, ok=0, tot=0, steps=0; const c=CONTENT[G.g].cards;
  G.hist.forEach(h=>{ const row=h.rows.find(r=>r[0]===pid); if(!row) return; tot++; const v=row[1]==null?null:c[h.i].o[row[1]][1]; if(v===2)b++; else if(v===1)ok++; steps+=row[3]; });
  return {b,ok,tot,steps};
}
function themeStats(){
  const c=CONTENT[G.g].cards, T={};
  G.hist.forEach(h=>{ const t=c[h.i].t; T[t]=T[t]||{n:0,b:0}; h.rows.forEach(r=>{ if(r[1]==null) return; T[t].n++; if(c[h.i].o[r[1]][1]===2) T[t].b++; }); });
  return Object.keys(T).map(t=>[t,T[t].n,T[t].b]).sort((a,b)=>(a[2]/a[1])-(b[2]/b[1]));
}
function endGame(){
  const ids=[...new Set(G.order)];
  if(isComite()){ finishComite(); return; }
  G.sm=ids.map(id=>{ const t=statsOf(id); return [id,G.names[id]||'?',t.b,t.ok,t.tot,t.steps]; }).filter(r=>r[4]>0);
  ls('bh-host',null);
  G.ph='end'; hostRender(); emitState(); window.scrollTo(0,0);
}
function hostEnd(){
  const g=gameOf(G.g), sm=G.sm||[], th=themeStats(), c=CONTENT[g.id].cards;
  const all=sm.reduce((a,r)=>[a[0]+r[2],a[1]+r[3],a[2]+r[4]],[0,0,0]);
  // situations les plus ratées
  const miss=G.hist.map(h=>{ let n=0,b=0; h.rows.forEach(r=>{ if(r[1]==null) return; n++; if(c[h.i].o[r[1]][1]===2) b++; }); return {h,n,b}; }).filter(x=>x.n&&x.b<x.n).sort((a,b)=>(a.b/a.n)-(b.b/b.n)).slice(0,3);
  $('#app').innerHTML='<div class="wrap wide">'+brand('<button class="btn ghost sm" id="nw">Nouvelle partie</button>',g.titre.toUpperCase())+
   '<div class="card col"><h2>Bilan de la partie</h2>'+
   '<div class="tw"><table><thead><tr><th>Joueur</th><th>Situations</th><th>Meilleur choix</th><th>Meilleur ou acceptable</th><th>Pas gagnés</th></tr></thead><tbody>'+
   sm.map(r=>'<tr><td><b>'+esc(r[1])+'</b></td><td>'+r[4]+'</td><td>'+pct(r[2],r[4])+'</td><td>'+pct(r[2]+r[3],r[4])+'</td><td>'+r[5]+'</td></tr>').join('')+'</tbody></table></div></div>'+
   '<div class="two"><div class="card col"><h3 style="font-size:20px">Réussite du groupe par thème</h3><p class="hint">Du plus difficile au plus facile.</p><div class="tw"><table><thead><tr><th>Thème</th><th>Réponses</th><th>Meilleur choix</th></tr></thead><tbody>'+th.map(t=>'<tr><td>'+esc(t[0])+'</td><td>'+t[1]+'</td><td>'+pct(t[2],t[1])+'</td></tr>').join('')+'</tbody></table></div></div>'+
   '<div class="card col"><h3 style="font-size:20px">Pour le débrief</h3>'+
   (all[2]?'<p>Le groupe a trouvé le meilleur choix <b>'+pct(all[0],all[2])+'</b> du temps, meilleur ou acceptable <b>'+pct(all[0]+all[1],all[2])+'</b>.</p>':'')+
   (miss.length?'<p><b>Situations qui ont divisé ou trompé le groupe :</b></p>'+miss.map(x=>'<div class="soft small"><b>'+esc(c[x.h.i].t)+'</b> · '+esc(c[x.h.i].x.slice(0,120))+'…<br><span class="muted">À retenir : '+esc(c[x.h.i].w)+'</span></div>').join(''):'')+
   '<div class="note small">'+esc(g.debrief)+'</div>'+
   '<button class="btn ghost" id="csv">Télécharger le détail (CSV)</button></div></div></div>';
  $('#nw').onclick=()=>{ const gid=G.g; stopHost(); viewGame(gid); };
  $('#csv').onclick=()=>{ const L=[['situation','theme','joueur','joueur_actif','reponse','resultat','pas']]; G.hist.forEach(h=>{ const cc=c[h.i]; h.rows.forEach(r=>{ const v=r[1]==null?'':cc.o[r[1]][1]; L.push([h.r,cc.t,G.names[r[0]]||'?',r[0]===h.act?'oui':'non',r[1]==null?'':LET[r[1]],v===2?'meilleur choix':v===1?'acceptable':v===''?'pas de réponse':'à revoir',r[3]]); }); }); csvDownload(G.g+'-'+G.code+'.csv',toCSV(L)); };
}

/* ---- Moteur B : écrans animateur */
function gaugesNow(){ return gaugeBar(gameOf(G.g),G.ga,G.pg); }
function hostTurnC(){
  const g=gameOf(G.g), C=CONTENT[g.id], ro=roster(), actName=(ro.find(p=>p.id===G.act)||{}).name||'?', ai=ro.findIndex(p=>p.id===G.act);
  $('#app').innerHTML='<div class="wrap wide">'+hostBar()+
   '<div class="two"><div class="col"><div class="card col" style="text-align:center"><div class="muted small" style="font-weight:800">DÉ DE L’ÉQUIPE · ÉVÉNEMENT '+G.ev+' / '+C.nev+' JOUÉ'+(G.ev>1?'S':'')+'</div>'+
   '<h2 style="font-size:38px">'+swatch(ai)+' '+esc(actName)+'</h2><p class="muted">lance le dé et avance le pion de l’équipe. Quelle case ?</p>'+
   '<button class="btn block" id="draw">Case « ? » : tirer un événement</button>'+
   '<div class="row" style="flex-wrap:nowrap"><button class="btn ghost grow" id="al">Case Imprévu</button><button class="btn ghost grow" id="pz">Case Pause café</button></div>'+
   '<button class="btn ghost block" id="skip">Passer au joueur suivant</button>'+
   (G.ev>=C.nev?'<div class="soft"><b>Objectif de durée atteint.</b> Vous pouvez terminer la partie (bouton en haut) ou jouer un événement de plus.</div>':'')+'</div></div>'+
   '<div class="card col">'+gaugesNow()+'<p class="hint">Le pion de l’équipe fait un tour du plateau (36 cases), puis la partie se termine.</p></div></div></div>';
  bindBar();
  $('#draw').onclick=drawEvent; $('#skip').onclick=()=>{ G.act=nextActive(); persist(); hostTurnC(); emitState(); };
  $('#al').onclick=()=>{ const C2=CONTENT[G.g]; G.sid=dealCard('a',C2.aleas.length); G.r++; applyFx(C2.aleas[G.sid].fx); G.log.push({k:'alea',i:G.sid}); if(!checkZero()) setPhase('alea'); };
  $('#pz').onclick=()=>{ G.pz=null; G.r++; setPhase('pause'); };
}
function applyFx(fx){
  const C=CONTENT[G.g]; G.pg=G.ga.slice();
  Object.keys(fx||{}).forEach(k=>{ const i=C.gauges.findIndex(x=>x.k===k); G.ga[i]=Math.max(0,Math.min(10,G.ga[i]+fx[k])); });
}
function checkZero(){ if(G.ga.some(v=>v<=0)){ G.zero=true; persist(); finishComite(); return true; } return false; }
function drawEvent(){
  const C=CONTENT[G.g];
  G.sid=dealCard('e',C.events.length); G.r++; G.ev++; G.votes={}; G.rv=null; G.fin=null;
  setPhase('vote');
}
function hostVoteC(){
  const g=gameOf(G.g), C=CONTENT[g.id], e=C.events[G.sid];
  $('#app').innerHTML='<div class="wrap wide">'+hostBar()+
   '<div class="two"><div class="col">'+evHTML(e,G.ev,C.nev)+'<div class="card"><div class="opts">'+e.o.map((o,i)=>'<div class="op" style="cursor:default"><span class="lt">'+LET[i]+'</span><span>'+esc(o.t)+'</span></div>').join('')+'</div></div><p class="hint">Lisez l’événement et les options. Chacun vote en secret sur son téléphone, en pensant à son rôle.</p></div>'+
   '<div class="col"><div class="card col">'+gaugesNow()+'</div><div class="card col"><h3 style="font-size:22px">Votes</h3><div class="pl" id="vlist"></div>'+
   '<button class="btn block" id="rev" disabled>Révéler les votes</button><button class="btn ghost sm" id="redraw" style="align-self:flex-start">Autre événement</button></div></div></div></div>';
  bindBar(); updateVotes();
  $('#rev').onclick=()=>{ const v=currentVotes(), ro=roster(); G.rv=ro.map(p=>[p.id,v[p.id]?v[p.id].s:null,null,0]); setPhase('debate'); };
  $('#redraw').onclick=()=>{ G.ev--; drawEvent(); };
}
function hostDebate(){
  const g=gameOf(G.g), C=CONTENT[g.id], e=C.events[G.sid], ro=roster();
  const cnt=e.o.map((_,i)=>G.rv.filter(r=>r[1]===i).length), max=Math.max(...cnt), lead=cnt.indexOf(max), tie=cnt.filter(x=>x===max).length>1;
  $('#app').innerHTML='<div class="wrap wide">'+hostBar()+
   '<div class="two"><div class="col">'+evHTML(e,G.ev,C.nev)+'<div class="card col"><h3 style="font-size:20px">Débat : 90 secondes pour décider</h3><div class="tm" id="tm">1:30</div>'+
   '<p class="hint">Chacun défend son vote. L’équipe doit se mettre d’accord sur une seule option. '+(tie?'Les votes sont partagés.':'L’option '+LET[lead]+' arrive en tête.')+'</p>'+
   '<div class="opts">'+e.o.map((o,i)=>'<button class="op" data-f="'+i+'"><span class="lt">'+LET[i]+'</span><span>'+esc(o.t)+'<span class="tg2">'+cnt[i]+' vote'+(cnt[i]>1?'s':'')+'</span></span></button>').join('')+'</div>'+
   '<p class="hint">Touchez l’option choisie par le groupe pour appliquer la décision.</p></div></div>'+
   '<div class="col"><div class="card col">'+gaugesNow()+'</div><div class="card col"><h3 style="font-size:20px">Qui a voté quoi</h3>'+G.rv.map(r=>'<div class="pr">'+swatch(ro.findIndex(p=>p.id===r[0]))+'<span class="nm">'+esc(G.names[r[0]]||'?')+' <span class="muted tiny">'+esc(C.roles[G.rl[r[0]]].n)+'</span></span><span class="chip">'+(r[1]==null?'—':LET[r[1]])+'</span></div>').join('')+'</div></div></div></div>';
  bindBar();
  setPhaseTimer();
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>decide(+b.dataset.f));
  emitState();
}
let TMR=null;
function setPhaseTimer(){
  clearInterval(TMR); let t=90; const el=()=>$('#tm');
  TMR=setInterval(()=>{ const x=el(); if(!x){ clearInterval(TMR); return; } t=Math.max(0,t-1); x.textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0'); if(t===0) clearInterval(TMR); },1000);
}
function decide(i){
  clearInterval(TMR);
  const C=CONTENT[G.g], e=C.events[G.sid], o=e.o[i];
  G.pg=G.ga.slice(); applyFx(o.fx);
  G.fin=i;
  const sc=[];
  G.rv.forEach(r=>{ const rid_=r[0], role=C.roles[G.rl[rid_]]; let pts=0; if(o.fx&&o.fx[role.f]>0) pts++; if(r[1]===i) pts++; G.sc[rid_]=(G.sc[rid_]||0)+pts; sc.push([rid_,pts]); });
  G.lastSc=sc;
  G.log.push({k:'ev',i:G.sid,fin:i,votes:G.rv.map(r=>[r[0],r[1]]),rec:!!o.rec});
  G.hist.push({i:G.sid,r:G.r,act:G.act,rows:G.rv,fin:i});
  if(checkZero()) return;
  setPhase('result');
}
function hostResult(){
  const g=gameOf(G.g), C=CONTENT[g.id], e=C.events[G.sid], ro=roster();
  $('#app').innerHTML='<div class="wrap wide">'+hostBar()+
   '<div class="two"><div class="col">'+evHTML(e,G.ev,C.nev)+'<div class="card col"><h3 style="font-size:20px">Décision et conséquences</h3>'+optsComiteCorr(g,e,G.fin,null)+'<div class="note"><b>Repère.</b> '+esc(e.rep)+'</div></div></div>'+
   '<div class="col"><div class="card col">'+gaugesNow()+'</div><div class="card col"><h3 style="font-size:20px">Points personnels de cet événement</h3>'+(G.lastSc||[]).map(r=>'<div class="pr">'+swatch(ro.findIndex(p=>p.id===r[0]))+'<span class="nm">'+esc(G.names[r[0]]||'?')+'</span><b>+'+r[1]+'</b></div>').join('')+'</div>'+
   '<button class="btn block" id="nx">Joueur suivant</button></div></div></div>';
  bindBar(); $('#nx').onclick=()=>{ G.act=nextActive(); setPhase('turn'); };
}
function hostAlea(){
  const g=gameOf(G.g), C=CONTENT[g.id], a=C.aleas[G.sid];
  $('#app').innerHTML='<div class="wrap">'+hostBar()+'<div class="card col"><span class="pill" style="background:#8B4FC9;color:#fff;align-self:flex-start">Imprévu</span><h2 style="font-size:28px">'+esc(a.t)+'</h2><p class="sit">'+esc(a.x)+'</p><div>'+fxHTML(g,a.fx)+'</div></div><div class="card col">'+gaugesNow()+'</div><button class="btn block" id="nx">Joueur suivant</button></div>';
  bindBar(); $('#nx').onclick=()=>{ G.act=nextActive(); setPhase('turn'); };
}
function hostPause(){
  const g=gameOf(G.g), C=CONTENT[g.id];
  $('#app').innerHTML='<div class="wrap">'+hostBar()+'<div class="card col"><span class="pill" style="background:#8A5A3C;color:#fff;align-self:flex-start">Pause café</span><p class="sit">Le groupe souffle. Choisissez ensemble une jauge à remonter de +1.</p>'+
   '<div class="opts">'+C.gauges.map((x,i)=>'<button class="op" data-z="'+i+'" '+(G.ga[i]>=10?'disabled':'')+'><span class="lt">+1</span><span>'+esc(x.n)+' ('+G.ga[i]+'/10)</span></button>').join('')+'</div></div><div class="card col">'+gaugesNow()+'</div></div>';
  bindBar(); document.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{ const i=+b.dataset.z; G.pz=i; applyFx({[C.gauges[i].k]:1}); G.log.push({k:'pause',z:i}); G.act=nextActive(); setPhase('turn'); });
}
function finishComite(){
  const C=CONTENT[G.g], ro=roster();
  const lose=G.ga.some(v=>v<=0)||G.zero, win=!lose&&G.ga.every(v=>v>=5);
  G.vd=lose?'lose':win?'win':'part';
  G.fs=ro.map(p=>{ const role=C.roles[G.rl[p.id]]; const gi=C.gauges.findIndex(x=>x.k===role.f); const ok=!lose&&G.ga[gi]>=7; return [p.id,(G.sc[p.id]||0)+(ok?3:0),ok]; });
  clearInterval(TMR); ls('bh-host',null);
  G.ph='end'; hostRender(); emitState(); window.scrollTo(0,0);
}
function hostEndC(){
  const g=gameOf(G.g), C=CONTENT[g.id], st=stateObj(), ev=G.log.filter(x=>x.k==='ev');
  const rec=ev.filter(x=>x.rec).length, split=ev.filter(x=>new Set(x.votes.map(v=>v[1])).size>1).length;
  const low=C.gauges.map((x,i)=>[x.n,G.ga[i]]).sort((a,b)=>a[1]-b[1])[0];
  $('#app').innerHTML='<div class="wrap wide">'+brand('<button class="btn ghost sm" id="nw">Nouvelle partie</button>',g.titre.toUpperCase())+
   '<div class="two"><div class="col">'+endComiteHTML(st,g,null)+'</div><div class="col"><div class="card col"><h3 style="font-size:20px">Jauges finales</h3>'+gaugeBar(g,G.ga,null)+'</div>'+
   '<div class="card col"><h3 style="font-size:20px">Pour le débrief</h3>'+
   '<p>'+ev.length+' événement'+(ev.length>1?'s':'')+' décidé'+(ev.length>1?'s':'')+', dont <b>'+rec+'</b> avec l’option recommandée et <b>'+split+'</b> avec des votes partagés.</p>'+
   '<p>Jauge la plus basse : <b>'+esc(low[0])+'</b> ('+low[1]+'/10).</p>'+
   '<div class="note small">'+esc(g.debrief)+'</div><button class="btn ghost" id="csv">Télécharger le détail (CSV)</button></div></div></div></div>';
  $('#nw').onclick=()=>{ const gid=G.g; stopHost(); viewGame(gid); };
  $('#csv').onclick=()=>{ const L=[['evenement','theme','decision','recommandee','votes']]; ev.forEach((x,n)=>{ const e=C.events[x.i]; L.push([n+1,e.t,LET[x.fin]+' '+e.o[x.fin].t,x.rec?'oui':'non',x.votes.map(v=>(G.names[v[0]]||'?')+':'+(v[1]==null?'-':LET[v[1]])).join(' | ')]); }); csvDownload(G.g+'-'+G.code+'.csv',toCSV(L)); };
}
window.__BH={get G(){return G}};
const q0=qs.get('g'), r0=qs.get('room');
if(r0 && hasPeer) viewJoin(r0,q0&&gameOf(q0)?q0:''); else if(q0&&gameOf(q0)) viewGame(q0); else viewHub();
</script>
